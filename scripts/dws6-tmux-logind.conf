# /etc/systemd/logind.conf.d/dws6-tmux.conf
# DWS6: Prevent systemd from killing tmux sessions on idle
# Extends session lifetime from 30min to 48h (172800 seconds)
# Evidence: Tool=OpenCode Model=opencode/x-preview-f-free Agent=ox-alpha Date=2026-08-29
#
# Apply on DGX:
#   sudo mkdir -p /etc/systemd/logind.conf.d/
#   sudo cp scripts/dws6-tmux-logind.conf /etc/systemd/logind.conf.d/dws6-tmux.conf
#   sudo systemctl restart systemd-logind
#
# Verify:
#   systemctl show systemd-logind | grep -E "Idle|Kill|Stop"

[Login]
IdleAction=ignore
IdleActionSec=172800
KillUserProcesses=no
StopIdleSessionSec=infinity
RemoveIPC=no
