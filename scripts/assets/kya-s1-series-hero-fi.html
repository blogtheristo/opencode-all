<!doctype html><html lang="fi"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;background:#0b1220;font-family:"DejaVu Sans",system-ui,sans-serif;color:#e8eef7;padding:34px 34px 28px}
.hd{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid #1f3350;padding-bottom:14px;margin-bottom:20px}
h1{font-size:29px;font-weight:800;letter-spacing:-.3px;color:#fff}
.sub{font-size:13px;color:#7e93ad;letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.c{background:#111c2e;border:1px solid #22344f;border-left:3px solid var(--a);border-radius:7px;padding:13px 14px;display:flex;gap:11px;min-height:112px}
.n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--a);color:#08111d;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.t{font-size:14.5px;font-weight:700;color:#fff;line-height:1.28;margin-bottom:5px}
.d{font-size:12.3px;color:#93a7c0;line-height:1.42}
.k{display:inline-block;margin-top:6px;font-size:10.5px;letter-spacing:.07em;color:var(--a);border:1px solid var(--a);border-radius:3px;padding:1px 5px;opacity:.85}
.ft{margin-top:20px;padding-top:13px;border-top:1px solid #1f3350;display:flex;gap:16px;font-size:11.5px;color:#6f849e}
.ft b{color:#9db6d4;font-weight:600}
</style></head><body>
