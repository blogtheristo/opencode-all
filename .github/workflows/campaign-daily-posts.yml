name: Daily Campaign Post Generator

on:
  # Schedule REMOVED 2026-04-08 — DGX Spark is primary (scripts/daily/generate-campaign-post.sh)
  # GitHub Actions was failover only, consuming ~480 min/month even on skip checks.
  # Was: cron '0 3 * * *' + '0 4 * * *' (2x daily for DST coverage)
  workflow_dispatch:
    inputs:
      day_number:
        description: 'Specific day number (1-800), or leave empty for auto-detect'
        required: false
      batch_start:
        description: 'Batch start day (use with batch_end for range)'
        required: false
      batch_end:
        description: 'Batch end day (use with batch_start for range)'
        required: false

env:
  CAMPAIGN_START_DATE: '2026-03-16'
  NODE_VERSION: '24'

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      campaign_day: ${{ steps.calc-day.outputs.day }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true

      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ secrets.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX Spark is handling this
        if: steps.failover.outputs.dgx_alive == 'true' && github.event_name == 'schedule'
        run: |
          echo "DGX Spark is alive — skipping GitHub Actions (failover mode)"
          exit 0

      - name: Helsinki time guard
        id: time-check
        run: |
          HELSINKI_HOUR=$(TZ='Europe/Helsinki' date +%H)
          echo "Helsinki hour: $HELSINKI_HOUR"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HELSINKI_HOUR" != "06" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: Helsinki hour is $HELSINKI_HOUR, not 06"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.time-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log mining

      - name: Setup Node.js
        if: steps.time-check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.time-check.outputs.skip != 'true'
        run: npm ci

      - name: Calculate campaign day
        if: steps.time-check.outputs.skip != 'true'
        id: calc-day
        run: |
          START="2026-03-16"
          TODAY=$(date +%Y-%m-%d)
          DAY_NUM=$(( ($(date -d "$TODAY" +%s) - $(date -d "$START" +%s)) / 86400 + 1 ))
          echo "day=$DAY_NUM" >> $GITHUB_OUTPUT
          echo "Campaign day: $DAY_NUM"

          # Check if campaign is active
          if [ "$DAY_NUM" -lt 1 ] || [ "$DAY_NUM" -gt 800 ]; then
            echo "active=false" >> $GITHUB_OUTPUT
            echo "Campaign not active (day $DAY_NUM out of 1-800 range)"
          else
            echo "active=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate post(s)
        if: steps.time-check.outputs.skip != 'true' && steps.calc-day.outputs.active == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAMPAIGN_START_DATE: ${{ env.CAMPAIGN_START_DATE }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_END: ${{ inputs.batch_end }}
          DAY_NUMBER: ${{ inputs.day_number }}
          CALCULATED_DAY: ${{ steps.calc-day.outputs.day }}
        run: |
          if [ -n "$BATCH_START" ] && [ -n "$BATCH_END" ]; then
            echo "Batch mode: days $BATCH_START-$BATCH_END"
            args=(npx tsx scripts/generate-campaign-post.ts --batch "$BATCH_START" "$BATCH_END")
            "${args[@]}"
          elif [ -n "$DAY_NUMBER" ]; then
            echo "Single day mode: day $DAY_NUMBER"
            args=(npx tsx scripts/generate-campaign-post.ts --day "$DAY_NUMBER")
            "${args[@]}"
          else
            echo "Auto mode: day $CALCULATED_DAY"
            args=(npx tsx scripts/generate-campaign-post.ts --day "$CALCULATED_DAY")
            "${args[@]}"
          fi
      - name: Commit and push
        if: steps.time-check.outputs.skip != 'true' && steps.calc-day.outputs.active == 'true'
        run: |
          git config user.name "DWS Campaign Bot"
          git config user.email "risto@onelifetime.world"

          # Stage new/changed post files
          git add onelifetime.world/posts/en/ onelifetime.world/posts/fi/ \
                  landing-pages/onelifetime-world/posts/en/ landing-pages/onelifetime-world/posts/fi/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new posts to commit"
          else
            DAY="${{ steps.calc-day.outputs.day }}"
            git commit -m "campaign: auto-generate Day ${DAY} posts (EN + FI)

Pillar: $(( (DAY - 1) % 10 + 1 )) of 10
Phase: $([ $DAY -le 100 ] && echo 'Foundation' || ([ $DAY -le 300 ] && echo 'Depth' || ([ $DAY -le 500 ] && echo 'Engagement' || echo 'Authority')))"

            git push origin main
          fi

      - name: Create PR for review (optional)
        if: steps.time-check.outputs.skip != 'true' && steps.calc-day.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ steps.calc-day.outputs.day }}"
          # Only create PR for batch runs or manual triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="campaign/day-${DAY}-posts"
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "Campaign Day ${DAY}: auto-generated posts" \
              --body "Auto-generated EN + FI posts for Day ${DAY} of the 800-day campaign.

Review within 24 hours or posts auto-publish." \
              --label "campaign,content" || true
          fi

  # ─── Failure notification ───────────────────────────────────────
  notify-on-failure:
    needs: generate-post
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout for email script
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send failure email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AWS_SES_SMTP_USER: ${{ secrets.AWS_SES_SMTP_USER }}
          AWS_SES_SMTP_PASS: ${{ secrets.AWS_SES_SMTP_PASS }}
          AWS_SES_SMTP_HOST: ${{ secrets.AWS_SES_SMTP_HOST }}
          EMAIL_FROM: 'risto@onelifetime.world'
        run: |
          npx tsx -e "
          import { sendEmail } from './src/utils/send-email.js';
          import dotenv from 'dotenv';
          dotenv.config();

          await sendEmail({
            to: 'risto@lifetime.fi',
            from: process.env.EMAIL_FROM || 'risto@onelifetime.world',
            subject: '🚨 Campaign Post Generator FAILED — Day ${{ needs.generate-post.outputs.campaign_day || 'unknown' }}',
            html: '<h2>Campaign Post Generator Failed</h2>' +
              '<p><strong>Workflow:</strong> campaign-daily-posts.yml</p>' +
              '<p><strong>Run:</strong> <a href=\"https://github.com/blogtheristo/dws6/actions/runs/${{ github.run_id }}\">View logs</a></p>' +
              '<p><strong>Time:</strong> ' + new Date().toISOString() + '</p>' +
              '<p>Check the workflow logs for details. Posts were NOT published.</p>',
            text: 'Campaign Post Generator Failed. Check: https://github.com/blogtheristo/dws6/actions/runs/${{ github.run_id }}'
          });
          console.log('Failure notification sent');
          "
