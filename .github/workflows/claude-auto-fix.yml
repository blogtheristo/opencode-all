name: Claude Auto-Fix

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Store/**'
      - 'Learn/**'
      - '.github/workflows/**.disabled'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for Claude to perform'
        required: true
        type: string
      allowed_tools:
        description: 'Comma-separated allowed tools'
        required: false
        default: 'Read,Edit,Bash(npm run lint),Bash(npm run test),Bash(npm run build)'
        type: string

# Cancel earlier in-flight auto-fix runs when a new commit is pushed.
# claude-auto-fix is the largest per-PR minute consumer (npm ci + Claude CLI install
# + full lint/test). Cancellation prevents stacking on rapid-fire pushes.
concurrency:
  group: claude-auto-fix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-fix:
    name: Claude Auto-Fix
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 10
    # Skip bot-triggered events to prevent fix loops.
    # Skip drafts — only run once a PR is marked ready for review.
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'copilot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Check for skip-ci in last commit
        id: skip_check
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -q '\[skip ci\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Anthropic API key
        id: anthropic
        if: steps.skip_check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY not configured — skipping Claude auto-fix"
          fi

      - name: Setup Node.js
        if: steps.skip_check.outputs.skip != 'true' && steps.anthropic.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.skip_check.outputs.skip != 'true' && steps.anthropic.outputs.ok == 'true'
        run: npm ci

      - name: Install Claude Code CLI
        if: steps.skip_check.outputs.skip != 'true' && steps.anthropic.outputs.ok == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Auto-Fix
        if: steps.skip_check.outputs.skip != 'true' && steps.anthropic.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_TASK: ${{ github.event.inputs.task || 'Run lint and tests, fix any errors found' }}
          CLAUDE_ALLOWED_TOOLS: ${{ github.event.inputs.allowed_tools || 'Read,Edit,Bash(npm run lint),Bash(npm run test),Bash(npm run build)' }}
        run: |
          TASK="$CLAUDE_TASK"
          TOOLS="$CLAUDE_ALLOWED_TOOLS"

          echo "Task: $TASK"
          echo "Allowed tools: $TOOLS"

          claude -p "$TASK" \
            --allowedTools "$TOOLS" \
            --output-format json \
            > claude-output.json 2>&1 || true

          # Log output (truncate if too large)
          head -c 50000 claude-output.json

      - name: Commit fixes
        if: steps.skip_check.outputs.skip != 'true' && steps.anthropic.outputs.ok == 'true'
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-bot@dws6.com"
          if [ -n "$(git status --porcelain)" ]; then
            # Stage only source files, not logs or artifacts
            git add -A -- ':!claude-output.json'
            git commit -m "fix: auto-fix by Claude Code [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
