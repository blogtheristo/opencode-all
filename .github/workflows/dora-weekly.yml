# Evidence: Tool=GitHub Copilot CLI 1.0.88 Model=openai/gpt-5.6-sol Agent=lane-d-dgx-persistence Date=2026-09-27
# Audit trail: git log -- .github/workflows/dora-weekly.yml
# DORA Dashboard — Weekly Metrics Report
#
# Calculates DORA metrics (lead time, deployment frequency, change failure rate, MTTR)
# and updates docs/dora-dashboard.md through DGX Spark weekly auto-discovery.
#
# Metrics are non-blocking: failures do not stop deployments.

name: DORA Weekly Metrics

on:
  # Schedule REMOVED 2026-09-27 — DGX Spark is primary (scripts/weekly/dora-dashboard.sh)
  # Was: cron '0 9 * * 1' (Monday at 09:00 UTC)
  workflow_dispatch:
    inputs:
      force_report:
        description: "Force report generation even if recent"
        required: false
        type: boolean

jobs:
  calculate-metrics:
    name: Calculate DORA Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git log analysis

      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ vars.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX is primary
        if: steps.failover.outputs.dgx_alive == 'true'
        run: echo "DGX Spark is healthy — DORA metrics run there."

      - name: Set up Node.js
        if: steps.failover.outputs.dgx_alive != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.failover.outputs.dgx_alive != 'true'
        run: npm ci --ignore-scripts

      - name: Calculate DORA Metrics
        if: steps.failover.outputs.dgx_alive != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run dora:metrics

      - name: Commit updated dashboard
        if: steps.failover.outputs.dgx_alive != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add docs/dora-dashboard.md
          git diff-index --quiet HEAD || git commit -m "metrics: update DORA dashboard for week $(date +%Y-%m-%d)"

      - name: Push changes
        if: steps.failover.outputs.dgx_alive != 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Report metrics summary
        if: always() && steps.failover.outputs.dgx_alive != 'true'
        run: |
          echo "## 📊 DORA Metrics Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Metrics calculation complete" >> $GITHUB_STEP_SUMMARY
          echo "📄 See: [DORA Dashboard](docs/dora-dashboard.md)" >> $GITHUB_STEP_SUMMARY
