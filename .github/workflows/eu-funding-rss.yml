# EU Funding & Tenders RSS → grants/funding list.
# GitHub-hosted runners have open egress to ec.europa.eu, so this workflow
# fetches the live call-updates feed, builds the Markdown + JSON list, and
# uploads it as a downloadable artifact. No secrets required (public feed).
#
# Sibling of ted-pipeline.yml. Manual-only on both runtimes as of 2026-07-18
# (SEDIA source is broken — see schedule note below); invoke
# scripts/eu-funding-rss-daily.sh directly on DGX, or workflow_dispatch here.

name: EU Funding RSS

on:
  # Schedule REMOVED 2026-07-18 — SEDIA fetch is broken (every request encoding
  # tested 500s or silently ignores the query filter; see commit history on
  # this branch / data/eu-funding/all-horizon-open-forthcoming-grants.md).
  # A daily cron against a non-working fetch just burns CI minutes on
  # guaranteed failures. Re-enable once scripts/eu-funding-rss.ts actually
  # returns filtered results (needs a real browser DevTools "Copy as cURL"
  # capture of the portal's search POST — see PR #1702).
  # Was: cron '15 6 * * *' (daily at 06:15 UTC)
  workflow_dispatch:
    inputs:
      status:
        description: 'Status filter (e.g. open, forthcoming). Blank = all.'
        required: false
        default: ''
        type: string
      grep:
        description: 'Keyword filter on title/description. Blank = all.'
        required: false
        default: ''
        type: string
      limit:
        description: 'Keep only the first N items. Blank = all.'
        required: false
        default: ''
        type: string
      verbose:
        description: 'Print a line per item in the log.'
        required: false
        default: false
        type: boolean
      debug_raw:
        description: 'Log the raw SEDIA response shape (diagnostic).'
        required: false
        default: false
        type: boolean
      probe:
        description: 'Probe SEDIA request encodings and log which returns 200.'
        required: false
        default: false
        type: boolean

jobs:
  funding-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch EU Funding & Tenders RSS
        env:
          EU_FUNDING_STATUS: ${{ github.event.inputs.status }}
          EU_FUNDING_GREP: ${{ github.event.inputs.grep }}
          EU_FUNDING_LIMIT: ${{ github.event.inputs.limit }}
          EU_FUNDING_VERBOSE: ${{ github.event.inputs.verbose }}
          EU_FUNDING_DEBUG_RAW: ${{ github.event.inputs.debug_raw }}
          EU_FUNDING_PROBE: ${{ github.event.inputs.probe }}
        run: bash scripts/eu-funding-rss-daily.sh

      - name: Upload grants/funding list
        uses: actions/upload-artifact@v4
        with:
          name: eu-funding-grants
          path: data/eu-funding/grants-funding.*
          if-no-files-found: error
