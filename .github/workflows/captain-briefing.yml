# Captain Pre-Briefing — Automated Pre-Call Prep
#
# PRIMARY DELIVERY: Local script (scripts/run-morning-emails.ps1 / .sh)
# This workflow is kept as a MANUAL FALLBACK only.
# Scheduled crons disabled 2026-03-27 to save Actions minutes.

name: Captain Pre-Briefing

on:
  # DISABLED — delivery moved to local machine (2026-03-27).
  # schedule:
  #   - cron: '30 4 * * 1-5'
  #   - cron: '30 5 * * 1-5'

  workflow_dispatch:
    inputs:
      captain_name:
        description: 'Captain name (leave empty for auto-mode)'
        required: false
        type: string
      recipient:
        description: 'Override recipient email (optional)'
        required: false
        type: string

jobs:
  send-briefing:
    name: Send Captain Pre-Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Captain Pre-Briefing
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM: risto@onelifetime.world
          CAPTAIN_BRIEFING_EMAIL: ${{ inputs.recipient || secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
        run: |
          if [ -n "${{ inputs.captain_name }}" ]; then
            npx tsx scripts/send-captain-briefing.ts "${{ inputs.captain_name }}"
          else
            npx tsx scripts/send-captain-briefing.ts --auto
          fi
