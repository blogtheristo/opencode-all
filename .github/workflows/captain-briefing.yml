# Captain Pre-Briefing — Automated Pre-Call Prep
#
# Runs at 07:30 Helsinki time, Mon-Fri.
# Finds all captains with next_action_date = today and sends
# a pre-briefing email for each one.
#
# Also supports manual trigger for a specific captain name.

name: Captain Pre-Briefing

on:
  schedule:
    - cron: '30 4 * * 1-5'   # 07:30 Helsinki in summer (EEST, UTC+3)
    - cron: '30 5 * * 1-5'   # 07:30 Helsinki in winter (EET, UTC+2)

  workflow_dispatch:
    inputs:
      captain_name:
        description: 'Captain name (leave empty for auto-mode)'
        required: false
        type: string
      recipient:
        description: 'Override recipient email (optional)'
        required: false
        type: string

jobs:
  send-briefing:
    name: Send Captain Pre-Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Captain Pre-Briefing
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'risto@onelifetime.world' }}
          CAPTAIN_BRIEFING_EMAIL: ${{ inputs.recipient || secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
        run: |
          if [ -n "${{ inputs.captain_name }}" ]; then
            npx tsx scripts/send-captain-briefing.ts "${{ inputs.captain_name }}"
          else
            npx tsx scripts/send-captain-briefing.ts --auto
          fi
