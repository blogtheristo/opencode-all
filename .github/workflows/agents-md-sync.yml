name: AGENTS.md Auto-Sync

on:
  push:
    branches: [main]
    paths:
      - "src/agents/**"
      - "package.json"
      - ".github/workflows/**"
      - "mcp-hub/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: chore/agents-md-sync
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run AGENTS.md auto-sync
        run: node scripts/sync-agents-md.mjs

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet AGENTS.md && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Open or update the sync pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job used to `git push` straight to main. main requires a pull
          # request, so every run ended in:
          #   ! [remote rejected] main -> main (push declined due to repository
          #     rule violations)
          # It therefore never synced anything. It now proposes the change
          # instead, and a human merges it.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$SYNC_BRANCH"
          git add AGENTS.md
          git commit -m "chore: auto-sync AGENTS.md from codebase"

          # The sync branch is bot-owned and rebuilt from main on every run —
          # scripts/sync-agents-md.mjs regenerates AGENTS.md deterministically
          # from the tree, so the previous attempt carries no information worth
          # keeping. A force update of THIS branch is therefore safe; main is
          # never pushed to. --force-with-lease so a concurrent run cannot be
          # silently clobbered.
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$SYNC_BRANCH"
            git push --force-with-lease="$SYNC_BRANCH:$(git rev-parse FETCH_HEAD)" \
              origin "HEAD:refs/heads/$SYNC_BRANCH"
          else
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

          # One standing PR, updated in place, rather than a new one per run.
          if [ -n "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing sync pull request updated with the new AGENTS.md."
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: auto-sync AGENTS.md from codebase" \
              --body "$(printf '%s\n\n%s\n\n%s' \
                'Generated by `.github/workflows/agents-md-sync.yml` from `scripts/sync-agents-md.mjs`. AGENTS.md had drifted from the codebase.' \
                'This job previously pushed directly to `main`, which the repository rules reject ("Changes must be made through a pull request"), so it never synced anything. It now proposes the change for a human to merge.' \
                'The branch is rebuilt from `main` on every run, so this PR always reflects the current tree rather than accumulating history.')"
          fi

      - name: Report when already in sync
        if: steps.diff.outputs.changed == 'false'
        run: echo "AGENTS.md is already in sync with the codebase; nothing to propose."
