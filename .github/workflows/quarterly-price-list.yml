name: Quarterly Price List Stamp

# ============================================================================
# Quarterly Price List Stamp — generates a new stamped price-list snapshot
# on the first day of each calendar quarter (Jan 1, Apr 1, Jul 1, Oct 1) at
# 06:00 UTC.
#
# Primary runtime is DGX Spark via scripts/daily/price-list-quarterly-gate.sh.
# This workflow is the failover (GitHub Actions) per CLAUDE.md Script
# Automation Rule: "GitHub Actions workflows are failover only — DGX Spark
# is primary."
#
# This workflow does NOT send emails. Email dispatch is RED-zone (human
# required). Run scripts/send-price-list-email.ts manually after reviewing
# the generated snapshot and the opened PR.
# ============================================================================

on:
  # Schedule REMOVED 2026-05-25 (#1384) — DGX Spark is primary (scripts/daily/price-list-quarterly-gate.sh)
  # Was: cron '0 6 1 1,4,7,10 *' (quarterly on 1st at 06:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Force a stamp roll even if version already matches"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DGX Spark cron-runner runs the primary quarterly stamp.
      # This GHA workflow is failover only; skip if DGX is alive.
      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ vars.DGX_SPARK_HEARTBEAT_URL }}

      - name: Setup Node
        if: steps.failover.outputs.dgx_alive != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Derive quarter for today
        if: steps.failover.outputs.dgx_alive != 'true'
        id: q
        run: |
          YEAR=$(date -u +%Y); MONTH=$(date -u +%m); DAY=$(date -u +%d)
          case "$MONTH" in
            01) Q=1; STAMP="${YEAR}-01-01"; VALID="${YEAR}-03-31"; NEXT="${YEAR}-04-01" ;;
            04) Q=2; STAMP="${YEAR}-04-01"; VALID="${YEAR}-06-30"; NEXT="${YEAR}-07-01" ;;
            07) Q=3; STAMP="${YEAR}-07-01"; VALID="${YEAR}-09-30"; NEXT="${YEAR}-10-01" ;;
            10) Q=4; STAMP="${YEAR}-10-01"; VALID="${YEAR}-12-31"; NY=$((YEAR+1)); NEXT="${NY}-01-01" ;;
            *)  echo "Not a quarter-start month (${MONTH}); exiting."; exit 0 ;;
          esac
          VERSION="${YEAR}.Q${Q}"
          STAMP_QUARTER="Q${Q} ${YEAR}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stamp_quarter=${STAMP_QUARTER}" >> "$GITHUB_OUTPUT"
          echo "stamp_date=${STAMP}" >> "$GITHUB_OUTPUT"
          echo "valid_until=${VALID}" >> "$GITHUB_OUTPUT"
          echo "next_review=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check if roll is needed
        if: steps.failover.outputs.dgx_alive != 'true'
        id: need
        run: |
          CURRENT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dws10.com/config/products.json','utf8')).priceList.version||'')")
          if [ "$CURRENT" = "${{ steps.q.outputs.version }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already at ${CURRENT}, skipping."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll products.json to new stamp
        if: steps.need.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.q.outputs.version }}
          STAMP_QUARTER: ${{ steps.q.outputs.stamp_quarter }}
          STAMP_DATE: ${{ steps.q.outputs.stamp_date }}
          VALID_UNTIL: ${{ steps.q.outputs.valid_until }}
          NEXT_REVIEW: ${{ steps.q.outputs.next_review }}
          TODAY: ${{ steps.q.outputs.today }}
        run: |
          node -e "
          const fs = require('fs');
          ['dws10.com/config/products.json','landing-pages/dws10-com/config/products.json'].forEach((f)=>{
            const d = JSON.parse(fs.readFileSync(f,'utf8'));
            d.priceList.version        = process.env.VERSION;
            d.priceList.stampQuarter   = process.env.STAMP_QUARTER;
            d.priceList.stampDate      = process.env.STAMP_DATE;
            d.priceList.effectiveDate  = process.env.STAMP_DATE;
            d.priceList.validUntil     = process.env.VALID_UNTIL;
            d.priceList.nextReviewDate = process.env.NEXT_REVIEW;
            d.priceList.changeLog      = d.priceList.changeLog || [];
            d.priceList.changeLog.push({
              version: process.env.VERSION,
              date: process.env.TODAY,
              change: 'Quarterly stamp roll (auto, GitHub Actions failover): prices valid '+process.env.STAMP_DATE+' to '+process.env.VALID_UNTIL+'.'
            });
            d.lastUpdated = new Date().toISOString();
            fs.writeFileSync(f, JSON.stringify(d, null, 2) + '\n', 'utf8');
          });
          "

      - name: Generate versioned HTML snapshot
        if: steps.need.outputs.needed == 'true'
        run: node scripts/gen-price-list-html.cjs

      - name: Open PR with stamped price list
        if: steps.need.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/price-list-stamp-${{ steps.q.outputs.version }}
          commit-message: |
            Price list: quarterly stamp roll → ${{ steps.q.outputs.version }}

            Prices valid ${{ steps.q.outputs.stamp_date }} to ${{ steps.q.outputs.valid_until }}.
            Next review: ${{ steps.q.outputs.next_review }}.
          title: "Price list: quarterly stamp roll → ${{ steps.q.outputs.version }}"
          body: |
            Auto-opened by `.github/workflows/quarterly-price-list.yml` (failover for DGX Spark).

            - **Stamp:** ${{ steps.q.outputs.stamp_quarter }}
            - **Stamp date:** ${{ steps.q.outputs.stamp_date }}
            - **Valid until:** ${{ steps.q.outputs.valid_until }}
            - **Next review:** ${{ steps.q.outputs.next_review }}

            ### Before merging
            - [ ] Review any pending price edits made this quarter.
            - [ ] Confirm the snapshot in `dws10.com/price-list/versions/price-list-v${{ steps.q.outputs.version }}.html`.

            ### After merging
            Email dispatch is **RED-zone** (human required). When ready to notify customers:
            ```
            node scripts/send-price-list-email.ts --version ${{ steps.q.outputs.version }} --recipients path/to/list.csv
            ```
          labels: price-list, quarterly
