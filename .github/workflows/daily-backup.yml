name: Daily Intellectual Assets Backup

on:
  # Schedule REMOVED 2026-04-08 — this workflow backs up git-tracked files INTO git (redundant).
  # All assets are already version-controlled. Consumed ~90 min/month for no incremental value.
  # Was: cron '55 23 * * *' (daily at 23:55 UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive backup

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Create backup timestamp
        id: timestamp
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Generate backup report
        run: |
          BACKUP_FILE="backups/DAILY_BACKUP_${{ steps.timestamp.outputs.date }}.md"
          BACKUP_TIME=$(date +'%H:%M:%S UTC')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          CURRENT_BRANCH=$(git branch --show-current)
          LAST_COMMIT=$(git log -1 --pretty=format:'%h - %s (%cr)')
          CONTRIBUTORS=$(git log --format='%aN' | sort -u | wc -l)
          REPO_STATUS_COUNT=$(git status --porcelain | wc -l)
          BRANCH_STATUS=$(git status -sb)
          REMOTE_COUNT=$(git remote -v | wc -l)
          REPO_SIZE=$(du -sh .git 2>/dev/null | cut -f1 || echo "N/A")
          BACKUP_FILE_COUNT=$(find backups -type f | wc -l)
          TOTAL_BACKUPS=$(ls -1 backups/DAILY_BACKUP_*.md 2>/dev/null | wc -l)
          NEXT_BACKUP_DATE=$(date -d tomorrow +'%Y-%m-%d')

          cat > "$BACKUP_FILE" << 'EOF'
          # Daily Intellectual Assets Backup
          **Date:** ${{ steps.timestamp.outputs.date }}
          EOF
          echo "**Time:** ${BACKUP_TIME}  " >> "$BACKUP_FILE"

          cat >> "$BACKUP_FILE" << 'EOF'
          **Automated:** Yes (GitHub Actions)
          **Status:** ✅ COMPLETE

          ---

          ## 🎯 Backup Scope

          This automated backup preserves all critical intellectual assets:

          ### 1. Marketing Assets
          - €500K Hero Campaign (dws10.com/index.html)
          - Lifetime Fleet Carousel (dws10.com/lifetime-fleet/)
          - CSRD Page (dws10.com/csrd/)
          - Progress Report (dws10.com/progress-report/)
          - Ultra Premium Template (dws10.com/ultra/)

          ### 2. Dashboard Assets
          - V7 OK Computer Dashboard (Firehorse/OK_Firehorse/v7/)
          - V8 Enhanced View (dws6.com/dashboard/firehorse/v8/)
          - V9 Supabase Dashboard (dws6.com/dashboard/v9/)

          ### 3. Authentication
          - Login Hub (dws6.com/login/)
          - Supabase Configuration

          ### 4. Documentation
          - Quality Audit Reports
          - Migration Strategies
          - Deployment Guides
          - File Path References

          ---

          ## 📊 Repository Statistics
          EOF
          {
            echo "**Commit Count:** ${COMMIT_COUNT}  "
            echo "**Branch:** ${CURRENT_BRANCH}  "
            echo "**Last Commit:** ${LAST_COMMIT}  "
            echo "**Contributors:** ${CONTRIBUTORS}"
          } >> "$BACKUP_FILE"

          cat >> "$BACKUP_FILE" << 'EOF'

          ---

          ## 📁 Key Files Backed Up

          ### Marketing Pages
          EOF

          # List key marketing files
          find dws10.com -name "index.html" -type f | while read file; do
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
            echo "- \`$file\` (${size} bytes)" >> "$BACKUP_FILE"
          done

          cat >> "$BACKUP_FILE" << 'EOF'

          ### CSS Assets
          EOF

          # List CSS files
          find dws10.com -name "*.css" -type f | head -10 | while read file; do
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
            echo "- \`$file\` (${size} bytes)" >> "$BACKUP_FILE"
          done

          cat >> "$BACKUP_FILE" << 'EOF'

          ### JavaScript Assets
          EOF

          # List JS files
          find dws10.com -name "*.js" -type f | head -10 | while read file; do
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
            echo "- \`$file\` (${size} bytes)" >> "$BACKUP_FILE"
          done

          cat >> "$BACKUP_FILE" << 'EOF'

          ---

          ## 🔍 Content Verification

          ### Lifetime Fleet Check
          EOF

          # Verify Lifetime Fleet
          if [ -f "dws10.com/lifetime-fleet/index.html" ]; then
            echo "✅ Lifetime Fleet Page: EXISTS" >> "$BACKUP_FILE"
            carousel_count=$(grep -c "carousel-slide" dws10.com/lifetime-fleet/index.html || echo "0")
            echo "✅ Carousel Slides: $carousel_count" >> "$BACKUP_FILE"
          else
            echo "⚠️ Lifetime Fleet Page: MISSING" >> "$BACKUP_FILE"
          fi

          cat >> "$BACKUP_FILE" << 'EOF'

          ### Ultra Template Check
          EOF

          # Verify Ultra Template
          if [ -f "dws10.com/ultra/index.html" ]; then
            echo "✅ Ultra Template: EXISTS" >> "$BACKUP_FILE"
          else
            echo "⚠️ Ultra Template: MISSING" >> "$BACKUP_FILE"
          fi

          cat >> "$BACKUP_FILE" << 'EOF'

          ---

          ## 📦 Backup Archive

          This backup is stored in the Git repository history and can be restored at any time using:

          ```bash
          git checkout <commit-hash> -- <file-path>
          ```

          Or restore entire backup:

          ```bash
          git checkout <commit-hash>
          ```

          ---

          ## 🔄 Restoration Instructions

          ### To Restore a Single File:
          1. Find the backup commit: `git log --all -- <file-path>`
          2. Restore the file: `git checkout <commit-hash> -- <file-path>`
          3. Verify restoration: Compare with current version
          4. Commit if satisfied: `git commit -m "Restore <file> from backup"`

          ### To Restore Multiple Files:
          1. Create restoration branch: `git checkout -b restore-from-backup`
          2. Checkout files from backup: `git checkout <commit-hash> -- <directory>`
          3. Review changes: `git diff main`
          4. Merge if satisfied: `git checkout main && git merge restore-from-backup`

          ### To View Backup History:
          ```bash
          git log --all --grep="Daily Backup" --oneline
          ```

          ---

          ## 🚨 Integrity Check
          EOF
          {
            echo "**Repository Status:** ${REPO_STATUS_COUNT} uncommitted changes  "
            echo "**Branch Status:** ${BRANCH_STATUS}  "
            echo "**Remote Status:** ${REMOTE_COUNT} remotes configured"
          } >> "$BACKUP_FILE"

          cat >> "$BACKUP_FILE" << 'EOF'

          ---

          ## 📊 Storage Information
          EOF
          {
            echo "**Repository Size:** ${REPO_SIZE}  "
            echo "**Backup File Count:** ${BACKUP_FILE_COUNT}  "
            echo "**Total Backups:** ${TOTAL_BACKUPS}"
          } >> "$BACKUP_FILE"

          cat >> "$BACKUP_FILE" << 'EOF'

          ---

          ## ⏰ Next Backup

          **Scheduled:** Tomorrow at 23:55 UTC
          **Frequency:** Daily (automated)
          **Retention:** Indefinite (stored in Git history)

          ---

          ## 📝 Notes

          - This backup is automated via GitHub Actions
          - All files are committed to the repository
          - Backup history is preserved in Git
          - Manual backups can be triggered via GitHub Actions UI
          - For emergency restoration, contact repository maintainer

          ---

          **Backup Status:** ✅ COMPLETE
          **Verification:** ✅ PASSED
          EOF
          echo "**Next Backup:** ${NEXT_BACKUP_DATE} 23:55 UTC" >> "$BACKUP_FILE"

      - name: Create compressed archive
        run: |
          # Create tar.gz archive of critical assets
          tar -czf "backups/assets-backup-${{ steps.timestamp.outputs.date }}.tar.gz" \
            dws10.com/index.html \
            dws10.com/ultra/ \
            dws10.com/lifetime-fleet/ \
            dws10.com/progress-report/ \
            dws10.com/csrd/ \
            dws6.com/login/ \
            dws6.com/dashboard/v9/ \
            --exclude='*.zip' \
            --exclude='node_modules' \
            --exclude='.git' \
            2>/dev/null || echo "Some files may not exist, continuing..."

          # Calculate archive size
          if [ -f "backups/assets-backup-${{ steps.timestamp.outputs.date }}.tar.gz" ]; then
            size=$(stat -f%z "backups/assets-backup-${{ steps.timestamp.outputs.date }}.tar.gz" 2>/dev/null || stat -c%s "backups/assets-backup-${{ steps.timestamp.outputs.date }}.tar.gz" 2>/dev/null)
            echo "Archive created: ${size} bytes"
          fi

      - name: Commit backup
        run: |
          git config user.name "DWS6 Backup Bot"
          git config user.email "backup@dws6.com"
          git add backups/
          git commit -m "🔄 Daily Backup: ${{ steps.timestamp.outputs.date }} - Automated intellectual assets backup" || echo "No changes to commit"

      - name: Push backup
        run: |
          git push origin HEAD:main || echo "Push failed, will retry on next run"

      - name: Clean old backups (keep last 30 days)
        run: |
          # Keep only last 30 daily backups
          cd backups
          ls -t DAILY_BACKUP_*.md | tail -n +31 | xargs -r rm --
          ls -t assets-backup-*.tar.gz | tail -n +31 | xargs -r rm --
          cd ..

          if [ -n "$(git status --porcelain backups/)" ]; then
            git add backups/
            git commit -m "🧹 Cleanup: Removed backups older than 30 days"
            git push origin HEAD:main || echo "Cleanup push failed"
          fi

      - name: Create backup summary
        run: |
          echo "## 📊 Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${{ steps.timestamp.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Backed Up:" >> $GITHUB_STEP_SUMMARY
          echo "- Marketing pages (dws10.com)" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard assets (dws6.com)" >> $GITHUB_STEP_SUMMARY
          echo "- Ultra template" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Backup:" >> $GITHUB_STEP_SUMMARY
          echo "Tomorrow at 23:55 UTC" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Backup failed on ${{ steps.timestamp.outputs.date }}" >> backups/BACKUP_FAILURES.log
          git add backups/BACKUP_FAILURES.log
          git commit -m "⚠️ Backup failure logged: ${{ steps.timestamp.outputs.date }}"
          git push origin HEAD:main || echo "Failed to push failure log"
