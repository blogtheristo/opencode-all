name: Argus Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  argus-review:
    name: Argus Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Argus Code Review
        uses: sasa-tomic/argus-code-review-action@v1.0.5
        with:
          # GitHub token for API access
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # OpenAI API key (required for AI review)
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          
          # Review options
          review_type: "comprehensive"  # Options: comprehensive, security, performance
          language: "english"
          
          # Ignore patterns
          ignore_patterns: |
            **/*.min.js
            **/*.min.css
            node_modules/
            venv/
            dist/
            build/
          
          # Maximum files to review (API rate limiting)
          max_files: 20
          
          # Comment format
          comment_pr: true
          create_summary: true

      - name: Comment PR with Review Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewFile = './argus-review-summary.json';
            
            if (fs.existsSync(reviewFile)) {
              const summary = JSON.parse(fs.readFileSync(reviewFile, 'utf8'));
              
              const comment = `## 🤖 Argus Code Review Complete
              
### Summary
- **Files Reviewed:** ${summary.filesReviewed || 0}
- **Issues Found:** ${summary.issuesFound || 0}
- **Security Issues:** ${summary.securityIssues || 0}
- **Performance Issues:** ${summary.performanceIssues || 0}

### Review Status
${summary.status === 'approved' ? '✅ Approved' : '⚠️ Changes Requested'}

[View Full Review](${summary.reviewUrl || ''})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
