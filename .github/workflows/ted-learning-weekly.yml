# Weekly TED outreach learning aggregates → ted_outreach_learning_log

name: TED Learning Weekly

on:
  # Schedule REMOVED 2026-05-25 (#1384) — DGX Spark is primary (scripts/weekly/ted-learning.sh)
  # Was: cron '15 8 * * 1' (Monday 08:15 UTC)
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # DGX Spark runs scripts/weekly/ted-learning.sh as primary.
      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ vars.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX is primary
        if: steps.failover.outputs.dgx_alive == 'true'
        run: |
          echo "DGX Spark is healthy — TED learning runs there. Exiting."
          exit 0

      - uses: actions/setup-node@v4
        if: steps.failover.outputs.dgx_alive != 'true'
        with:
          node-version: '24'
          cache: npm

      - if: steps.failover.outputs.dgx_alive != 'true'
        run: npm ci --ignore-scripts

      - name: Aggregate
        if: steps.failover.outputs.dgx_alive != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node --import tsx scripts/ted-learning-weekly.ts
