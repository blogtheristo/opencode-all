# Test Automation Workflow
# Runs tests on every pull request and push to main
# Part of the self-improving agent loop: ensures agents and services don't regress

name: Test on PR

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "dws10.com/shared-assets/footer/**"
      - "dws10.com/free-audit/**"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "dws10.com/shared-assets/footer/**"
      - "dws10.com/free-audit/**"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit --pretty

      - name: Run tests
        run: npm test -- --run --reporter=verbose
        env:
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  lint-check:
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for security patterns
        run: |
          echo "Checking for hardcoded secrets..."
          ! grep -rn "sk-ant-api\|gsk_\|AIza\|AKIA[0-9A-Z]\{16\}" src/ \
            --exclude-dir="__tests__" \
            --include="*.ts" --include="*.js" || {
            echo "WARNING: Potential secrets found in source code"
            exit 1
          }
          echo "No hardcoded secrets detected"
