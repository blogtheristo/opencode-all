# EU Regulation Monitor — CBAM/CSRD/Fit for 55 News Digest
#
# Fetches regulatory news from EU RSS feeds, classifies by regulation,
# and sends a digest at 05:30 Helsinki Mon-Fri (before morning briefing).
#
# Items flagged as "urgent" or "customer impact" flow into:
#   1. CEO inbox (this email)
#   2. Morning briefing (via data-collectors integration)
#   3. Social scheduler (LinkedIn content ideas)

name: EU Regulation Monitor

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 05:30 Helsinki in summer (EEST, UTC+3)
    - cron: '30 3 * * 1-5'   # 05:30 Helsinki in winter (EET, UTC+2)

  workflow_dispatch: {}

jobs:
  fetch-and-send:
    name: Fetch Regulation News & Send Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and send regulation digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'risto@onelifetime.world' }}
          REGULATION_DIGEST_EMAIL: ${{ secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx tsx scripts/send-regulation-digest.ts
