# EU Regulation Monitor — CBAM/CSRD/Fit for 55 News Digest
#
# PRIMARY DELIVERY: Local script (scripts/run-morning-emails.ps1 / .sh)
# This workflow is kept as a MANUAL FALLBACK only.
# Scheduled crons disabled 2026-03-27 to save Actions minutes.

name: EU Regulation Monitor

on:
  # DISABLED — delivery moved to local machine (2026-03-27).
  # schedule:
  #   - cron: '30 2 * * 1-5'
  #   - cron: '30 3 * * 1-5'

  workflow_dispatch: {}

jobs:
  fetch-and-send:
    name: Fetch Regulation News & Send Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and send regulation digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: risto@onelifetime.world
          REGULATION_DIGEST_EMAIL: ${{ secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx tsx scripts/send-regulation-digest.ts
