# Construction Lead Scraper — Daily TED Tender Fetch + Email Digest
#
# PRIMARY: DGX Spark (24/7, cron-runner.ts)
# FAILOVER: This GitHub Actions workflow (checks DGX heartbeat first)

name: Construction Lead Scraper

on:
  # Schedule REMOVED 2026-04-08 — DGX Spark is primary (scripts/daily/construction-leads.sh)
  # GitHub Actions was failover only, consuming ~241 min/month even on skip checks.
  # Was: cron '0 3 * * 1-6' + '0 4 * * 1-6' (2x daily Mon-Sat for DST coverage)
  workflow_dispatch:
    inputs:
      country:
        description: "Country filter (comma-separated 2-letter codes, e.g., FI,SE,NO)"
        required: false
        type: string
      days:
        description: "Lookback period in days (default: 1)"
        required: false
        type: string
        default: "1"
      skip_email:
        description: "Skip sending email digest"
        required: false
        type: boolean
        default: false

jobs:
  scrape-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true

      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ secrets.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX Spark is handling this
        if: steps.failover.outputs.dgx_alive == 'true' && github.event_name == 'schedule'
        run: |
          echo "DGX Spark is alive — skipping (failover mode)"
          exit 0

      - name: Helsinki time guard
        id: timecheck
        run: |
          HELSINKI_HOUR=$(TZ="Europe/Helsinki" date +"%H")
          echo "Helsinki hour: $HELSINKI_HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — skipping time check"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HELSINKI_HOUR" = "06" ]; then
            echo "Correct hour — proceeding"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Wrong hour ($HELSINKI_HOUR) — exiting"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.timecheck.outputs.should_run == 'true'
        run: pip install -r scripts/requirements-tenders.txt

      - name: Run Construction Lead Scraper
        if: steps.timecheck.outputs.should_run == 'true'
        env:
          TED_API_KEY: ${{ secrets.TED_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: risto@onelifetime.world
          EMAIL_TO: ${{ secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          COUNTRY: ${{ inputs.country }}
          DAYS: ${{ inputs.days }}
          SKIP_EMAIL: ${{ inputs.skip_email }}
        run: |
          args=()

          # Country filter (from workflow_dispatch or default)
          if [ -n "$COUNTRY" ]; then
            args+=(--country "$COUNTRY")
          fi

          # Lookback days
          if [ -n "$DAYS" ]; then
            args+=(--days "$DAYS")
          fi

          # Skip email flag
          if [ "$SKIP_EMAIL" = "true" ]; then
            args+=(--no-email)
          fi

          python scripts/fetch_tenders.py "${args[@]}"

      - name: Commit and push leads snapshot
        if: steps.timecheck.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Create a Git-tracked snapshot without .csv extension (ignored by .gitignore)
          cp data/leads.csv data/leads.txt
          git add data/leads.txt
          git diff --quiet --cached && echo "No changes to commit" && exit 0
          git commit -m "Update construction leads $(TZ='Europe/Helsinki' date +'%Y-%m-%d %H:%M Helsinki')"
          git push
