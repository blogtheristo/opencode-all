# TED day-3 follow-up emails (counts toward daily SES cap).

name: TED Follow-up

on:
  # Schedule REMOVED 2026-05-25 (#1384) — DGX Spark is primary (scripts/daily/ted-followup.sh)
  # Was: cron '30 7 * * *' (daily at 07:30 UTC)
  workflow_dispatch:

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # DGX Spark runs scripts/daily/ted-followup.sh as primary.
      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ vars.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX is primary
        if: steps.failover.outputs.dgx_alive == 'true'
        run: |
          echo "DGX Spark is healthy — TED follow-up runs there. Exiting."
          exit 0

      - uses: actions/setup-node@v4
        if: steps.failover.outputs.dgx_alive != 'true'
        with:
          node-version: '24'
          cache: npm

      - if: steps.failover.outputs.dgx_alive != 'true'
        run: npm ci --ignore-scripts

      - name: Send follow-ups
        if: steps.failover.outputs.dgx_alive != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'risto@onelifetime.world' }}
          TED_OUTREACH_TO: ${{ secrets.TED_OUTREACH_TO || secrets.OUTREACH_DIGEST_EMAIL }}
          OUTREACH_DIGEST_EMAIL: ${{ secrets.OUTREACH_DIGEST_EMAIL }}
        run: node --import tsx scripts/ted-followup.ts
