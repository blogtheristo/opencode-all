name: Dependency Submission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/poetry.lock"
      - "**/Pipfile"
      - "**/Pipfile.lock"
      - ".github/workflows/dependency-submission.yml"
      - "!artifacts/**"
      - "!**/*_OLD/**"

permissions:
  contents: write
  id-token: write

jobs:
  dependency-submission:
    name: Submit Dependency Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: First Attempt
        id: submit_dependencies
        continue-on-error: true
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.1
        with:
          filePath: "."
          directoryExclusionList: "{artifacts/**,**/*_OLD/**}"
          detectorArgs: "Pip=EnableIfDefaultOff,SimplePip=EnableIfDefaultOff,Poetry=EnableIfDefaultOff"

      - name: Retry After Transient Failure
        if: steps.submit_dependencies.outcome == 'failure'
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.1
        with:
          filePath: "."
          directoryExclusionList: "{artifacts/**,**/*_OLD/**}"
          detectorArgs: "Pip=EnableIfDefaultOff,SimplePip=EnableIfDefaultOff,Poetry=EnableIfDefaultOff"
