name: Ruff Auto-Fix & Format

on:
  workflow_dispatch:
    inputs:
      fix_mode:
        description: 'Fix mode'
        required: true
        default: 'safe'
        type: choice
        options:
          - safe
          - all
          - security-only
      create_pr:
        description: 'Create PR with fixes'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  ruff-auto-fix:
    name: Ruff Auto-Fix
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Ruff
        run: |
          pip install ruff
          ruff --version
      
      - name: Run Pre-Fix Scan
        run: |
          echo "📊 Running pre-fix scan..."
          ruff check . --statistics > pre-fix-stats.txt || true
          cat pre-fix-stats.txt
      
      - name: Apply Ruff Fixes (Safe Mode)
        if: inputs.fix_mode == 'safe'
        run: |
          echo "🔧 Applying safe fixes..."
          ruff check --fix . || true
          echo "✅ Safe fixes applied"
      
      - name: Apply Ruff Fixes (All)
        if: inputs.fix_mode == 'all'
        run: |
          echo "🔧 Applying all fixes (including unsafe)..."
          ruff check --fix --unsafe-fixes . || true
          echo "✅ All fixes applied"
      
      - name: Apply Security Fixes Only
        if: inputs.fix_mode == 'security-only'
        run: |
          echo "🔒 Applying security fixes only..."
          ruff check --fix --select S . || true
          echo "✅ Security fixes applied"
      
      - name: Format Code
        run: |
          echo "🎨 Formatting code..."
          ruff format .
          echo "✅ Code formatted"
      
      - name: Run Post-Fix Scan
        run: |
          echo "📊 Running post-fix scan..."
          ruff check . --statistics > post-fix-stats.txt || true
          cat post-fix-stats.txt
      
      - name: Generate Fix Report
        env:
          FIX_MODE: ${{ inputs.fix_mode }}
        run: |
          echo "# 🐶 Ruff Auto-Fix Report" > fix-report.md
          echo "" >> fix-report.md
          echo "**Date:** $(date)" >> fix-report.md
          echo "**Mode:** $FIX_MODE" >> fix-report.md
          echo "" >> fix-report.md
          echo "## Before" >> fix-report.md
          echo "\`\`\`" >> fix-report.md
          cat pre-fix-stats.txt >> fix-report.md
          echo "\`\`\`" >> fix-report.md
          echo "" >> fix-report.md
          echo "## After" >> fix-report.md
          echo "\`\`\`" >> fix-report.md
          cat post-fix-stats.txt >> fix-report.md
          echo "\`\`\`" >> fix-report.md
          echo "" >> fix-report.md
          echo "## Changes Made" >> fix-report.md
          git diff --stat >> fix-report.md || echo "No changes" >> fix-report.md
          cat fix-report.md
      
      - name: Upload Fix Report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-fix-report
          path: |
            fix-report.md
            pre-fix-stats.txt
            post-fix-stats.txt
          retention-days: 30
      
      - name: Create Pull Request
        if: inputs.create_pr == true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "refactor(ruff): Auto-fix code quality issues"
          branch: ruff-auto-fix-${{ github.run_number }}
          delete-branch: true
          title: '🐶 Ruff Auto-Fix'
          body-path: fix-report.md
          labels: |
            ruff
            automated
            code-quality
