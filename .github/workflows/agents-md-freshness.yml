name: AGENTS.md Freshness Check

on:
  # Schedule REMOVED 2026-05-25 (#1384) — moved to DGX Spark cron
  # Was: cron '0 6 * * 1' (Monday 06:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DGX Spark cron-runner mirrors this job (cron-runner.ts: agents-md-freshness).
      # If DGX heartbeat is healthy, skip — this workflow is GHA-failover only.
      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ vars.DGX_SPARK_HEARTBEAT_URL }}

      - name: Setup Node.js
        if: steps.failover.outputs.dgx_alive != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run AGENTS.md freshness verification
        if: steps.failover.outputs.dgx_alive != 'true'
        id: verify
        run: |
          set +e
          node scripts/verify-agents-md.mjs --json > freshness-report.json 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Also generate human-readable report
          node scripts/verify-agents-md.mjs > freshness-report.txt 2>&1 || true
          echo "--- Report ---"
          cat freshness-report.txt

      - name: Create issue if failures found
        if: steps.failover.outputs.dgx_alive != 'true' && steps.verify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('freshness-report.txt', 'utf-8');

            // Check if an open issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'agents-md-stale',
              state: 'open',
            });

            const title = '⚠️ AGENTS.md is stale — freshness check failed';
            const body = [
              '## AGENTS.md Freshness Report',
              '',
              '```',
              report,
              '```',
              '',
              '**Action required:** Update AGENTS.md to match the current codebase.',
              '',
              'Run `node scripts/verify-agents-md.mjs` locally to see details.',
              'Run `node scripts/sync-agents-md.mjs` to auto-fix synced sections.',
              '',
              `Generated: ${new Date().toISOString()}`,
            ].join('\n');

            if (issues.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body,
              });
              console.log(`Updated existing issue #${issues[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['agents-md-stale', 'documentation'],
              });
              console.log('Created new freshness issue');
            }

      - name: Upload report artifact
        if: always() && steps.failover.outputs.dgx_alive != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agents-md-freshness-report
          path: |
            freshness-report.json
            freshness-report.txt
