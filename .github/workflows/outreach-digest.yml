# Outreach Digest — Daily Pipeline Email
#
# PRIMARY DELIVERY: Local script (scripts/run-morning-emails.ps1 / .sh)
# This workflow is kept as a MANUAL FALLBACK only.
# Scheduled crons disabled 2026-03-27 to save Actions minutes.

name: Outreach Digest

on:
  # DISABLED — delivery moved to local machine (2026-03-27).
  # schedule:
  #   - cron: '5 3 * * 1-6'
  #   - cron: '5 4 * * 1-6'

  workflow_dispatch:
    inputs:
      recipient:
        description: 'Override recipient email (optional)'
        required: false
        type: string

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send outreach digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM: risto@onelifetime.world
          OUTREACH_DIGEST_EMAIL: ${{ inputs.recipient || secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          OUTREACH_REPLY_TO_EMAIL: ${{ secrets.OUTREACH_REPLY_TO_EMAIL || 'risto@onelifetime.world' }}
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx tsx scripts/send-outreach-digest.ts
