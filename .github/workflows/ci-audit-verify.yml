name: CI Audit Gate

# Verify that the pushed HEAD has a corresponding local CI audit record
# (written by scripts/local-ci.sh) and that the hash chain is intact.
# During baseline rollout, this workflow is run with --allow-failure, which
# downgrades chain breaks, missing HEAD records, and overall_pass=false to
# warnings instead of failures. Once the baseline is green and the chain
# is intact on main, drop --allow-failure to restore strict gating.
#
# This is a GATE, not a runner. It does NOT re-run vitest/gitleaks/etc.
# Actual checks run locally (free, fast) via .githooks/pre-push.
# See docs/CI_AUDIT.md for the full model.
#
# Expected duration: ~3 seconds (checkout + verify).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify audit chain + HEAD coverage
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install jq (usually preinstalled)
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq

      - name: Verify audit chain + HEAD coverage
        env:
          # Let pull_request verify against the PR head SHA, not the merge commit.
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/ci-audit-verify.sh --commit "$TARGET_SHA" --allow-failure
