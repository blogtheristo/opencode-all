name: PR Security Check - Aikido

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.ts'
      - '**.js'
      - '**.tsx'
      - '**.jsx'
      - '**.yaml'
      - '**.yml'
      - 'requirements.txt'
      - 'package.json'
      - 'Dockerfile'
      - 'docker-compose.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  pr-security-check:
    runs-on: [self-hosted, dgx-spark]
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get Aikido PR Recommendations
        continue-on-error: true
        run: |
          echo "Fetching Aikido PR recommendations..."
          curl -s -X POST "https://api.aikido.dev/v1/pr-check" \
            -H "Authorization: Bearer ${{ secrets.AIKIDO_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "head_sha": "${{ github.event.pull_request.head.sha }}",
              "base_sha": "${{ github.event.pull_request.base.sha }}"
            }' > aikido-pr-check.json || echo "{\"status\":\"unavailable\"}" > aikido-pr-check.json

      - name: Comment PR with Security Review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let aikidoResults = {};
            
            try {
              aikidoResults = JSON.parse(fs.readFileSync('aikido-pr-check.json', 'utf8'));
            } catch (e) {
              aikidoResults = { status: 'error' };
            }
            
            const aikidoVulns = aikidoResults.issues || [];
            
            let comment = '## 🔐 Security Review\n\n';
            
            if (aikidoVulns.length === 0) {
              comment += '✅ **No security issues detected**\n\n';
            } else {
              if (aikidoVulns.length > 0) {
                comment += `### ⚠️ Aikido Findings (${aikidoVulns.length})\n\n`;
                aikidoVulns.slice(0, 5).forEach(issue => {
                  comment += `- **${issue.severity}**: ${issue.title}\n`;
                  if (issue.description) {
                    comment += `  *${issue.description}*\n`;
                  }
                });
                if (aikidoVulns.length > 5) {
                  comment += `- ... and ${aikidoVulns.length - 5} more\n`;
                }
                comment += '\n';
              }
            }
            
            comment += '### 📚 Resources\n';
            comment += '- [Security Backlog](../../security-reports/SECURITY_BACKLOG_BUG_FIXES.md)\n';
            comment += '- [Aikido Security](https://aikido.dev)\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Set Status Check
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let aikidoResults = {};
            
            try {
              aikidoResults = JSON.parse(fs.readFileSync('aikido-pr-check.json', 'utf8'));
            } catch (e) {
              // File might not exist if Aikido check failed
            }
            
            const criticalVulns = (aikidoResults.issues || [])
              .filter(v => v.severity?.toLowerCase() === 'critical');
            
            const conclusion = criticalVulns.length > 0 ? 'failure' : 'success';
            const title = criticalVulns.length > 0 
              ? `Security Check Failed: ${criticalVulns.length} critical issues` 
              : 'Security Check Passed';
            
            github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Security Check (Aikido)',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: title,
                summary: `Found ${(aikidoResults.issues || []).length} vulnerabilities`,
              }
            });

      - name: Upload PR Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-security-scan-${{ github.event.pull_request.number }}
          path: |
            aikido-pr-check.json
          retention-days: 30

