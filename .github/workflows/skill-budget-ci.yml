name: Skill Manifest & Budget

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude/commands/**"
      - ".antigravity/agents/**"
      - "docs/DWS_SKILLS_GUIDE.md"
      - "scripts/skill-manifest-sync.mjs"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check manifest, guide sync, and Antigravity stubs
        run: |
          node scripts/skill-manifest-sync.mjs --check

      - name: Generate surface matrix summary
        run: |
          echo "## Skill surface matrix" >> "$GITHUB_STEP_SUMMARY"
          node scripts/skill-manifest-sync.mjs --matrix >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce skill prompt budget
        run: |
          node --experimental-strip-types skills/skill-cleaner/scripts/skill-cleaner.ts --root skills --root .claude/commands --exit-code | tee skill-budget.out
          echo "## Skill prompt budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat skill-budget.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
