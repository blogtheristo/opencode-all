name: Sync DWS6.com Landing Pages

on:
  push:
    branches:
      - main
    paths:
      - "dws6.com/**"
      - "dws10.com/**"
      - "onelifetime.world/**"
      - "lifetime.fi/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Create landing-pages directories
        run: |
          mkdir -p landing-pages/dws6-com
          mkdir -p landing-pages/dws10-com
          mkdir -p landing-pages/onelifetime-world
          mkdir -p landing-pages/lifetime-fi
          echo "✅ Directories created"

      - name: 🔄 Sync dws6.com to landing-pages/dws6-com
        run: |
          echo "📦 Starting sync for dws6.com..."
          echo "Source: dws6.com/"
          echo "Target: landing-pages/dws6-com/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' dws6.com/ landing-pages/dws6-com/

          echo "✅ dws6.com sync complete!"

      - name: 🔄 Sync dws10.com to landing-pages/dws10-com
        run: |
          echo "📦 Starting sync for dws10.com..."
          echo "Source: dws10.com/"
          echo "Target: landing-pages/dws10-com/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' dws10.com/ landing-pages/dws10-com/

          echo "✅ dws10.com sync complete!"

      - name: 🔄 Sync onelifetime.world to landing-pages/onelifetime-world
        run: |
          echo "📦 Starting sync for onelifetime.world..."
          echo "Source: onelifetime.world/"
          echo "Target: landing-pages/onelifetime-world/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' onelifetime.world/ landing-pages/onelifetime-world/

          echo "✅ onelifetime.world sync complete!"

      - name: 🔄 Sync lifetime.fi to landing-pages/lifetime-fi
        run: |
          echo "📦 Starting sync for lifetime.fi..."
          echo "Source: lifetime.fi/"
          echo "Target: landing-pages/lifetime-fi/"

          if [ -d "lifetime.fi" ]; then
            rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' lifetime.fi/ landing-pages/lifetime-fi/
            echo "✅ lifetime.fi sync complete!"
          else
            echo "⚠️ lifetime.fi/ source folder missing — skipping (not failing run)"
          fi

          echo ""
          echo "📊 All sites synced:"
          ls -lah landing-pages/ | grep -E '^d'

      - name: 🔍 Check for changes
        id: check_changes
        run: |
          if git diff --quiet landing-pages/ 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected - will commit"
            git diff --stat landing-pages/
          fi

      - name: 📝 Configure Git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Commit and push synced files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Stage all landing-pages changes
          git add landing-pages/

          # Create detailed commit message
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "chore: sync all landing-pages from source [skip ci]

          Updated: $TIMESTAMP
          Sources: dws6.com/ dws10.com/ onelifetime.world/ lifetime.fi/
          Targets: landing-pages/{dws6-com,dws10-com,onelifetime-world,lifetime-fi}/

          This commit was automatically generated by GitHub Actions.
          Workflow: sync-dws6-landing-pages.yml"

          # Push to main
          git push origin main

          echo "✅ Changes pushed to repository"
          echo "🔗 View: https://github.com/blogtheristo/dws6/actions"

      - name: ☁️ Purge Cloudflare Cache
        # Run on EVERY invocation (push or workflow_dispatch) — not gated on
        # has_changes, because dual-folder PRs that pre-mirror the landing-
        # pages produce no rsync diff but DO change source content that must
        # be re-cached. The has_changes gate caused stale CDN cache on the
        # 25-industries deploy (PR #1326). The `paths:` filter on `on.push`
        # already ensures this workflow only runs when one of the source
        # folders changed, so an unconditional purge is safe.
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -z "$CLOUDFLARE_ZONE_ID" ] && [ ! -z "$CLOUDFLARE_API_TOKEN" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
            echo "✅ Cloudflare cache purged"
          else
            echo "⚠️ Cloudflare secrets not configured (optional)"
          fi

      - name: ✨ Workflow complete
        if: always()
        run: |
          echo "✅ All Landing Pages Sync Complete"
          echo "Sites: dws6.com, dws10.com, onelifetime.world, lifetime.fi"
          echo "Deployment: Cloudflare Pages"
