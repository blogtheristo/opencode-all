name: Sync DWS6.com Landing Pages

on:
  push:
    branches:
      - main
    paths:
      - "dws6.com/**"
      - "dws10.com/**"
      - "onelifetime.world/**"
      - "lifetime.fi/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Create landing-pages directories
        run: |
          mkdir -p landing-pages/dws6-com
          mkdir -p landing-pages/dws10-com
          mkdir -p landing-pages/onelifetime-world
          mkdir -p landing-pages/lifetime-fi
          echo "✅ Directories created"

      - name: 🔄 Sync dws6.com to landing-pages/dws6-com
        run: |
          echo "📦 Starting sync for dws6.com..."
          echo "Source: dws6.com/"
          echo "Target: landing-pages/dws6-com/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' dws6.com/ landing-pages/dws6-com/

          echo "✅ dws6.com sync complete!"

      - name: 🔄 Sync dws10.com to landing-pages/dws10-com
        run: |
          echo "📦 Starting sync for dws10.com..."
          echo "Source: dws10.com/"
          echo "Target: landing-pages/dws10-com/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' dws10.com/ landing-pages/dws10-com/

          echo "✅ dws10.com sync complete!"

      - name: 🔄 Sync onelifetime.world to landing-pages/onelifetime-world
        run: |
          echo "📦 Starting sync for onelifetime.world..."
          echo "Source: onelifetime.world/"
          echo "Target: landing-pages/onelifetime-world/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' onelifetime.world/ landing-pages/onelifetime-world/

          echo "✅ onelifetime.world sync complete!"

      - name: 🔄 Sync lifetime.fi to landing-pages/lifetime-fi
        run: |
          echo "📦 Starting sync for lifetime.fi..."
          echo "Source: lifetime.fi/"
          echo "Target: landing-pages/lifetime-fi/"

          if [ -d "lifetime.fi" ]; then
            rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' lifetime.fi/ landing-pages/lifetime-fi/
            echo "✅ lifetime.fi sync complete!"
          else
            echo "⚠️ lifetime.fi/ source folder missing — skipping (not failing run)"
          fi

          echo ""
          echo "📊 All sites synced:"
          ls -lah landing-pages/ | grep -E '^d'

      - name: 🔍 Check for changes
        id: check_changes
        run: |
          if git diff --quiet landing-pages/ 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected - will commit"
            git diff --stat landing-pages/
          fi

      - name: 📝 Configure Git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Commit and push synced files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Stage all landing-pages changes
          git add landing-pages/

          # Create detailed commit message
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "chore: sync all landing-pages from source [skip ci]

          Updated: $TIMESTAMP
          Sources: dws6.com/ dws10.com/ onelifetime.world/ lifetime.fi/
          Targets: landing-pages/{dws6-com,dws10-com,onelifetime-world,lifetime-fi}/

          This commit was automatically generated by GitHub Actions.
          Workflow: sync-dws6-landing-pages.yml"

          # Push to main
          git push origin main

          echo "✅ Changes pushed to repository"
          echo "🔗 View: https://github.com/blogtheristo/dws6/actions"

      - name: ☁️ Purge Cloudflare Cache
        # Run on EVERY invocation (push or workflow_dispatch) — not gated on
        # has_changes, because dual-folder PRs that pre-mirror the landing-
        # pages produce no rsync diff but DO change source content that must
        # be re-cached. The has_changes gate caused stale CDN cache on the
        # 25-industries deploy (PR #1326). The `paths:` filter on `on.push`
        # already ensures this workflow only runs when one of the source
        # folders changed, so an unconditional purge is safe.
        env:
          # These are the secret names that ACTUALLY EXIST in this repo. The
          # step previously read `secrets.CLOUDFLARE_ZONE_ID`, which was never
          # created — so it resolved to empty, the guard fell through to
          # "not configured (optional)", and the purge never ran at all. Not
          # once. Any name added here must match the repo's secret list exactly;
          # a typo is indistinguishable from "unset" and fails silently, which
          # is exactly how this went unnoticed.
          CF_ZONE_DWS10: ${{ secrets.CLOUDFLARE_ZONE_ID_DWS10 }}
          CF_ZONE_ONELIFETIME: ${{ secrets.CLOUDFLARE_ZONE_ID_ONELIFETIME }}
          CF_ZONE_DWS6: ${{ secrets.CLOUDFLARE_ZONE_ID_DWS6 }}
          CF_ZONE_LIFETIMEFI: ${{ secrets.CLOUDFLARE_ZONE_ID_LIFETIMEFI }}
          # Optional bulk override, and the legacy singular for compatibility.
          CLOUDFLARE_ZONE_IDS: ${{ secrets.CLOUDFLARE_ZONE_IDS }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # The response MUST be checked. Before 2026-09-09 this step ran curl
          # without --fail and never read the body, then echoed "cache purged"
          # unconditionally — and curl exits 0 on HTTP 403. Combined with the
          # missing zone secret above, the step could report neither its own
          # no-op nor an auth failure.
          #
          # The token carries Cache Purge only (no Zone:Read), so zone IDs must
          # be supplied rather than discovered.
          ZONES=""
          MISSING=""
          for pair in "dws10.com:$CF_ZONE_DWS10" \
                      "onelifetime.world:$CF_ZONE_ONELIFETIME" \
                      "dws6.com:$CF_ZONE_DWS6" \
                      "lifetime.fi:$CF_ZONE_LIFETIMEFI"; do
            site="${pair%%:*}"; id="${pair#*:}"
            if [ -n "$id" ]; then ZONES="$ZONES $id"; else MISSING="$MISSING $site"; fi
          done
          # Bulk/legacy secrets are additive, not replacements.
          [ -n "$CLOUDFLARE_ZONE_IDS" ] && ZONES="$ZONES $(echo "$CLOUDFLARE_ZONE_IDS" | tr ',\n' '  ')"
          [ -n "$CLOUDFLARE_ZONE_ID" ] && ZONES="$ZONES $CLOUDFLARE_ZONE_ID"

          if [ -n "$MISSING" ]; then
            echo "::warning::No zone ID configured for:$MISSING — those sites are NOT cache-purged and may serve stale pages. Add CLOUDFLARE_ZONE_ID_<SITE> secrets to cover them."
          fi

          if [ -z "$ZONES" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No Cloudflare zone IDs or no API token configured — nothing was purged. This is the failure mode that went unnoticed for months; it is an error, not an optional skip."
            exit 1
          fi

          failed=0
          purged=0
          # Accept comma, space or newline separated IDs.
          for zone in $(echo "$ZONES" | tr ',\n' '  '); do
            [ -n "$zone" ] || continue
            http_code=$(curl -sS -o /tmp/cf_purge.json -w '%{http_code}' \
              -X POST "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')

            # Cloudflare can return 200 with success:false, so check both.
            if [ "$http_code" = "200" ] && grep -q '"success":[[:space:]]*true' /tmp/cf_purge.json; then
              echo "✅ purged zone ${zone:0:8}… (HTTP $http_code)"
              purged=$((purged + 1))
            else
              # Never abort the loop: one bad zone must not hide the others'
              # results, and knowing which zones failed is the whole point.
              echo "::error::Cache purge FAILED for zone ${zone:0:8}… (HTTP $http_code)"
              # Body carries Cloudflare error codes, never the token.
              sed -e 's/[[:space:]]\+/ /g' /tmp/cf_purge.json | head -c 600
              echo ""
              failed=$((failed + 1))
            fi
          done

          echo "Cache purge: $purged succeeded, $failed failed."
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed zone(s) still serving stale content. A 401/403 usually means the token is expired, revoked, or that zone is outside its Zone Resources — check the token's expiry and scope before assuming the secret is missing."
            exit 1
          fi

      - name: ✨ Workflow complete
        if: always()
        run: |
          echo "✅ All Landing Pages Sync Complete"
          echo "Sites: dws6.com, dws10.com, onelifetime.world, lifetime.fi"
          echo "Deployment: Cloudflare Pages"
