name: Sync DWS6.com Landing Pages

on:
  push:
    branches:
      - main
    paths:
      - 'dws6.com/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Create landing-pages directory
        run: |
          mkdir -p landing-pages/dws6-com
          echo "✅ Directory created"

      - name: 🔄 Sync dws6.com to landing-pages/dws6-com
        run: |
          echo "📦 Starting sync..."
          echo "Source: dws6.com/"
          echo "Target: landing-pages/dws6-com/"
          
          # Sync all files with delete option (removes deleted files)
          rsync -av --delete --exclude='.git' --exclude='.DS_Store' dws6.com/ landing-pages/dws6-com/
          
          echo "✅ Sync complete!"
          echo ""
          echo "📊 Files synced:"
          ls -lah landing-pages/dws6-com/ | head -20
          
          echo ""
          echo "📁 Directory structure:"
          find landing-pages/dws6-com -type f | head -20

      - name: 🔍 Check for changes
        id: check_changes
        run: |
          if git diff --quiet landing-pages/dws6-com/ 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected - will commit"
            git diff --stat landing-pages/dws6-com/
          fi

      - name: 📝 Configure Git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Commit and push synced files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Stage changes
          git add landing-pages/dws6-com/
          
          # Create detailed commit message
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "chore(dws6): sync landing-pages from source [skip ci]

Updated: $TIMESTAMP
Source: dws6.com/
Target: landing-pages/dws6-com/

This commit was automatically generated by GitHub Actions.
Workflow: sync-dws6-landing-pages.yml"
          
          # Push to main
          git push origin main
          
          echo "✅ Changes pushed to repository"
          echo "🔗 View: https://github.com/blogtheristo/dws6/actions"

      - name: ✨ Workflow complete
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "✅ DWS6.com Landing Pages Sync Complete"
          echo "========================================="
          echo ""
          echo "📊 Summary:"
          echo "  Repository: blogtheristo/dws6"
          echo "  Source: dws6.com/"
          echo "  Target: landing-pages/dws6-com/"
          echo "  Deployment: Cloudflare Pages"
          echo ""
          echo "🔗 Links:"
          echo "  Repository: https://github.com/blogtheristo/dws6"
          echo "  Actions: https://github.com/blogtheristo/dws6/actions"
          echo "  Cloudflare: https://dash.cloudflare.com/pages"
          echo ""
          echo "⏱️ Expected deployment time: 30 seconds"
          echo ""

