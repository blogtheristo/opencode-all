name: Sync DWS6.com Landing Pages

on:
  push:
    branches:
      - main
    paths:
      - 'dws6.com/**'
      - 'dws10.com/**'
      - 'onelifetime.world/**'
    paths-ignore:
      - '.workflows/**'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Create landing-pages directories
        run: |
          mkdir -p landing-pages/dws6-com
          mkdir -p landing-pages/dws10-com
          mkdir -p landing-pages/onelifetime-world
          echo "✅ Directories created"

      - name: 🔄 Sync dws6.com to landing-pages/dws6-com
        run: |
          echo "📦 Starting sync for dws6.com..."
          echo "Source: dws6.com/"
          echo "Target: landing-pages/dws6-com/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' dws6.com/ landing-pages/dws6-com/

          echo "✅ dws6.com sync complete!"

      - name: 🔄 Sync dws10.com to landing-pages/dws10-com
        run: |
          echo "📦 Starting sync for dws10.com..."
          echo "Source: dws10.com/"
          echo "Target: landing-pages/dws10-com/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' dws10.com/ landing-pages/dws10-com/

          echo "✅ dws10.com sync complete!"

      - name: 🔄 Sync onelifetime.world to landing-pages/onelifetime-world
        run: |
          echo "📦 Starting sync for onelifetime.world..."
          echo "Source: onelifetime.world/"
          echo "Target: landing-pages/onelifetime-world/"

          rsync -av --delete --exclude='.git' --exclude='.DS_Store' --exclude='.workflows' onelifetime.world/ landing-pages/onelifetime-world/

          echo "✅ onelifetime.world sync complete!"
          echo ""
          echo "📊 All sites synced:"
          ls -lah landing-pages/ | grep -E '^d'

      - name: 🔍 Check for changes
        id: check_changes
        run: |
          if git diff --quiet landing-pages/ 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected - will commit"
            git diff --stat landing-pages/
          fi

      - name: 📝 Configure Git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Commit and push synced files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # Stage all landing-pages changes
          git add landing-pages/

          # Create detailed commit message
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "chore: sync all landing-pages from source [skip ci]

Updated: $TIMESTAMP
Sources: dws6.com/ dws10.com/ onelifetime.world/
Targets: landing-pages/{dws6-com,dws10-com,onelifetime-world}/

This commit was automatically generated by GitHub Actions.
Workflow: sync-dws6-landing-pages.yml"

          # Push to main
          git push origin main

          echo "✅ Changes pushed to repository"
          echo "🔗 View: https://github.com/blogtheristo/dws6/actions"

      - name: ✨ Workflow complete
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "✅ All Landing Pages Sync Complete"
          echo "========================================="
          echo ""
          echo "📊 Summary:"
          echo "  Repository: blogtheristo/dws6"
          echo "  Sites synced:"
          echo "    • dws6.com → landing-pages/dws6-com/"
          echo "    • dws10.com → landing-pages/dws10-com/"
          echo "    • onelifetime.world → landing-pages/onelifetime-world/"
          echo "  Deployment: Cloudflare Pages"
          echo ""
          echo "🔗 Links:"
          echo "  Repository: https://github.com/blogtheristo/dws6"
          echo "  Actions: https://github.com/blogtheristo/dws6/actions"
          echo "  Cloudflare: https://dash.cloudflare.com/pages"
          echo ""
          echo "⏱️ Expected deployment time: 30 seconds"
          echo ""

