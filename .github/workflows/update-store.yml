name: Update Store Feed

on:
  push:
    paths:
      - 'Store/**'
      - 'scripts/build_store.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyyaml markdown

      - name: Generate Store Feed and Pages
        run: |
          python scripts/build_store.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add landing-pages/dws10-com/products.xml landing-pages/dws10-com/products/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update Google Merchant Feed and Product Pages" && git push)

