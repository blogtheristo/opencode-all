name: Update Store Feed

on:
  push:
    branches: [main]
    paths:
      - "Store/**"
      - "dws10.com/config/products.json"
      - "scripts/build_store.py"
      - "scripts/generate-google-feed.cjs"
      - "dws10.com/feeds/generate-local-inventory.cjs"
      - "scripts/sync-nvidia-isv.cjs"
      - "dws10.com/config/nvidia-isv.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml markdown defusedxml

      - name: Generate Store Feed and Pages (Python)
        run: |
          python scripts/build_store.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate Google Merchant XML Feed
        run: |
          node scripts/generate-google-feed.cjs

      - name: Generate Google Merchant local inventory feed
        run: |
          node dws10.com/feeds/generate-local-inventory.cjs

      - name: Sync NVIDIA ISV page data
        run: |
          node scripts/sync-nvidia-isv.cjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Source folder only. build_store.py now writes into dws10.com/ and
          # sync-dws6-landing-pages.yml mirrors it to landing-pages/. Staging the
          # mirror here is what let generated pages exist ONLY under
          # landing-pages/, where the mirror sync's rsync --delete would remove
          # them: 94 product pages were one push away from deletion on
          # 2026-07-31. Do not re-add landing-pages paths to this list.
          git add dws10.com/products.xml dws10.com/products.csv dws10.com/products/ dws10.com/feeds/google-products.xml dws10.com/feeds/local-inventory.tsv dws10.com/config/nvidia-isv.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update Store Feed, Google Merchant, and NVIDIA ISV sync" && git push)
