name: Security Scan (Snyk)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create consolidated requirements.txt
        run: |
          echo "# Consolidated requirements for Snyk scan" > requirements.txt
          if [ -f requirements-security.txt ]; then cat requirements-security.txt >> requirements.txt; fi
          if [ -f dev-requirements.txt ]; then cat dev-requirements.txt >> requirements.txt; fi
          if [ -f mcp-hub/requirements.txt ]; then cat mcp-hub/requirements.txt >> requirements.txt; fi
          echo "Created requirements.txt for scanning"
          cat requirements.txt
      
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --file=requirements.txt
      
      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
