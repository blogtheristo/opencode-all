# Social Scheduler — LinkedIn Post Queue
#
# PRIMARY DELIVERY: Local script (scripts/run-morning-emails.ps1 / .sh)
# This workflow is kept as a MANUAL FALLBACK only.
# Scheduled crons disabled 2026-03-27 to save Actions minutes.

name: Social Scheduler

on:
  # DISABLED — delivery moved to local machine (2026-03-27).
  # schedule:
  #   - cron: '0 5 * * 1-5'
  #   - cron: '0 6 * * 1-5'

  workflow_dispatch:
    inputs:
      digest_only:
        description: 'Only send digest (skip draft generation)'
        required: false
        type: boolean
        default: false

jobs:
  generate-and-send:
    name: Generate Draft & Send Approval Digest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate draft and send digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM: risto@onelifetime.world
          SOCIAL_DIGEST_EMAIL: ${{ secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
        run: |
          if [ "${{ inputs.digest_only }}" = "true" ]; then
            npx tsx scripts/send-social-digest.ts --digest-only
          else
            npx tsx scripts/send-social-digest.ts
          fi
