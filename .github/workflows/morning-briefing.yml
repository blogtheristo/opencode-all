# Morning Briefing — CEO Cockpit
#
# Sends the daily CEO Cockpit email at 06:00 Helsinki time, Mon-Sat.
# Helsinki = UTC+2 (winter) / UTC+3 (summer).
# Cron uses UTC, so we schedule at 03:00 UTC to cover both offsets.
# (04:00 UTC in winter = 06:00 EET, 03:00 UTC in summer = 06:00 EEST)
#
# Also supports manual trigger via workflow_dispatch.

name: Morning Briefing

on:
  schedule:
    # 04:00 UTC = 06:00 Helsinki (EET, winter)
    # In summer (EEST), this fires at 07:00 Helsinki — acceptable ±1h drift.
    # For exact 06:00 year-round, use two cron entries:
    - cron: '0 4 * * 1-6'   # Mon-Sat at 04:00 UTC

  workflow_dispatch:
    inputs:
      recipient:
        description: 'Override recipient email (optional)'
        required: false
        type: string

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send morning briefing
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'noreply@dws6.com' }}
          OUTREACH_DIGEST_EMAIL: ${{ inputs.recipient || secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          MRR_EUR: ${{ secrets.MRR_EUR }}
          WEEKLY_COMMITS: ${{ secrets.WEEKLY_COMMITS }}
          MVP_ETA: ${{ secrets.MVP_ETA }}
        run: npx tsx scripts/send-morning-briefing.ts
