# Morning Briefing — CEO Cockpit
#
# Sends the daily CEO Cockpit email at 06:00 Helsinki time, Mon-Sat.
# Helsinki = UTC+2 (winter, EET) / UTC+3 (summer, EEST).
#
# Two cron entries cover both DST offsets:
#   03:00 UTC = 06:00 EEST (summer, late Mar – late Oct)
#   04:00 UTC = 06:00 EET  (winter, late Oct – late Mar)
#
# The send script has a Helsinki-time guard: it only sends when the
# Helsinki hour is 6, so the "wrong" entry silently exits 0.
#
# Also supports manual trigger via workflow_dispatch.

name: Morning Briefing

on:
  schedule:
    - cron: '0 3 * * 1-6'   # 06:00 Helsinki in summer (EEST, UTC+3)
    - cron: '0 4 * * 1-6'   # 06:00 Helsinki in winter (EET, UTC+2)

  workflow_dispatch:
    inputs:
      recipient:
        description: 'Override recipient email (optional)'
        required: false
        type: string

jobs:
  send-briefing:
    name: Send Morning Briefing Email
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Morning Briefing Email
        env:
          # Amazon SES (SMTP) — primary. risto@onelifetime.world verified in SES eu-north-1.
          # SECURITY: Resend SDK removed 2026-03-26 (suspected account compromise). SES only.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM: risto@onelifetime.world
          OUTREACH_DIGEST_EMAIL: ${{ inputs.recipient || secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MRR_EUR: ${{ secrets.MRR_EUR }}
          MVP_ETA: ${{ secrets.MVP_ETA }}
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx tsx scripts/send-morning-briefing.ts
