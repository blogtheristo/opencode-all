name: Send CEO Cockpit Morning Briefing

on:
  schedule:
    # Runs Mon-Sat at 03:00 UTC.
    # This corresponds to 06:00 in Helsinki during summer (EEST, UTC+3).
    # In winter, this will be 05:00 in Helsinki (EET, UTC+2).
    - cron: '0 3 * * 1-6'
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Override recipient email (optional)'
        required: false
        type: string

jobs:
  send-briefing:
    name: Send Morning Briefing Email
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Morning Briefing Email
        env:
          # At least one email provider key is required
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          # Required for data collection
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional overrides for email content and delivery
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'risto@onelifetime.world' }}
          OUTREACH_DIGEST_EMAIL: ${{ inputs.recipient || secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          MRR_EUR: ${{ secrets.MRR_EUR }}
          WEEKLY_COMMITS: ${{ secrets.WEEKLY_COMMITS }}
          MVP_ETA: ${{ secrets.MVP_ETA }}
        run: npx tsx scripts/send-morning-briefing.ts
