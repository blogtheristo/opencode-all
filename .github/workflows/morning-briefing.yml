# Morning Briefing — CEO Cockpit
#
# SCHEDULE DISABLED 2026-09-13 (HIC): Brief V2 last useful delivery ~2026-08-24
# (placeholders / HTTP 404 / stalled content). Replaced by Mission Control —
# see .claude/handoffs/claude/mission-control-ops.md. Do NOT re-enable schedule
# without HIC approval. Keep workflow_dispatch for rare manual sends.
# DGX morning-brief-v2 remains enabled: false in cron-runner.ts.

name: Morning Briefing

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Override recipient email (optional)"
        required: false
        type: string

jobs:
  send-briefing:
    name: Send Morning Briefing Email
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ secrets.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX Spark is handling this
        if: steps.failover.outputs.dgx_alive == 'true' && github.event_name == 'schedule'
        run: |
          echo "DGX Spark is alive — skipping (failover mode)"
          exit 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Send Morning Briefing Email
        env:
          # Amazon SES (SMTP) — primary. risto@onelifetime.world verified in SES eu-north-1.
          # SECURITY: Resend SDK removed 2026-03-26 (suspected account compromise). SES only.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM: risto@onelifetime.world
          OUTREACH_DIGEST_EMAIL: ${{ inputs.recipient || secrets.OUTREACH_DIGEST_EMAIL || 'risto@lifetime.fi' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MRR_EUR: ${{ secrets.MRR_EUR }}
          MVP_ETA: ${{ secrets.MVP_ETA }}
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: node --import tsx scripts/send-morning-brief-v2.ts
