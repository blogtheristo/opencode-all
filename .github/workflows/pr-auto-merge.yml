name: PR Auto-Merge

# Triggers when check suites complete on a PR, or when the ai-approved label is added
on:
  check_suite:
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-Merge if Ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run when a PR has the ai-approved label
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'ai-approved') ||
      github.event_name == 'check_suite'

    steps:
      - name: Find eligible PRs
        id: find-prs
        uses: actions/github-script@v7
        with:
          script: |
            // Find open PRs with ai-approved label
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });

            const eligible = [];

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);

              // Must have ai-approved, must not have ai-changes-requested or do-not-merge
              if (!labels.includes('ai-approved')) continue;
              if (labels.includes('ai-changes-requested')) continue;
              if (labels.includes('do-not-merge')) continue;
              if (labels.includes('needs-human-review')) continue;
              if (labels.includes('has-conflicts')) continue;

              // Check if all status checks pass
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha
              });

              const allPassed = checks.check_runs.every(
                run => run.conclusion === 'success' || run.conclusion === 'skipped' || run.conclusion === 'neutral'
              );

              // Need at least one check to have run (avoid merging with no CI)
              const hasChecks = checks.check_runs.length > 0;

              if (allPassed && hasChecks) {
                eligible.push(pr.number);
              }
            }

            core.setOutput('eligible', JSON.stringify(eligible));
            console.log(`Eligible PRs for auto-merge: ${eligible}`);

      - name: Enable auto-merge for eligible PRs
        uses: actions/github-script@v7
        env:
          ELIGIBLE: ${{ steps.find-prs.outputs.eligible }}
        with:
          script: |
            const eligible = JSON.parse(process.env.ELIGIBLE || '[]');

            for (const prNumber of eligible) {
              try {
                // Post a notification comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: [
                    '## Auto-Merge Ready',
                    '',
                    'All checks passed and AI review approved this PR.',
                    '',
                    '**Action:** Enabling auto-merge (squash). A maintainer can:',
                    '- Add `do-not-merge` label to block',
                    '- Add `needs-human-review` label to pause for manual review',
                    '- Merge manually at any time',
                    '',
                    '*Automated by PR Auto-Merge workflow*'
                  ].join('\n')
                });

                // Enable auto-merge via GraphQL (REST API doesn't support this)
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });

                // Use the merge endpoint directly if auto-merge isn't available
                // (auto-merge requires branch protection rules to be configured)
                try {
                  await github.graphql(`
                    mutation($prId: ID!) {
                      enablePullRequestAutoMerge(input: {
                        pullRequestId: $prId
                        mergeMethod: SQUASH
                      }) {
                        pullRequest { number }
                      }
                    }
                  `, { prId: pr.node_id });

                  console.log(`Auto-merge enabled for PR #${prNumber}`);
                } catch (gqlError) {
                  // Auto-merge may not be available (requires branch protection)
                  // Fall back to adding a ready-to-merge label for human to click merge
                  console.log(`Auto-merge not available for PR #${prNumber}: ${gqlError.message}`);
                  console.log('Adding ready-to-merge label instead.');

                  try {
                    await github.rest.issues.getLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: 'ready-to-merge'
                    });
                  } catch {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: 'ready-to-merge',
                      color: '2ea44f',
                      description: 'All checks passed, AI approved - ready for merge'
                    });
                  }

                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    labels: ['ready-to-merge']
                  });
                }
              } catch (error) {
                console.error(`Failed to process PR #${prNumber}: ${error.message}`);
              }
            }
