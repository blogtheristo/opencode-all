# Flake Detector — surfaces order-dependent / intermittent tests
# Runs the full suite 3x with shuffled sequence weekly; any non-deterministic
# test fails loudly here instead of during housekeeping or releases.
# DGX Spark primary, GitHub-hosted failover (mirrors agents-md-freshness.yml).

name: Flake Detector

on:
  schedule:
    - cron: '0 4 * * 6' # Saturdays 04:00 UTC
  workflow_dispatch: {}

concurrency:
  group: flake-detector
  cancel-in-progress: false

jobs:
  flake-hunt:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Vitest (shuffled, run ${{ matrix.run }})
        run: npx vitest run --sequence.shuffle --reporter=verbose
        env:
          NODE_ENV: test
