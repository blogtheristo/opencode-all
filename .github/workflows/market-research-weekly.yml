name: Weekly Market Research Collection

# DWS_MARKET_RESEARCH_STANDARD.md §4.1 — Every Monday 07:00 UTC
on:
  # Schedule REMOVED 2026-04-08 — DGX Spark is primary (scripts/weekly/market-research.sh)
  # Results emailed via morning brief V2 section 9. Consumed ~43 min/month.
  # Was: cron '0 7 * * 1' (Monday 07:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no Supabase writes)"
        type: boolean
        default: false
      competitor:
        description: "Single competitor name to test (leave empty for all)"
        type: string
        default: ""

permissions:
  contents: write # for committing the weekly market brief
  issues: write # for filing PIPs as GitHub issues

jobs:
  collect:
    name: Collect competitor market data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements-signals.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-signals.txt

      - name: Run market research collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional — enables Tier 3 price extraction
          DRY_RUN: ${{ inputs.dry_run }}
          COMPETITOR: ${{ inputs.competitor }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$COMPETITOR" ]; then
            args+=(--competitor "$COMPETITOR")
          fi
          python scripts/collect_market_research.py "${args[@]}"

      - name: Commit market brief
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/market-research/ || true
          if git diff --cached --quiet; then
            echo "No new market brief to commit"
          else
            WEEK=$(date +%Y-W%V)
            git commit -m "chore(market-research): weekly brief ${WEEK}"
            git push
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-research-logs-${{ github.run_id }}
          path: logs/market_research_*.log
          if-no-files-found: ignore
          retention-days: 14
