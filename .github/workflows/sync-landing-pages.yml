name: Sync Landing Pages

on:
  push:
    branches:
      - main
    paths:
      - 'dws10.com/**'
      - 'onelifetime.world/**'
      - 'DWS_IQ2026.png'
      - 'Firehorse2026.png'
  workflow_dispatch:

jobs:
  sync-landing-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Sync dws10.com to landing-pages/dws10-com
        run: |
          # Create destination directory if it doesn't exist
          mkdir -p landing-pages/dws10-com
          # Copy all files from root folder to landing-pages folder
          cp -r dws10.com/* landing-pages/dws10-com/ 2>/dev/null || true
          # Ensure index.html exists (required file)
          if [ ! -f landing-pages/dws10-com/index.html ]; then
            echo "Error: index.html not found in dws10.com/"
            exit 1
          fi
      
      - name: Sync onelifetime.world to landing-pages/onelifetime-world
        run: |
          # Create destination directory if it doesn't exist
          mkdir -p landing-pages/onelifetime-world
          # Copy all files from root folder to landing-pages folder
          cp -r onelifetime.world/* landing-pages/onelifetime-world/ 2>/dev/null || true
          # Ensure index.html exists (required file)
          if [ ! -f landing-pages/onelifetime-world/index.html ]; then
            echo "Error: index.html not found in onelifetime.world/"
            exit 1
          fi
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Auto-sync: Update landing pages from root source folders [skip ci]'
          branch: automation/sync-landing-pages
          delete-branch: true
          title: 'Auto-sync: Update landing pages from root source folders'
          body: |
            This PR was automatically created by the sync-landing-pages workflow.
            
            It syncs changes from:
            - `dws10.com/` → `landing-pages/dws10-com/`
            - `onelifetime.world/` → `landing-pages/onelifetime-world/`
            
            Please review and merge to apply the landing page updates.
          labels: automated, sync
          add-paths: |
            landing-pages/dws10-com/
            landing-pages/onelifetime-world/

