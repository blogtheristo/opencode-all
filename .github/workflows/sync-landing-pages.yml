name: Sync Landing Pages

on:
  push:
    branches:
      - main
      - feature/firehorse-investor-outreach-platform
    paths:
      - 'dws6.com/**'
      - 'landing-pages/dws6-com/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync dws6.com to landing-pages/dws6-com
        run: |
          mkdir -p landing-pages/dws6-com
          rsync -av --exclude='.*' --exclude='node_modules' dws6.com/ landing-pages/dws6-com/ --delete

      - name: Commit sync changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          if ! git diff --quiet landing-pages/dws6-com/; then
            git add landing-pages/dws6-com/
            git commit -m "chore: sync dws6.com to landing-pages/dws6-com [skip ci]" || echo "No changes to commit"
            git push origin main
          else
            echo "No changes to sync"
          fi

      - name: Purge Cloudflare Cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -z "$CLOUDFLARE_ZONE_ID" ] && [ ! -z "$CLOUDFLARE_API_TOKEN" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"files":["https://dws6.com/*"]}'
            echo "✅ Cloudflare cache purged"
          else
            echo "⚠️  Cloudflare secrets not configured (optional)"
          fi
