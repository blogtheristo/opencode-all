# Supabase anon-grant soak test.
#
# Spins up the full local Supabase stack on the runner, resets the database
# from the complete migration chain (proving it compiles from a blank slate),
# then smoke-tests the anon role against the §7.5 pass criteria
# (Admin/ADMIN_MANUAL_SUPABASE_EN_v1.md):
#
#   - 200 on the public booking/reference surfaces with the anon key
#   - 201 on the lead-form inserts exactly as the production forms send them
#     (Prefer: return=minimal)
#   - 403 + SQLSTATE 42501 on restricted tables — never data
#
# Born from PR #1709: migration 075's blanket grants silently re-opened
# append-only audit tables. Grants changes get a regression gate.

name: supabase-anon-soak

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-anon-soak.yml"
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start -x studio,inbucket,imgproxy,logflare,vector

      - name: Reset database from full migration chain
        run: supabase db reset

      - name: Export local API credentials
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' >> "$GITHUB_ENV"

      - name: "Soak: anon opt-in surfaces stay open"
        run: |
          set -euo pipefail
          req() { curl -s -o /tmp/body -w '%{http_code}' -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$@"; }
          fail() { echo "::error::$1 (HTTP $2)"; cat /tmp/body; exit 1; }

          for path in \
            "booking_services?select=id&limit=1" \
            "booking_availability?select=day_of_week&limit=1" \
            "finnish_holidays?select=date&limit=1" \
            "subscription_plans?select=tier&limit=1"
          do
            status=$(req "$API_URL/rest/v1/$path")
            [ "$status" = "200" ] || fail "anon SELECT broke on $path" "$status"
            echo "OK 200  $path"
          done

          status=$(req -X POST "$API_URL/rest/v1/web_leads" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d '{"source":"contact","email":"ci-soak@example.com","name":"CI Soak","consent":true}')
          [ "$status" = "201" ] || fail "anon INSERT broke on web_leads" "$status"
          echo "OK 201  web_leads insert"

          status=$(req -X POST "$API_URL/rest/v1/captain_inquiries" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d '{"name":"CI Soak","email":"ci-soak@example.com","industry":"construction","seat_level":"deputy"}')
          [ "$status" = "201" ] || fail "anon INSERT broke on captain_inquiries" "$status"
          echo "OK 201  captain_inquiries insert"

      - name: "Soak: revoked surfaces return 42501, never data"
        run: |
          set -euo pipefail
          req() { curl -s -o /tmp/body -w '%{http_code}' -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$@"; }

          # web_leads is INSERT-only for anon; the rest are internal tables.
          for t in web_leads captain_inquiries hil_todos firehorse_leads customers article12_audit_log; do
            status=$(req "$API_URL/rest/v1/$t?select=*&limit=1")
            if [ "$status" != "403" ] && [ "$status" != "401" ] && [ "$status" != "404" ]; then
              echo "::error::anon can still read $t (HTTP $status) — expected 403/42501"
              cat /tmp/body
              exit 1
            fi
            echo "OK $status  $t locked"
          done

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
