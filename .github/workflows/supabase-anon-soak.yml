# Supabase anon-grant soak test.
#
# Spins up the local Supabase stack on the runner, resets the database
# from the complete migration chain (proving it compiles from a blank slate),
# then smoke-tests the anon role against the §7.5 pass criteria
# (Admin/ADMIN_MANUAL_SUPABASE_EN_v1.md):
#
#   - 200 on the public booking/reference surfaces with the anon key
#   - 201 on the lead-form inserts exactly as the production forms send them
#     (Prefer: return=minimal)
#   - 403 + SQLSTATE 42501 on restricted tables — never data
#
# Born from PR #1709: migration 075's blanket grants silently re-opened
# append-only audit tables. Grants changes get a regression gate.

name: supabase-anon-soak

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-anon-soak.yml"
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Disable storage service for CI
        # The runner cannot pull ghcr.io/supabase/storage-api (tag resolves
        # to a non-existent v0.0.0 manifest), and `supabase start -x` proved
        # unreliable at excluding it (runs 1-2, 2026-07-19). The soak only
        # needs Postgres + Kong + PostgREST, so patch config.toml for this
        # run only — the repo copy is untouched.
        run: |
          python3 - <<'EOF'
          import re
          p = 'supabase/config.toml'
          s = open(p).read()
          s = re.sub(r'(\[storage\]\nenabled = )true', r'\1false', s, count=1)
          open(p, 'w').write(s)
          EOF
          grep -A1 '^\[storage\]$' supabase/config.toml

      - name: Start local Supabase stack
        run: supabase start -x studio,mailpit,imgproxy,logflare,vector,realtime,edge-runtime

      - name: Reset database from full migration chain
        run: supabase db reset

      - name: Export local API credentials
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' >> "$GITHUB_ENV"

      - name: "Soak: anon opt-in SELECT surfaces stay open"
        run: |
          set -euo pipefail
          req() { curl -s -o /tmp/body -w '%{http_code}' -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$@"; }
          fail() { echo "::error::$1 (HTTP $2)"; cat /tmp/body; exit 1; }

          # Strict: these are created by the local migration chain — 200 or bust.
          for path in \
            "booking_services?select=id&limit=1" \
            "booking_availability?select=day_of_week&limit=1" \
            "booking_reservations?select=reserved_at&limit=1" \
            "v_booked_slots?select=*&limit=1" \
            "finnish_holidays?select=date&limit=1" \
            "subscription_plans?select=tier&limit=1" \
            "emission_factors?select=id&limit=1"
          do
            status=$(req "$API_URL/rest/v1/$path")
            [ "$status" = "200" ] || fail "anon SELECT broke on $path" "$status"
            echo "OK 200  $path"
          done

          # Drift-tolerant: these exist in production but not (yet) in the
          # local migration chain (created out-of-band — see §7.5 drift notes).
          # Absent locally => 404 tolerated; present => must be 200.
          for path in \
            "ontology_industries?select=slug&limit=1" \
            "ontology_enterprises?select=id&limit=1" \
            "studios_projects_public?select=*&limit=1" \
            "file_index?select=id&limit=1"
          do
            status=$(req "$API_URL/rest/v1/$path")
            case "$status" in
              200) echo "OK 200  $path" ;;
              404) echo "SKIP 404 $path (not in local chain — remote-only)" ;;
              *) fail "anon SELECT broke on $path" "$status" ;;
            esac
          done

      - name: "Soak: anon opt-in INSERT surfaces accept submissions"
        run: |
          set -euo pipefail
          req() { curl -s -o /tmp/body -w '%{http_code}' -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$@"; }
          fail() { echo "::error::$1 (HTTP $2)"; cat /tmp/body; exit 1; }
          post() { req -X POST "$API_URL/rest/v1/$1" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' -d "$2"; }

          status=$(post web_leads '{"source":"contact","email":"ci-soak@example.com","name":"CI Soak","consent":true}')
          [ "$status" = "201" ] || fail "anon INSERT broke on web_leads" "$status"
          echo "OK 201  web_leads"

          status=$(post captain_inquiries '{"name":"CI Soak","email":"ci-soak@example.com","industry":"construction","seat_level":"deputy"}')
          [ "$status" = "201" ] || fail "anon INSERT broke on captain_inquiries" "$status"
          echo "OK 201  captain_inquiries"

          status=$(post playbook_leads '{"email":"ci-soak@example.com","industry_slug":"construction","consent_text":"CI soak consent snapshot"}')
          [ "$status" = "201" ] || fail "anon INSERT broke on playbook_leads" "$status"
          echo "OK 201  playbook_leads"

          # booking_reservations needs a real service_id — fetch one via the
          # anon SELECT path (also proves the read->write booking chain).
          service_id=$(req "$API_URL/rest/v1/booking_services?select=id&limit=1" > /dev/null; python3 -c "import json;print(json.load(open('/tmp/body'))[0]['id'])")
          status=$(post booking_reservations "{\"service_id\":\"$service_id\",\"customer_name\":\"CI Soak\",\"customer_email\":\"ci-soak@example.com\",\"customer_phone\":\"+358000000000\",\"reserved_at\":\"2030-01-15T10:00:00Z\",\"duration_minutes\":30}")
          [ "$status" = "201" ] || fail "anon INSERT broke on booking_reservations" "$status"
          echo "OK 201  booking_reservations"

      - name: "Soak: revoked surfaces return 403 + SQLSTATE 42501, never data"
        run: |
          set -euo pipefail
          req() { curl -s -o /tmp/body -w '%{http_code}' -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$@"; }

          # All of these exist in the local migration chain, so the ONLY
          # acceptable outcome is 403 with SQLSTATE 42501 in the body.
          for t in web_leads captain_inquiries playbook_leads hil_todos firehorse_leads customers article12_audit_log; do
            status=$(req "$API_URL/rest/v1/$t?select=*&limit=1")
            if [ "$status" != "403" ] || ! grep -q '42501' /tmp/body; then
              echo "::error::anon lockdown failed on $t (HTTP $status) — expected 403 + 42501"
              cat /tmp/body
              exit 1
            fi
            echo "OK 403/42501  $t locked"
          done

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
