name: Image Guardian — Protect Image Assets

on:
  pull_request:
    paths:
      - 'dws10.com/static/images/**'
      - 'dws10.com/DWS_IQ2026.png'
      - 'dws10.com/config/image-manifest.json'
      - 'landing-pages/dws10-com/static/images/**'
  push:
    branches: [main]
    paths:
      - 'dws10.com/static/images/**'
      - 'dws10.com/DWS_IQ2026.png'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check image manifest
        run: |
          node scripts/image-guardian.cjs check

      - name: Detect deleted images in PR
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for deleted images in this PR..."
          DELETED=$(git diff --name-only --diff-filter=D origin/${{ github.base_ref }}...HEAD -- "*.png" "*.jpg" "*.jpeg" "*.svg" "*.webp" "*.gif" "*.ico" || true)
          if [ -n "$DELETED" ]; then
            echo "::error::Images deleted in this PR — requires explicit approval:"
            echo "$DELETED"
            echo ""
            echo "If this deletion is intentional, update the manifest:"
            echo "  node scripts/image-guardian.cjs manifest"
            exit 1
          fi
          echo "✅ No images deleted in this PR"
