# Evidence: Tool=GitHub-Copilot-CLI-1.0.88 Model=openai/gpt-5.6-luna Agent=copilot Date=2026-09-27
# Audit trail: git log -- .github/workflows/validate-pricing.yml
name: Validate Pricing Catalog

on:
  pull_request:
    branches: [main]
    paths:
      - "dws10.com/config/products.json"
      - "landing-pages/dws10-com/config/products.json"
      - "DWS_DYNAMIC_DEPLOYMENT_PRICING_STANDARD.md"
      - "scripts/validate-pricing.ts"
      - "scripts/validate-pricing.ps1"
      - "scripts/load-labor-catalog.py"
      - "scripts/validate-product-publication.mjs"
      - "dws10.com/buy/**"
      - "dws10.com/price-list/**"
      - "landing-pages/dws10-com/buy/**"
      - "landing-pages/dws10-com/price-list/**"
      - "lifetime.fi/config/consulting-packages.json"
      - "lifetime.fi/price-list/**"
      - "landing-pages/lifetime-fi/config/consulting-packages.json"
      - "landing-pages/lifetime-fi/price-list/**"
  push:
    branches: [main]
    paths:
      - "dws10.com/config/products.json"
      - "landing-pages/dws10-com/config/products.json"
      - "scripts/validate-product-publication.mjs"

concurrency:
  group: validate-pricing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need main for priceVersion monotonic check

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install project dependencies
        run: npm ci

      - name: Run validator
        run: npm exec -- tsx scripts/validate-pricing.ts

      # Product counts, Serious/Independent IDs, consulting mapping and dual-folder
      # mirrors. A count change must update this validator in the same PR.
      - name: Validate product publication
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          node scripts/validate-product-publication.mjs
