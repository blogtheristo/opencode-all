name: Daily Security Scan - ZenFree

on:
  schedule:
    # Runs at 02:30 UTC daily (staggered from daily-site-backup at 02:00)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -e .

      - name: Run Critical Bug Scanner
        id: scan
        continue-on-error: true
        run: |
          python scripts/scan_critical_bugs.py --full \
            --output security-reports/CRITICAL_BUGS_REPORT.md \
            --json security-scan-results.json

      - name: Parse Security Results
        continue-on-error: true
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          
          results = {
              "timestamp": datetime.now().isoformat(),
              "scan_id": "${{ github.run_id }}",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref }}",
              "commit": "${{ github.sha }}",
              "sources": {}
          }
          
          # Parse ZenFree scan results
          try:
              with open("security-scan-results.json") as f:
                  scan_data = json.load(f)
                  results["sources"]["zenfree"] = scan_data
          except:
              results["sources"]["zenfree"] = {"status": "failed"}
          
          with open("merged-results.json", "w") as f:
              json.dump(results, f, indent=2)
          
          print(json.dumps(results, indent=2))
          EOF

      - name: Create Security Issues
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = {};
            try {
              results = JSON.parse(fs.readFileSync('merged-results.json', 'utf8'));
            } catch (e) {
              console.log('Could not read results:', e);
              return;
            }
            
            const findings = results.sources?.zenfree?.findings || [];
            
            // Create issues for critical/high severity
            for (const finding of findings) {
              if (['critical', 'high'].includes(finding.severity?.toLowerCase())) {
                try {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `🔐 [${finding.severity.toUpperCase()}] ${finding.full_description}`,
                    body: `## Security Finding\n\n**Source:** ZenFree Scanner\n**Severity:** ${finding.severity}\n**CWE:** ${finding.cwe}\n**Type:** ${finding.type}\n\n### Location\n- **File:** \`${finding.file}\`\n- **Line:** ${finding.line}\n\n### Code\n\`\`\`\n${finding.code}\n\`\`\`\n\n### Issue\n${finding.description}\n\n### Related\n- [Security Report](../../security-reports/CRITICAL_BUGS_REPORT.md)\n- [Security Backlog](../../security-reports/SECURITY_BACKLOG_BUG_FIXES.md)`,
                    labels: ['security', 'zenfree', `severity-${finding.severity}`]
                  });
                  console.log(`Created issue for: ${finding.file}:${finding.line}`);
                } catch (e) {
                  console.log(`Could not create issue: ${e}`);
                }
              }
            }

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            security-scan-results.json
            merged-results.json
            security-reports/CRITICAL_BUGS_REPORT.md
          retention-days: 90

      - name: Post Scan Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = {};
            try {
              results = JSON.parse(fs.readFileSync('merged-results.json', 'utf8'));
            } catch (e) {
              console.log('No results available');
              return;
            }
            
            const stats = results.sources?.zenfree?.stats || {};
            const critical = stats.critical || 0;
            const high = stats.high || 0;
            const medium = stats.medium || 0;
            const filesScanned = stats.files_scanned || 0;
            
            core.notice(`✅ Security Scan Complete\n- Files Scanned: ${filesScanned}\n- Critical: ${critical}\n- High: ${high}\n- Medium: ${medium}`);

      - name: Comment on Recent PRs
        if: always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            let results = {};
            try {
              results = JSON.parse(fs.readFileSync('merged-results.json', 'utf8'));
            } catch (e) {
              return;
            }
            
            const findings = results.sources?.zenfree?.findings || [];
            const criticalIssues = findings.filter(f => f.severity?.toLowerCase() === 'critical');
            
            if (criticalIssues.length > 0) {
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                sort: 'updated',
                direction: 'desc',
                per_page: 5
              });
              
              const comment = `🔐 **Security Alert**\n\nCritical vulnerabilities detected: ${criticalIssues.length}\n\n**Affected Files:**\n${criticalIssues.slice(0, 5).map(i => `- \`${i.file}:${i.line}\` - ${i.description}`).join('\n')}\n\nPlease review:\n- [Security Report](../../security-reports/CRITICAL_BUGS_REPORT.md)\n- [Security Backlog](../../security-reports/SECURITY_BACKLOG_BUG_FIXES.md)`;
              
              for (const pr of prs.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: comment
                });
              }
            }

