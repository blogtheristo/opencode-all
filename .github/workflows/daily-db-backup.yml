name: Daily Database Backup

on:
  # Schedule REMOVED 2026-04-08 — DGX Spark is primary (scripts/daily/db-backup.sh)
  # GitHub Actions was failover only, consuming ~120 min/month even on skip checks.
  # Was: cron '30 2 * * *' (daily at 02:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump Supabase → Encrypted Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true

      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ secrets.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX Spark is handling this
        if: steps.failover.outputs.dgx_alive == 'true' && github.event_name == 'schedule'
        run: |
          echo "DGX Spark is alive — skipping (failover mode)"
          exit 0

      - name: Checkout (for backup reports only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      # Client major must be >= Supabase Postgres (see supabase/.temp/postgres-version → PG 17).
      # https://supabase.com/docs/guides/local-development/cli/config (db.major_version)
      - name: Install PostgreSQL 17 client (pg_dump/psql match hosted PG17)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Create backup directory
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups/db/$DATE

      - name: pg_dump (custom format)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DATE=$(date +%Y-%m-%d)
          pg_dump \
            -h db.${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co \
            -U postgres \
            -d postgres \
            -F c \
            -f backups/db/$DATE/dws6_${DATE}.dump

          SIZE=$(stat -c%s backups/db/$DATE/dws6_${DATE}.dump)
          echo "Dump size: $SIZE bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Backup file suspiciously small: $SIZE bytes"
            exit 1
          fi

      - name: Schema-only dump (SQL)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DATE=$(date +%Y-%m-%d)
          pg_dump \
            -h db.${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co \
            -U postgres \
            -d postgres \
            --schema-only \
            -f backups/db/$DATE/schema_${DATE}.sql

      - name: Row count snapshot
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DATE=$(date +%Y-%m-%d)
          psql \
            -h db.${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co \
            -U postgres \
            -d postgres \
            -t -A \
            -c "SELECT json_agg(row_to_json(t)) FROM (SELECT schemaname, relname, n_live_tup FROM pg_stat_user_tables ORDER BY n_live_tup DESC) t" \
            > backups/db/$DATE/row_counts.json || echo "[]" > backups/db/$DATE/row_counts.json

      - name: Bundle and encrypt all backup files
        env:
          GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Create manifest before bundling
          cat > backups/db/$DATE/manifest.json << MANIFEST
          {
            "timestamp": "$(date -Iseconds)",
            "date": "$DATE",
            "source": "github-actions",
            "workflow": "daily-db-backup",
            "run_id": "${{ github.run_id }}",
            "encrypted": true,
            "bundle": "dws6_${DATE}.tar.gpg",
            "contents": ["dws6_${DATE}.dump", "schema_${DATE}.sql", "row_counts.json", "manifest.json"]
          }
          MANIFEST

          # Capture row counts for summary BEFORE encryption
          ROW_COUNTS=$(cat backups/db/$DATE/row_counts.json | head -20)
          echo "ROW_COUNTS<<ROWEOF" >> $GITHUB_ENV
          echo "$ROW_COUNTS" >> $GITHUB_ENV
          echo "ROWEOF" >> $GITHUB_ENV

          # Capture individual file sizes for summary
          DUMP_SIZE=$(stat -c%s backups/db/$DATE/dws6_${DATE}.dump)
          SCHEMA_SIZE=$(stat -c%s backups/db/$DATE/schema_${DATE}.sql)
          echo "DUMP_SIZE=$DUMP_SIZE" >> $GITHUB_ENV
          echo "SCHEMA_SIZE=$SCHEMA_SIZE" >> $GITHUB_ENV

          # Bundle ALL files into a single tarball, then GPG encrypt the tarball.
          # This ensures schema, row counts, and manifest are uniformly protected —
          # if artifact access is ever broadened, no metadata leaks.
          tar -cf backups/db/$DATE/dws6_${DATE}.tar \
            -C backups/db/$DATE \
            dws6_${DATE}.dump schema_${DATE}.sql row_counts.json manifest.json

          printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-fd 0 \
            -o backups/db/$DATE/dws6_${DATE}.tar.gpg \
            backups/db/$DATE/dws6_${DATE}.tar

          # Remove all unencrypted files — only the encrypted bundle remains
          rm backups/db/$DATE/dws6_${DATE}.dump
          rm backups/db/$DATE/dws6_${DATE}.tar
          rm backups/db/$DATE/schema_${DATE}.sql
          rm backups/db/$DATE/row_counts.json
          rm backups/db/$DATE/manifest.json

          BUNDLE_SIZE=$(stat -c%s backups/db/$DATE/dws6_${DATE}.tar.gpg)
          echo "Encrypted bundle size: $BUNDLE_SIZE bytes"
          echo "BUNDLE_SIZE=$BUNDLE_SIZE" >> $GITHUB_ENV

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/db/
          retention-days: 30

      - name: Backup summary
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "## Database Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $DATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Encrypted | Yes — single AES-256 bundle (dump + schema + metadata) |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle | dws6_${DATE}.tar.gpg (${{ env.BUNDLE_SIZE }} bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "| Dump size (pre-encrypt) | ${{ env.DUMP_SIZE }} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema size | ${{ env.SCHEMA_SIZE }} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Row counts (from workflow log only, not in artifact):" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ env.ROW_COUNTS }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To restore: \`gpg --decrypt dws6_${DATE}.tar.gpg | tar xf -\`" >> $GITHUB_STEP_SUMMARY
