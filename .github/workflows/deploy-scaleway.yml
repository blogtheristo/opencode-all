name: Deploy to Scaleway Serverless Containers

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'tsconfig.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: rg.fr-par.scw.cloud
  REGISTRY_NAMESPACE: dws-iq
  IMAGE_NAME: dws-iq-backend
  CONTAINER_NAME: dws-iq-backend
  CONTAINER_NAMESPACE: dwsiqcontainersjwyssm4e
  REGION: fr-par

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  deploy:
    name: Deploy to Scaleway Serverless
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ env.CONTAINER_NAMESPACE }}-${{ env.CONTAINER_NAME }}.functions.fnc.fr-par.scw.cloud

    steps:
      - name: Install Scaleway CLI
        run: |
          curl -o /usr/local/bin/scw -L "https://github.com/scaleway/scaleway-cli/releases/download/v2.34.0/scaleway-cli_2.34.0_linux_amd64"
          chmod +x /usr/local/bin/scw
          scw version

      - name: Configure Scaleway CLI
        run: |
          scw init \
            access-key=${{ secrets.SCW_ACCESS_KEY }} \
            secret-key=${{ secrets.SCW_SECRET_KEY }} \
            organization-id=${{ secrets.SCW_ORGANIZATION_ID }} \
            project-id=${{ secrets.SCW_PROJECT_ID }} \
            region=${{ env.REGION }} \
            send-telemetry=false \
            install-autocomplete=false

      - name: Deploy Container
        run: |
          echo "Deploying container with image digest: ${{ needs.build-and-push.outputs.image_digest }}"

          # Get the container ID
          CONTAINER_ID=$(scw container container list \
            region=${{ env.REGION }} \
            namespace-id=${{ secrets.SCW_NAMESPACE_ID }} \
            -o json | jq -r '.[] | select(.name=="${{ env.CONTAINER_NAME }}") | .id')

          if [ -z "$CONTAINER_ID" ] || [ "$CONTAINER_ID" = "null" ]; then
            echo "Container not found, creating new one..."
            scw container container create \
              region=${{ env.REGION }} \
              namespace-id=${{ secrets.SCW_NAMESPACE_ID }} \
              name=${{ env.CONTAINER_NAME }} \
              registry-image=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
              min-scale=0 \
              max-scale=5 \
              memory-limit=2048 \
              cpu-limit=1000 \
              timeout=300s \
              privacy=public \
              protocol=http1 \
              port=8080 \
              deploy=true
          else
            echo "Updating existing container: $CONTAINER_ID"
            scw container container update \
              region=${{ env.REGION }} \
              $CONTAINER_ID \
              registry-image=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest \
              redeploy=true
          fi

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30

          # Health check
          HEALTH_URL="https://${{ env.CONTAINER_NAMESPACE }}-${{ env.CONTAINER_NAME }}.functions.fnc.${{ env.REGION }}.scw.cloud/health"
          echo "Checking health at: $HEALTH_URL"

          for i in {1..10}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "Deployment successful! Health check passed."
              exit 0
            fi
            echo "Attempt $i: Got HTTP $RESPONSE, waiting..."
            sleep 10
          done

          echo "Warning: Health check did not return 200 after 10 attempts"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment || 'production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ env.REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | https://${{ env.CONTAINER_NAMESPACE }}-${{ env.CONTAINER_NAME }}.functions.fnc.${{ env.REGION }}.scw.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Chat Page | https://${{ env.CONTAINER_NAMESPACE }}-${{ env.CONTAINER_NAME }}.functions.fnc.${{ env.REGION }}.scw.cloud/climate-assistant.html |" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: failure()

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Scaleway Deployment Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Deployment Failure Report

            **Workflow Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Branch:** ${context.ref}
            **Commit:** ${context.sha}
            **Triggered by:** ${context.actor}

            Please check the workflow logs for details.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['deployment', 'bug']
            });
