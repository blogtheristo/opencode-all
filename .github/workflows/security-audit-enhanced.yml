name: Enhanced Security Audit

on:
  # Schedule REMOVED 2026-05-25 (#1384) — DGX Spark cron-runner mirrors scheduled runs
  # Was: cron '0 2 * * 1' (Monday 02:00 UTC)
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'security-reports/SECURITY_AUDIT.md'
      - 'AgentFoundry/Security.md'
      - '.gitignore'
      - 'scripts/gdpr-safety-check.ps1'

jobs:
  security-audit:
    name: Comprehensive Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DGX Spark cron-runner mirrors the scheduled run (cron-runner.ts: security-audit-enhanced).
      # Push-triggered runs (when security-relevant files change) still run on GHA — DGX wouldn't
      # see the push until its next 5-min poll.
      - name: DGX Spark failover check
        id: failover
        if: github.event_name == 'schedule'
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ vars.DGX_SPARK_HEARTBEAT_URL }}

      - name: Skip if DGX is primary (scheduled run)
        if: github.event_name == 'schedule' && steps.failover.outputs.dgx_alive == 'true'
        run: |
          echo "DGX Spark is healthy — scheduled audit runs on DGX. Skipping GHA run."
          exit 0

      - name: Verify deployment file protections
        id: verify-protections
        run: |
          echo "🔍 Verifying deployment file protections..."
          
          # Check .gitignore contains required patterns
          REQUIRED_PATTERNS=(
            "cloudbuild.yaml"
            "docker-compose.mcp.yml"
            "Dockerfile"
            "DOCKER_.*.md"
            "mcp-hub/Dockerfile"
          )
          
          MISSING=0
          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "❌ Missing: $pattern"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $pattern"
            fi
          done
          
          if [ $MISSING -gt 0 ]; then
            echo "::error::Missing $MISSING deployment file protections"
            exit 1
          fi
          
          echo "✅ All deployment file protections verified"
      
      - name: Check for tracked deployment files
        id: check-tracked
        run: |
          echo "🔍 Checking for tracked deployment files..."
          
          TRACKED=0
          DEPLOYMENT_FILES=$(git ls-files | grep -E "(cloudbuild|cloudrun|deploy-gcp|docker-compose\.mcp|DOCKER_|mcp-hub/Dockerfile)" || true)
          
          if [ -n "$DEPLOYMENT_FILES" ]; then
            echo "❌ Tracked deployment files found:"
            echo "$DEPLOYMENT_FILES"
            TRACKED=1
          else
            echo "✅ No deployment files tracked"
          fi
          
          if [ $TRACKED -eq 1 ]; then
            echo "::error::Deployment files are tracked in Git"
            exit 1
          fi
      
      - name: Verify pre-commit secret hook
        id: verify-hook
        run: |
          echo "🔍 Verifying pre-commit secret hook..."
          
          if [ ! -f "scripts/gdpr-safety-check.ps1" ]; then
            echo "::error::Pre-commit hook script not found"
            exit 1
          fi
          
          # Check for secret-file and key-pattern checks in hook
          if ! grep -q "\.env secret file" scripts/gdpr-safety-check.ps1; then
            echo "::error::Pre-commit hook missing .env secret checks"
            exit 1
          fi
          if ! grep -q "service account key json" scripts/gdpr-safety-check.ps1; then
            echo "::error::Pre-commit hook missing service account secret checks"
            exit 1
          fi
          
          echo "✅ Pre-commit secret hook verified"
      
      - name: Check security documentation
        id: check-docs
        run: |
          echo "🔍 Verifying security documentation..."
          
          DOCS=(
            "security-reports/SECURITY_AUDIT.md"
            "security-reports/CONFIDENTIAL_POLICY.md"
            "CLAUDE.md"
          )
          
          MISSING_DOCS=0
          for doc in "${DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing: $doc"
              MISSING_DOCS=$((MISSING_DOCS + 1))
            else
              echo "✅ Found: $doc"
            fi
          done
          
          if [ $MISSING_DOCS -gt 0 ]; then
            echo "::warning::Missing $MISSING_DOCS security documentation files"
          fi
      
      - name: Generate audit report
        if: always()
        run: |
          echo "## 🔒 Enhanced Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Protection Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.verify-protections.outcome }}" == "success" ]; then
            echo "✅ All deployment file protections verified" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Missing deployment file protections" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-tracked.outcome }}" == "success" ]; then
            echo "✅ No deployment files tracked in Git" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment files are tracked (SECURITY RISK)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.verify-hook.outcome }}" == "success" ]; then
            echo "✅ Pre-commit hook verified" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Pre-commit hook issues detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Security Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit Report: security-reports/SECURITY_AUDIT.md" >> $GITHUB_STEP_SUMMARY
          echo "- Confidential Data Policy: security-reports/CONFIDENTIAL_POLICY.md" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Manual: CLAUDE.md" >> $GITHUB_STEP_SUMMARY
          echo "- Agent Security: AgentFoundry/Security.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Related Workflows" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Verify .gitignore Protections: verify-gitignore-protections.yml" >> $GITHUB_STEP_SUMMARY
          echo "- Daily Security Scan: security-scan-daily.yml" >> $GITHUB_STEP_SUMMARY
          echo "- Monthly Security Audit: monthly-security-audit.yml" >> $GITHUB_STEP_SUMMARY
