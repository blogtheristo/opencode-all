name: Verify .gitignore Protections

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 3 AM UTC (staggered from daily-site-backup at 02:00, security-scan at 02:30)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  verify-gitignore:
    name: Verify Deployment File Protections
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for checking tracked files
      
      - name: Verify .gitignore contains deployment protections
        id: check-gitignore
        run: |
          echo "🔍 Checking .gitignore for deployment file protections..."
          
          # Required patterns that must exist in .gitignore
          # NOTE: Dockerfile and .dockerignore removed - they're needed for CI/CD
          REQUIRED_PATTERNS=(
            "cloudrun-service.yaml"
            "deploy-gcp.sh"
            "setup-secrets-gcp.sh"
            "GCP_DEPLOYMENT.md"
            "QUICK_DEPLOY.md"
            "docker-compose.mcp.yml"
            "DOCKER_.*.md"
            "mcp-hub/DOCKER_.*"
            "mcp-hub/GCP_.*"
            "mcp-hub/DEPLOY_.*"
          )
          
          MISSING_PATTERNS=()
          
          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              MISSING_PATTERNS+=("$pattern")
              echo "❌ Missing: $pattern"
            else
              echo "✅ Found: $pattern"
            fi
          done
          
          if [ ${#MISSING_PATTERNS[@]} -gt 0 ]; then
            echo "::error::Missing deployment file protections in .gitignore"
            echo "Missing patterns: ${MISSING_PATTERNS[*]}"
            exit 1
          fi
          
          echo "✅ All required deployment file protections found in .gitignore"
      
      - name: Check for tracked deployment files
        id: check-tracked
        run: |
          echo "🔍 Checking if deployment files are tracked in Git..."

          # Files that should NEVER be tracked (secrets/deployment procedures)
          # NOTE: Dockerfile and .dockerignore ARE ALLOWED - needed for CI/CD
          # They don't contain secrets, just build instructions
          DEPLOYMENT_FILES=(
            "cloudrun-service.yaml"
            "deploy-gcp.sh"
            "setup-secrets-gcp.sh"
            "GCP_DEPLOYMENT.md"
            "QUICK_DEPLOY.md"
            "docker-compose.mcp.yml"
          )
          
          TRACKED_FILES=()
          
          for file in "${DEPLOYMENT_FILES[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              TRACKED_FILES+=("$file")
              echo "❌ TRACKED (SECURITY RISK): $file"
            else
              echo "✅ Not tracked: $file"
            fi
          done
          
          # Check for DOCKER_*.md files
          DOCKER_DOCS=$(git ls-files | grep -E "^DOCKER_.*\.md$" || true)
          if [ -n "$DOCKER_DOCS" ]; then
            echo "❌ TRACKED DOCKER documentation files found:"
            echo "$DOCKER_DOCS" | while read -r file; do
              TRACKED_FILES+=("$file")
              echo "   - $file"
            done
          fi
          
          # Check for mcp-hub deployment files
          MCP_DEPLOY=$(git ls-files | grep -E "^mcp-hub/(Dockerfile|DOCKER_|GCP_|DEPLOY_|.*deploy)" || true)
          if [ -n "$MCP_DEPLOY" ]; then
            echo "❌ TRACKED MCP Hub deployment files found:"
            echo "$MCP_DEPLOY" | while read -r file; do
              TRACKED_FILES+=("$file")
              echo "   - $file"
            done
          fi
          
          if [ ${#TRACKED_FILES[@]} -gt 0 ]; then
            echo "::error::Deployment files are tracked in Git (SECURITY RISK)"
            echo "Tracked files: ${TRACKED_FILES[*]}"
            echo "::warning::These files should be removed from Git tracking using: git rm --cached <file>"
            exit 1
          fi
          
          echo "✅ No deployment files are tracked in Git"
      
      - name: Verify .gitignore section exists
        id: check-section
        run: |
          echo "🔍 Verifying MCP HUB DEPLOYMENT FILES section exists..."
          
          if ! grep -q "MCP HUB DEPLOYMENT FILES" .gitignore; then
            echo "::error::Missing 'MCP HUB DEPLOYMENT FILES' section in .gitignore"
            exit 1
          fi
          
          echo "✅ Deployment files section found in .gitignore"
      
      - name: Generate protection report
        if: always()
        run: |
          echo "## 🔒 Deployment File Protection Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Protection Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-gitignore.outcome }}" == "success" ]; then
            echo "✅ All required patterns found in .gitignore" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Missing patterns in .gitignore" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-tracked.outcome }}" == "success" ]; then
            echo "✅ No deployment files tracked in Git" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment files are tracked (SECURITY RISK)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Protected Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Google Cloud: cloudrun-service.yaml, deploy-gcp.sh, setup-secrets-gcp.sh" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: docker-compose.mcp.yml, DOCKER_*.md" >> $GITHUB_STEP_SUMMARY
          echo "- MCP Hub: mcp-hub/DOCKER_*.md, mcp-hub/GCP_*.md, mcp-hub/DEPLOY_*.md" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: GCP_DEPLOYMENT.md, QUICK_DEPLOY.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Allowed for CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile (build instructions only, no secrets)" >> $GITHUB_STEP_SUMMARY
          echo "- .dockerignore (file exclusion rules)" >> $GITHUB_STEP_SUMMARY
          echo "- cloudbuild.yaml (build configuration)" >> $GITHUB_STEP_SUMMARY
