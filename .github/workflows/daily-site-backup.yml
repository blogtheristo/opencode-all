name: Daily Site Backup

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Create backups directory
        run: |
          mkdir -p backups/sites/$(date +%Y-%m-%d)
          echo "✅ Backup directory created"

      - name: 🔄 Run backup script
        run: |
          chmod +x scripts/backup-sites.sh
          ./scripts/backup-sites.sh

      - name: 📊 Display backup summary
        run: |
          echo ""
          echo "=========================================="
          echo "Backup Summary"
          echo "=========================================="

          BACKUP_DATE=$(date +%Y-%m-%d)
          MANIFEST="backups/sites/$BACKUP_DATE/MANIFEST.txt"

          if [ -f "$MANIFEST" ]; then
            cat "$MANIFEST"
          else
            echo "⚠️ No manifest file found"
          fi

          echo ""
          echo "📁 Backup files:"
          ls -lh backups/sites/$BACKUP_DATE/*.tar.gz 2>/dev/null || echo "No backup files found"

      - name: 📤 Upload backups as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-backups-${{ github.run_number }}
          path: backups/sites/*/
          retention-days: 30

      - name: 🔍 Check if backups need to be committed
        id: check_changes
        run: |
          # We don't commit backups to git (they're too large)
          # But we track the manifest file
          BACKUP_DATE=$(date +%Y-%m-%d)

          if [ -f "backups/sites/$BACKUP_DATE/MANIFEST.txt" ]; then
            echo "has_manifest=true" >> $GITHUB_OUTPUT
            echo "backup_date=$BACKUP_DATE" >> $GITHUB_OUTPUT
          else
            echo "has_manifest=false" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Create backup log entry
        if: steps.check_changes.outputs.has_manifest == 'true'
        run: |
          BACKUP_DATE="${{ steps.check_changes.outputs.backup_date }}"
          LOG_DIR=".workflows/audit/backups"
          mkdir -p "$LOG_DIR"

          cat > "$LOG_DIR/backup-$BACKUP_DATE.log" << EOF
          # Daily Site Backup Log

          **Date:** $BACKUP_DATE
          **Time:** $(date +%H:%M:%S) UTC
          **Workflow Run:** ${{ github.run_number }}
          **Triggered By:** ${{ github.event_name }}

          ## Backup Summary

          $(cat backups/sites/$BACKUP_DATE/MANIFEST.txt)

          ## Artifacts

          - Artifact Name: site-backups-${{ github.run_number }}
          - Retention: 30 days
          - Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Restoration Instructions

          1. Download artifacts from GitHub Actions
          2. Extract the desired backup:
             \`\`\`bash
             tar -xzf [site-name]_[timestamp].tar.gz
             \`\`\`
          3. Verify extracted files
          4. Deploy to production if needed

          ---

          **Status:** ✅ Backup Completed Successfully
          EOF

      - name: 🚀 Commit backup log
        if: steps.check_changes.outputs.has_manifest == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BACKUP_DATE="${{ steps.check_changes.outputs.backup_date }}"

          git add .workflows/audit/backups/backup-$BACKUP_DATE.log

          git commit -m "chore: daily site backup log $BACKUP_DATE [skip ci]

          Automated backup completed for $BACKUP_DATE
          Workflow: daily-site-backup.yml
          Run: ${{ github.run_number }}

          Sites backed up:
          - dws6.com
          - dws10.com
          - onelifetime.world
          - landing-pages (all 3 sites)

          Backup artifacts available for 30 days."

          git push origin main

          echo "✅ Backup log committed to repository"

      - name: ✨ Workflow complete
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "✅ Daily Site Backup Complete"
          echo "========================================="
          echo ""
          echo "📊 Status:"
          echo "  Date: $(date +%Y-%m-%d)"
          echo "  Time: $(date +%H:%M:%S) UTC"
          echo "  Workflow Run: ${{ github.run_number }}"
          echo ""
          echo "🔗 Links:"
          echo "  Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  Repository: https://github.com/${{ github.repository }}"
          echo ""
