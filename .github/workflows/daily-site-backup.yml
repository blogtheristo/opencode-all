name: Daily Site Backup

on:
  # Schedule REMOVED 2026-04-08 — DGX Spark is primary (scripts/daily/backup-sites.sh)
  # GitHub Actions was failover only, consuming ~150 min/month even on skip checks.
  # Was: cron '0 2 * * *' (daily at 02:00 UTC)
  workflow_dispatch: # Allow manual trigger

# Concurrency: prevent multiple backup jobs running simultaneously
concurrency:
  group: site-backup
  cancel-in-progress: false

jobs:
  failover-check:
    runs-on: ubuntu-latest
    outputs:
      dgx_alive: ${{ steps.failover.outputs.dgx_alive }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - name: DGX Spark failover check
        id: failover
        uses: ./.github/actions/dgx-failover-check
        with:
          heartbeat_url: ${{ secrets.DGX_SPARK_HEARTBEAT_URL }}

  backup:
    needs: failover-check
    if: needs.failover-check.outputs.dgx_alive != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Timeout after 30 minutes (backups should complete quickly)
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Ensure we have write access for commit
          token: ${{ github.token }}

      - name: 🔍 Verify site directories exist
        id: verify_sites
        run: |
          echo "Checking for site directories..."
          SITES_FOUND=0

          for site in dws6.com dws10.com onelifetime.world landing-pages/dws6-com landing-pages/dws10-com landing-pages/onelifetime-world; do
            if [ -d "$site" ]; then
              echo "✅ Found: $site"
              SITES_FOUND=$((SITES_FOUND + 1))
            else
              echo "⚠️ Not found: $site"
            fi
          done

          echo "sites_found=$SITES_FOUND" >> $GITHUB_OUTPUT

          if [ $SITES_FOUND -eq 0 ]; then
            echo "❌ No site directories found. Exiting."
            exit 1
          fi

      - name: 📦 Create backups directory
        run: |
          mkdir -p backups/sites/$(date +%Y-%m-%d)
          echo "✅ Backup directory created"

      - name: 🔄 Run backup script
        id: backup
        run: |
          chmod +x scripts/backup-sites.sh
          # Run backup and capture exit code
          if ./scripts/backup-sites.sh; then
            echo "backup_success=true" >> $GITHUB_OUTPUT
          else
            echo "backup_success=false" >> $GITHUB_OUTPUT
            echo "⚠️ Backup script completed with warnings"
          fi

      - name: 📊 Display backup summary
        run: |
          echo ""
          echo "=========================================="
          echo "Backup Summary"
          echo "=========================================="

          BACKUP_DATE=$(date +%Y-%m-%d)
          MANIFEST="backups/sites/$BACKUP_DATE/MANIFEST.txt"

          if [ -f "$MANIFEST" ]; then
            cat "$MANIFEST"
          else
            echo "⚠️ No manifest file found"
          fi

          echo ""
          echo "📁 Backup files:"
          ls -lh backups/sites/$BACKUP_DATE/*.tar.gz 2>/dev/null || echo "No backup files found"

      - name: 📤 Upload backups as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-backups-${{ github.run_number }}
          path: backups/sites/*/
          retention-days: 30

      - name: 🔍 Check if backups need to be committed
        id: check_changes
        run: |
          # We don't commit backups to git (they're too large)
          # But we track the manifest file
          BACKUP_DATE=$(date +%Y-%m-%d)

          if [ -f "backups/sites/$BACKUP_DATE/MANIFEST.txt" ]; then
            echo "has_manifest=true" >> $GITHUB_OUTPUT
            echo "backup_date=$BACKUP_DATE" >> $GITHUB_OUTPUT
          else
            echo "has_manifest=false" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Create backup log entry
        if: steps.check_changes.outputs.has_manifest == 'true'
        run: |
          BACKUP_DATE="${{ steps.check_changes.outputs.backup_date }}"
          LOG_DIR=".workflows/audit/backups"
          mkdir -p "$LOG_DIR"

          cat > "$LOG_DIR/backup-$BACKUP_DATE.log" << EOF
          # Daily Site Backup Log

          **Date:** $BACKUP_DATE
          **Time:** $(date +%H:%M:%S) UTC
          **Workflow Run:** ${{ github.run_number }}
          **Triggered By:** ${{ github.event_name }}

          ## Backup Summary

          $(cat backups/sites/$BACKUP_DATE/MANIFEST.txt)

          ## Artifacts

          - Artifact Name: site-backups-${{ github.run_number }}
          - Retention: 30 days
          - Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Restoration Instructions

          1. Download artifacts from GitHub Actions
          2. Extract the desired backup:
             \`\`\`bash
             tar -xzf [site-name]_[timestamp].tar.gz
             \`\`\`
          3. Verify extracted files
          4. Deploy to production if needed

          ---

          **Status:** ✅ Backup Completed Successfully
          EOF

      - name: 🚀 Commit backup log
        if: steps.check_changes.outputs.has_manifest == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BACKUP_DATE="${{ steps.check_changes.outputs.backup_date }}"

          # Check if there are changes to commit
          git add .workflows/audit/backups/backup-$BACKUP_DATE.log

          if git diff --staged --quiet; then
            echo "No changes to commit (log may already exist)"
            exit 0
          fi

          git commit -m "chore: daily site backup log $BACKUP_DATE [skip ci]

          Automated backup completed for $BACKUP_DATE
          Workflow: daily-site-backup.yml
          Run: ${{ github.run_number }}

          Sites backed up:
          - dws6.com
          - dws10.com
          - onelifetime.world
          - landing-pages (all 3 sites)

          Backup artifacts available for 30 days."

          # Pull latest changes before push to avoid conflicts
          git pull --rebase origin main || true

          # Push with retry logic
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Backup log committed to repository"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
            git pull --rebase origin main || true
          done

          echo "⚠️ Failed to push after 3 attempts"
          exit 1

      - name: ✨ Workflow complete
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "✅ Daily Site Backup Complete"
          echo "========================================="
          echo ""
          echo "📊 Status:"
          echo "  Date: $(date +%Y-%m-%d)"
          echo "  Time: $(date +%H:%M:%S) UTC"
          echo "  Workflow Run: ${{ github.run_number }}"
          echo ""
          echo "🔗 Links:"
          echo "  Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  Repository: https://github.com/${{ github.repository }}"
          echo ""
