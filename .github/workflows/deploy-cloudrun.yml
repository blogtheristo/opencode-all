name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - claude/*
  workflow_dispatch:

env:
  PROJECT_ID: dws6run6
  REGION: europe-north1
  SERVICE_NAME: dws-iq-backend
  IMAGE_NAME: dws-iq-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --set-env-vars=\
"STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},\
STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},\
SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},\
SMTP_HOST=${{ secrets.SMTP_HOST }},\
SMTP_PORT=${{ secrets.SMTP_PORT || '587' }},\
SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }},\
SMTP_USER=${{ secrets.SMTP_USER }},\
SMTP_PASS=${{ secrets.SMTP_PASS }},\
EMAIL_FROM=${{ secrets.EMAIL_FROM || 'risto@onelifetime.world' }},\
BOOKING_ADMIN_EMAIL=${{ secrets.BOOKING_ADMIN_EMAIL || 'risto@lifetime.fi' }},\
NODE_ENV=production"

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Deployed to: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Print deployment summary
        run: |
          echo "✅ Deployment complete!"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest"
