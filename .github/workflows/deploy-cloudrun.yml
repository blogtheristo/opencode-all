name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "Dockerfile.*"
      - "infrastructure/cloudrun/**"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:

# Cancel earlier deploys when a new commit lands on main — only the latest
# image needs to ship.
concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: dws6run6
  REGION: europe-north1
  SERVICE_NAME: dws-iq-backend
  IMAGE_NAME: dws-iq-backend
  # Gracefully skip (instead of hard-failing the main pipeline) when WIF secrets
  # are absent. Setup: infrastructure/cloudrun/CI_DEPLOY_IDENTITY_RUNBOOK.md
  HAS_GCP_DEPLOY_AUTH: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_SERVICE_ACCOUNT != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Skip deploy when GCP WIF credentials are unavailable
        if: env.HAS_GCP_DEPLOY_AUTH != 'true'
        run: |
          echo "WIF_PROVIDER / WIF_SERVICE_ACCOUNT are not configured in this context."
          echo "Skipping Cloud Run deploy instead of failing the pipeline."
          {
            echo "## Cloud Run Deployment"
            echo ""
            echo "Skipped: workload identity secrets are unavailable."
            echo "See infrastructure/cloudrun/CI_DEPLOY_IDENTITY_RUNBOOK.md to enable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        uses: actions/checkout@v4

      # WIF requires google-github-actions/auth@v2 to mint the access token
      # (fixes iam.serviceAccounts.getAccessToken gate). setup-gcloud@v1 alone
      # does not authenticate via workload identity.
      - name: Authenticate to GCP (Workload Identity)
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --set-env-vars="STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},SMTP_HOST=${{ secrets.SMTP_HOST }},SMTP_PORT=${{ secrets.SMTP_PORT || '587' }},SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }},SMTP_USER=${{ secrets.SMTP_USER }},SMTP_PASS=${{ secrets.SMTP_PASS }},EMAIL_FROM=${{ secrets.EMAIL_FROM || 'risto@onelifetime.world' }},BOOKING_ADMIN_EMAIL=${{ secrets.BOOKING_ADMIN_EMAIL || 'risto@lifetime.fi' }},NODE_ENV=production"

      - name: Get service URL
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Deployed to: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Print deployment summary
        if: env.HAS_GCP_DEPLOY_AUTH == 'true'
        run: |
          echo "✅ Deployment complete!"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/dws-iq-repo/${{ env.IMAGE_NAME }}:latest"
