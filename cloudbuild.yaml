# Google Cloud Build configuration for DWS IQ Backend
# Deploys to Cloud Run (dws6run6) with auto-scaling and secrets management

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq/backend:$COMMIT_SHA'
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq/backend:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq/backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq/backend:latest'

  # Deploy to Cloud Run (dws6run6)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'dws6run6'
      - '--image'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq/backend:$COMMIT_SHA'
      - '--region'
      - 'europe-north1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '60s'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=anthropic-api-key:latest,GOOGLE_AI_API_KEY=google-ai-api-key:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_KEY=supabase-service-key:latest,JWT_SECRET=jwt-secret:latest'

# Store images in Artifact Registry
images:
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq/backend:$COMMIT_SHA'
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq/backend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY

# Substitutions (can be overridden)
substitutions:
  _REGION: 'europe-north1'

# Timeout for the entire build
timeout: '1200s'
