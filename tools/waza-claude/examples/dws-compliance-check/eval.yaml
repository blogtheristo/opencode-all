# Waza eval for the DWS /compliance-check skill
# Uses the Claude executor — requires ANTHROPIC_API_KEY at runtime.
#
# Run:
#   waza-claude run tools/waza-claude/examples/dws-compliance-check/eval.yaml \
#     --context-dir tools/waza-claude/examples/dws-compliance-check/fixtures \
#     -v
#
# Fast CI smoke test (no API call):
#   waza run ... --executor mock

name: dws-compliance-check-eval
description: >
  Evaluates the DWS /compliance-check skill: tests that the skill identifies
  CSRD, CBAM, and EU AI Act obligations correctly given a company profile.

skill: compliance-check
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: claude
  model: claude-sonnet-4-6

metrics:
  - name: task_completion
    weight: 0.5
    threshold: 0.8
    description: Did the skill produce a compliance assessment?

  - name: behavior_quality
    weight: 0.3
    threshold: 0.7
    description: Did the response stay within expected length and structure?

  - name: trigger_accuracy
    weight: 0.2
    threshold: 0.9
    description: Does the skill activate on compliance prompts?

graders:
  - type: text
    name: no_fatal_errors
    config:
      regex_not_match:
        - "(?i)fatal error|unhandled exception|crashed"

tasks:
  - "tasks/*.yaml"
