id: csrd-obligation-001
name: CSRD obligation for large EU manufacturer
description: >
  Test that the skill identifies CSRD reporting obligation for a company
  that meets the size thresholds.

inputs:
  prompt: >
    Run a compliance check for this company profile:
    - Name: Steelworks Oy
    - Sector: Steel manufacturing (NACE C24)
    - Employees: 600
    - Revenue: €180M
    - Domicile: Finland (EU)
    - Listed: Yes (Helsinki Stock Exchange)
    What CSRD obligations apply and when?

  context:
    regulation: CSRD
    jurisdiction: EU
    year: "2026"

expected:
  output_contains:
    - CSRD
    - 2025
  output_not_contains:
    - "not applicable"
    - "exempt"

  behavior:
    max_tokens: 2000

graders:
  - name: identifies_csrd
    type: text
    config:
      contains:
        - "CSRD"
        - "sustainability"

  - name: mentions_deadline
    type: text
    config:
      regex_match:
        - "202[45]|first report|fiscal year"

  - name: quality_check
    type: prompt
    rubric: >
      Does the response correctly identify that Steelworks Oy falls under CSRD
      (large listed company, >500 employees, EU domicile) and state the first
      reporting year? Score 1 if both facts are stated correctly, 0 otherwise.
    model: claude-haiku-4-5-20251001
