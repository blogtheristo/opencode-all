id: mock-smoke-001
name: Mock smoke test (no API key needed)
description: >
  Structural validation that the eval YAML is well-formed and the mock
  executor can process the task. Run this in CI before real Claude evals.

inputs:
  prompt: "Run a compliance check for a steel manufacturer with 600 employees."
  files:
    - path: eu-thresholds.md

expected:
  output_contains:
    - "compliance"

graders:
  - name: has_output
    type: code
    config:
      assertions:
        - "len(output) > 10"

  - name: no_crash
    type: text
    config:
      regex_not_match:
        - "(?i)panic|fatal|null pointer"
