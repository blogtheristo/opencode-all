{% extends "layout.html" %}

{% block content %}
<div class="bg-gray-50 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Lifetime Firehorse™Store</h2>
            <p class="mt-4 max-w-2xl text-xl text-gray-500 mx-auto">
                Intelligent tools for the new industrial age.
            </p>
        </div>

        <div class="mt-12 grid gap-8 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
            {% for product in products %}
            <div class="flex flex-col rounded-lg shadow-lg overflow-hidden bg-white hover:shadow-2xl transition-shadow duration-300">
                <div class="flex-shrink-0 bg-gray-200 h-48 flex items-center justify-center">
                    <img class="h-full w-full object-cover" src="{{ product.image }}" alt="{{ product.title }}">
                </div>
                <div class="flex-1 bg-white p-6 flex flex-col justify-between">
                    <div class="flex-1">
                        <p class="text-sm font-medium text-indigo-600">
                            Software
                        </p>
                        <a href="{{ product.link }}" class="block mt-2">
                            <p class="text-xl font-semibold text-gray-900">
                                {{ product.title }}
                            </p>
                            <p class="mt-3 text-base text-gray-500">
                                {{ product.description }}
                            </p>
                        </a>
                    </div>
                    <div class="mt-6 flex items-center justify-between">
                        <div class="text-2xl font-bold text-gray-900">
                            €{{ product.price }}
                        </div>
                        <div class="ml-4">
                            <a href="{{ product.link }}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
                                View Details
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
