<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | DWS IQ Platform - Lifetime Oy</title>
    <meta name="description" content="Complete your purchase securely via Revolut Business or PayPal Business.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; min-height: 100vh; }
        
        .checkout-container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        
        .checkout-header { text-align: center; margin-bottom: 40px; }
        .checkout-header h1 { color: #60a5fa; font-size: 2rem; margin-bottom: 8px; }
        .checkout-header p { color: #94a3b8; }
        
        .checkout-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 32px; margin-bottom: 24px; }
        
        .order-summary h2 { color: #e2e8f0; font-size: 1.2rem; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .order-item:last-child { border-bottom: none; }
        .order-item-name { font-weight: 500; }
        .order-item-price { color: #4ade80; font-weight: 600; font-size: 1.2rem; }
        
        .order-total { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 0; margin-top: 16px; border-top: 2px solid rgba(255,255,255,0.1); }
        .order-total-label { font-size: 1.1rem; font-weight: 600; }
        .order-total-price { color: #4ade80; font-weight: 700; font-size: 1.5rem; }
        
        .customer-form h2 { color: #e2e8f0; font-size: 1.2rem; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #e2e8f0; font-size: 1rem; transition: all 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1); }
        .form-group input::placeholder { color: #64748b; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        
        .payment-methods h2 { color: #e2e8f0; font-size: 1.2rem; margin-bottom: 20px; }
        
        .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .payment-option { background: rgba(15, 23, 42, 0.8); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .payment-option:hover { border-color: rgba(96, 165, 250, 0.5); }
        .payment-option.selected { border-color: #60a5fa; background: rgba(96, 165, 250, 0.1); }
        .payment-option-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 4px; }
        .payment-option-fee { font-size: 0.85rem; color: #94a3b8; }
        .payment-option-badge { display: inline-block; margin-top: 8px; padding: 4px 12px; background: rgba(74, 222, 128, 0.1); color: #4ade80; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        
        .btn-pay { width: 100%; padding: 18px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-pay:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-1px); }
        .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .security-note { text-align: center; margin-top: 20px; color: #64748b; font-size: 0.85rem; }
        .security-note svg { vertical-align: middle; margin-right: 6px; }
        
        .error-message { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .error-message.show { display: block; }
        
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #60a5fa; text-decoration: none; margin-bottom: 24px; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 640px) {
            .form-row, .payment-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <a href="../buy/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Store
        </a>

        <div class="checkout-header">
            <h1>Secure Checkout</h1>
            <p>Complete your purchase in a few simple steps</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <!-- Order Summary -->
        <div class="checkout-card order-summary">
            <h2>Order Summary</h2>
            <div class="order-item">
                <span class="order-item-name" id="productName">Loading...</span>
                <span class="order-item-price" id="productPrice">€0</span>
            </div>
            <div class="order-total">
                <span class="order-total-label">Total</span>
                <span class="order-total-price" id="totalPrice">€0</span>
            </div>
        </div>

        <!-- Customer Information -->
        <div class="checkout-card customer-form">
            <h2>Customer Information</h2>
            <form id="checkoutForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required placeholder="Doe">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required placeholder="john@company.com">
                </div>
                <div class="form-group">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" name="company" placeholder="Acme Corporation">
                </div>
                <div class="form-group">
                    <label for="country">Country *</label>
                    <select id="country" name="country" required>
                        <option value="">Select country...</option>
                        <option value="FI">Finland</option>
                        <option value="SE">Sweden</option>
                        <option value="NO">Norway</option>
                        <option value="DK">Denmark</option>
                        <option value="DE">Germany</option>
                        <option value="FR">France</option>
                        <option value="NL">Netherlands</option>
                        <option value="BE">Belgium</option>
                        <option value="AT">Austria</option>
                        <option value="CH">Switzerland</option>
                        <option value="UK">United Kingdom</option>
                        <option value="US">United States</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Payment Method -->
        <div class="checkout-card payment-methods">
            <h2>Payment Method</h2>
            <div class="payment-options">
                <div class="payment-option selected" data-provider="revolut" onclick="selectPayment('revolut')">
                    <div class="payment-option-name" style="color: #60a5fa;">Revolut Business</div>
                    <div class="payment-option-fee">Low fees for EU</div>
                    <span class="payment-option-badge">Recommended</span>
                </div>
                <div class="payment-option" data-provider="paypal" onclick="selectPayment('paypal')">
                    <div class="payment-option-name" style="color: #0070ba;">PayPal</div>
                    <div class="payment-option-fee">Global payments</div>
                    <span class="payment-option-badge" style="background: rgba(0, 112, 186, 0.1); color: #0070ba;">Worldwide</span>
                </div>
            </div>

            <button type="button" class="btn-pay" id="payButton" onclick="processPayment()">
                Pay Now
            </button>

            <p class="security-note">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                Secure payment processing. Your data is encrypted and protected.
            </p>
        </div>
    </div>

    <script>
        // Configuration - loaded from products.json
        const API_BASE = 'https://api.lifetime.fi/v1/payments';
        let PAYPAL_EMAIL = 'risto.anton@lifetime.fi';
        let REVOLUT_FALLBACK_LINK = 'https://revolut.me/lifetimeoy';
        
        // Products loaded from config
        let PRODUCTS = {};

        let selectedPayment = 'revolut';
        let currentProduct = null;

        // Trusted payment provider domains for redirect validation
        const TRUSTED_PAYMENT_DOMAINS = [
            'revolut.com',
            'revolut.me',
            'checkout.revolut.com',  // Revolut Merchant Checkout
            'b2b.revolut.com',
            'sandbox.revolut.com',
            'sandbox-checkout.revolut.com',
            'paypal.com',
            'www.paypal.com',
            'sandbox.paypal.com',
            'lifetime.fi',
            'api.lifetime.fi',
            'dws10.com'
        ];

        /**
         * Validates and performs a safe redirect to trusted payment provider domains.
         * Returns true if redirect was performed, false if URL was blocked.
         * @param {string} url - The URL to redirect to
         * @returns {boolean} - Whether redirect was performed
         */
        function safeRedirect(url) {
            // Trusted payment provider domains - hardcoded for security
            const trustedDomains = [
                'revolut.com',
                'revolut.me',
                'checkout.revolut.com',      // Revolut Merchant Checkout
                'sandbox-checkout.revolut.com',
                'b2b.revolut.com',
                'sandbox.revolut.com',
                'paypal.com',
                'www.paypal.com',
                'sandbox.paypal.com'
            ];

            try {
                const parsedUrl = new URL(url);
                const hostname = parsedUrl.hostname.toLowerCase();
                
                // Validate against trusted domains only
                const isTrusted = trustedDomains.some(domain => 
                    hostname === domain || hostname.endsWith('.' + domain)
                );

                if (isTrusted) {
                    // Safe to redirect - domain is in whitelist
                    window.location.href = url;
                    return true;
                } else {
                    console.error('Redirect blocked: untrusted URL domain', hostname);
                    showError('Unable to redirect to payment provider. Please contact support.');
                    return false;
                }
            } catch (e) {
                console.error('Invalid URL for redirect:', e);
                showError('Invalid payment URL. Please try again.');
                return false;
            }
        }

        // Legacy function for backward compatibility
        function isValidPaymentUrl(url) {
            try {
                const parsedUrl = new URL(url);
                const hostname = parsedUrl.hostname.toLowerCase();
                return TRUSTED_PAYMENT_DOMAINS.some(domain => 
                    hostname === domain || hostname.endsWith('.' + domain)
                );
            } catch (e) {
                return false;
            }
        }

        // Initialize checkout
        document.addEventListener('DOMContentLoaded', async () => {
            await loadConfig();
            loadProduct();
        });

        // Load products config from JSON
        async function loadConfig() {
            try {
                const response = await fetch('../config/products.json');
                if (!response.ok) throw new Error('Failed to load config');
                
                const data = await response.json();
                PRODUCTS = data.products;
                
                // Update settings
                if (data.settings) {
                    PAYPAL_EMAIL = data.settings.paypalEmail || PAYPAL_EMAIL;
                    REVOLUT_FALLBACK_LINK = data.settings.revolutFallbackLink || REVOLUT_FALLBACK_LINK;
                }
                
                console.log('Products loaded from config:', Object.keys(PRODUCTS).length);
            } catch (error) {
                console.error('Error loading config, using fallback:', error);
                // Fallback products
                PRODUCTS = {
                    'climate-bundle': { 
                        id: 'climate-bundle',
                        name: 'Climate Reporting Bundle', 
                        price: 6500,
                        revolutLink: 'https://checkout.revolut.com/pay/065b9efd-5fd1-43aa-bfb9-869c41c2b01f'
                    }
                };
            }
        }

        function loadProduct() {
            // Get product from URL or session
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('product');
            
            // Try session storage first (includes revolutLink from store page)
            const storedProduct = sessionStorage.getItem('checkout_product');
            
            if (storedProduct) {
                currentProduct = JSON.parse(storedProduct);
                // Merge with config data for latest prices
                if (PRODUCTS[currentProduct.id]) {
                    currentProduct.price = PRODUCTS[currentProduct.id].price;
                    currentProduct.revolutLink = PRODUCTS[currentProduct.id].revolutLink;
                }
            } else if (productId && PRODUCTS[productId]) {
                const configProduct = PRODUCTS[productId];
                currentProduct = {
                    id: productId,
                    name: configProduct.name,
                    price: configProduct.price,
                    currency: configProduct.currency || 'EUR',
                    revolutLink: configProduct.revolutLink
                };
            } else {
                // No product selected
                showError('No product selected. Please go back to the store.');
                document.getElementById('payButton').disabled = true;
                return;
            }

            // Update UI with prices from config
            const formattedPrice = new Intl.NumberFormat('en-IE', {
                style: 'currency',
                currency: currentProduct.currency || 'EUR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }).format(currentProduct.price);
            
            document.getElementById('productName').textContent = currentProduct.name;
            document.getElementById('productPrice').textContent = formattedPrice;
            document.getElementById('totalPrice').textContent = formattedPrice;
            document.getElementById('payButton').textContent = `Pay ${formattedPrice} Now`;
        }

        function selectPayment(provider) {
            selectedPayment = provider;
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelector(`[data-provider="${provider}"]`).classList.add('selected');
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        function validateForm() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const country = document.getElementById('country').value;

            if (!firstName || !lastName) {
                showError('Please enter your full name.');
                return false;
            }

            if (!email || !email.includes('@')) {
                showError('Please enter a valid email address.');
                return false;
            }

            if (!country) {
                showError('Please select your country.');
                return false;
            }

            return { firstName, lastName, email, country, company: document.getElementById('company').value.trim() };
        }

        async function processPayment() {
            hideError();
            
            const customerData = validateForm();
            if (!customerData) return;

            const btn = document.getElementById('payButton');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Processing...';

            try {
                // Store order info for tracking
                const orderData = {
                    product: currentProduct,
                    customer: customerData,
                    paymentMethod: selectedPayment,
                    timestamp: new Date().toISOString(),
                    orderId: 'ORD-' + Date.now()
                };
                sessionStorage.setItem('pending_order', JSON.stringify(orderData));

                // Try API first, fallback to direct payment links
                try {
                    const response = await fetch(`${API_BASE}/checkout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            product_id: currentProduct.id,
                            product_name: currentProduct.name,
                            amount: currentProduct.price,
                            currency: 'EUR',
                            customer_email: customerData.email,
                            customer_name: `${customerData.firstName} ${customerData.lastName}`,
                            company: customerData.company,
                            country: customerData.country,
                            payment_provider: selectedPayment
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        // Validate payment URL is from trusted domains
                        const paymentUrl = data.payment_url;
                        if (isValidPaymentUrl(paymentUrl)) {
                            safeRedirect(paymentUrl);
                            return;
                        } else {
                            console.error('Invalid payment URL received from API');
                        }
                    }
                } catch (apiError) {
                    console.log('API not available, using direct payment links');
                }

                // Fallback: Use direct payment links (hardcoded trusted domains)
                sendOrderNotification(orderData);
                
                if (selectedPayment === 'revolut') {
                    // Check if product has a dedicated Revolut Checkout link (from config or session)
                    if (currentProduct.revolutLink) {
                        // Use pre-configured Revolut Checkout link (professional checkout)
                        safeRedirect(currentProduct.revolutLink);
                    } else {
                        // Fallback to Revolut.me link with amount
                        const sanitizedPrice = parseInt(currentProduct.price, 10);
                        if (isNaN(sanitizedPrice) || sanitizedPrice <= 0) {
                            throw new Error('Invalid price');
                        }
                        // Safe: URL constructed from constant + validated integer
                        safeRedirect(`${REVOLUT_FALLBACK_LINK}/${sanitizedPrice}EUR`);
                    }
                } else {
                    // PayPal direct payment - uses hardcoded paypal.com domain
                    const paypalUrl = createPayPalLink(currentProduct.price, currentProduct.name, customerData.email);
                    // Safe: createPayPalLink only uses paypal.com domain
                    safeRedirect(paypalUrl);
                }

            } catch (error) {
                console.error('Payment error:', error);
                showError('Unable to process payment. Please try again or contact support@lifetime.fi');
                btn.disabled = false;
                btn.textContent = `Pay €${currentProduct.price.toLocaleString()} Now`;
            }
        }

        function createPayPalLink(amount, productName, email) {
            // PayPal.me link or PayPal checkout URL
            const baseUrl = 'https://www.paypal.com/cgi-bin/webscr';
            const params = new URLSearchParams({
                cmd: '_xclick',
                business: PAYPAL_EMAIL,
                item_name: productName,
                amount: amount,
                currency_code: 'EUR',
                return: window.location.origin + '/checkout/success/',
                cancel_return: window.location.origin + '/checkout/cancel/',
                email: email
            });
            return `${baseUrl}?${params.toString()}`;
        }

        async function sendOrderNotification(orderData) {
            // Send order notification to backend/email
            try {
                await fetch('https://api.lifetime.fi/v1/orders/notify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
            } catch (e) {
                // Notification failed, but payment continues
                console.log('Order notification queued');
            }

            // No mailto fallback: notifications must use API POST only.
        }
    </script>
</body>
</html>
