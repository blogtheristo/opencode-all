<!doctype html>
<html lang="fi">
  <head>

    <meta property="og:title" content="Varaa aika — Risto Anton Päärni" />
    <meta property="og:description" content="Varaa demo tai konsultaatio" />

    <link rel="stylesheet" href="../shared-assets/nav/ironclad-nav.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
      integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt"

    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding-top: 80px;
      }

      .header {
        text-align: center;
        margin-bottom: 48px;
      }

      .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 12px;
        color: #f1f5f9;
      }

      .header p {
        font-size: 1.125rem;
        color: #cbd5e1;
        max-width: 600px;
        margin: 0 auto;
      }

      .booking-form {
        background: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      }

      .form-section {
        margin-bottom: 32px;
      }

      .form-section:last-child {
        margin-bottom: 0;
      }

      .section-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: #cbd5e1;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.7);
        color: #f1f5f9;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #60a5fa;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .slot-button {
        padding: 10px 12px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.7);
        color: #cbd5e1;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
      }

      .slot-button:hover:not(:disabled) {
        border-color: #60a5fa;
        background: rgba(96, 165, 250, 0.1);
        color: #60a5fa;
      }

      .slot-button.selected {
        background: #2563eb;
        border-color: #2563eb;
        color: #ffffff;
      }

      .slot-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .submit-button {
        width: 100%;
        padding: 14px 24px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 24px;
      }

      .submit-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
      }

      .submit-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .loading {
        display: none;
        text-align: center;
        color: #94a3b8;
        font-size: 0.875rem;
      }

      .loading.show {
        display: block;
      }

      .error-message {
        padding: 12px 16px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 6px;
        color: #fca5a5;
        font-size: 0.875rem;
        margin-bottom: 16px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .success-message {
        padding: 16px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 8px;
        color: #86efac;
        text-align: center;
      }

      .success-message h2 {
        margin-bottom: 8px;
        color: #f1f5f9;
      }

      .grid-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 640px) {
        .grid-2col {
          grid-template-columns: 1fr;
        }

        .header h1 {
          font-size: 1.875rem;
        }

        .booking-form {
          padding: 24px;
        }

        .slot-grid {
          grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        }
      }

      .flatpickr-calendar {
        background: #1e293b !important;
        color: #e2e8f0 !important;
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
      }

      .flatpickr-calendar .flatpickr-day,
      .flatpickr-calendar .flatpickr-day.today {
        background: rgba(15, 23, 42, 0.5) !important;
        color: #cbd5e1 !important;
      }

      .flatpickr-calendar .flatpickr-day:hover {
        background: #2563eb !important;
        color: #ffffff !important;
      }

      .flatpickr-calendar .flatpickr-day.selected {
        background: #2563eb !important;
        border-color: #2563eb !important;
        color: #ffffff !important;
      }

      .flatpickr-calendar .flatpickr-day.disabled {
        opacity: 0.3 !important;
        cursor: not-allowed !important;
      }

      .flatpickr-calendar .flatpickr-monthDropdown-months {
        background: rgba(15, 23, 42, 0.7) !important;
        color: #cbd5e1 !important;
      }

      .flatpickr-calendar .numInputWrapper input {
        background: rgba(15, 23, 42, 0.7) !important;
        color: #cbd5e1 !important;
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
      }

      .required::after {
        content: " *";
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <script src="../shared-assets/nav/ironclad-nav.js"></script>

    <!-- Main Container -->
    <div class="container">
      <div class="header">
        <h1>Varaa aika</h1>
        <p>Valitse palvelu ja sopiva aika. Lähetämme vahvistuksen sähköpostiin.</p>
      </div>

      <div class="booking-form" id="bookingForm">
        <div class="error-message" id="errorMessage"></div>

        <!-- Service Selection -->
        <div class="form-section">
          <h2 class="section-title">📌 Valitse palvelu</h2>
          <div class="form-group">
            <select id="serviceSelect" required>
              <option value="">-- Valitse palvelu --</option>
              <option value="">Ladataan...</option>
            </select>
          </div>
        </div>

        <!-- Date & Time Selection -->
        <div class="form-section">
          <h2 class="section-title">📅 Päivämäärä & kellonaika</h2>

          <div class="form-group">
            <label for="dateInput" class="required">Päivämäärä</label>
            <input type="text" id="dateInput" placeholder="Valitse päivämäärä" required />
          </div>

          <div class="form-group">
            <label for="timeSelect" class="required">Kellonaika</label>
            <select id="timeSelect" required disabled>
              <option value="">-- Valitse aika --</option>
            </select>
          </div>
        </div>

        <!-- Customer Information -->
        <div class="form-section">
          <h2 class="section-title">👤 Yhteystiedot</h2>

          <div class="grid-2col">
            <div class="form-group">
              <label for="nameInput" class="required">Nimi</label>
              <input type="text" id="nameInput" placeholder="Etunimi Sukunimi" required />
            </div>

            <div class="form-group">
              <label for="emailInput" class="required">Sähköposti</label>
              <input type="email" id="emailInput" placeholder="nimi@yritys.fi" required />
            </div>
          </div>

          <div class="grid-2col">
            <div class="form-group">
              <label for="phoneInput" class="required">Puhelinnumero</label>

            <div class="form-group">
              <label for="companyInput">Yritys</label>
              <input type="text" id="companyInput" placeholder="Yrityksen nimi (valinnainen)" />
            </div>

          <div class="form-group">
            <label for="notesInput">Lisätiedot</label>

        <!-- Submit -->
        <button type="button" class="submit-button" id="submitButton" disabled>

      <!-- Success Message (hidden by default) -->
      <div style="display: none" id="successContainer">
        <div class="success-message">
          <h2>✓ Varaus vahvistettu!</h2>
          <p id="successText"></p>
          <p style="margin-top: 16px; color: #94a3b8; font-size: 0.875rem">
            Tarkista sähköpostisi vahvistukselta.
          </p>

    <script
      src="https://cdn.jsdelivr.net/npm/flatpickr"
      integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fi.js"
      integrity="sha384-eq8xYL0aTFBswlBwiDAr1v9CpLFwESm1DaGdosAvYEAgZp1ukboqAhfgyg47ZNbl"
      crossorigin="anonymous"
    ></script>
    <script>
      const API_BASE =
        window.location.origin === "file://"
          ? "http://localhost:3000"
          : "https://dwsiqcontainersjwyssm4e-dws-iq-backend.functions.fnc.fr-par.scw.cloud";
      const SUPABASE_URL = "https://kpucuwwfhuwurdxyjjtz.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwdWN1d3dmaHV3dXJkeHlqanR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3MjQ3MzcsImV4cCI6MjA4MjMwMDczN30.ZrH1ojxa1yYXIebWvsSNGc_iSjhV1LI5jc1c4oghSAM";
      const SUPABASE_HEADERS = {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        "Content-Type": "application/json",
      };

      let services = [];
      let selectedService = null;
      let availableSlots = [];
      const disabledDates = new Set();
      let lastReservationTransport = "backend";

      const elements = {
        form: document.getElementById("bookingForm"),
        serviceSelect: document.getElementById("serviceSelect"),
        dateInput: document.getElementById("dateInput"),
        timeSelect: document.getElementById("timeSelect"),
        nameInput: document.getElementById("nameInput"),
        emailInput: document.getElementById("emailInput"),
        phoneInput: document.getElementById("phoneInput"),
        companyInput: document.getElementById("companyInput"),
        notesInput: document.getElementById("notesInput"),
        submitButton: document.getElementById("submitButton"),
        errorMessage: document.getElementById("errorMessage"),
        loading: document.getElementById("loading"),
        successContainer: document.getElementById("successContainer"),
        successText: document.getElementById("successText"),
      };

      let datePickerInstance;

      // Initialize
      async function init() {
        await loadServices();
        setupEventListeners();
      }

      function extractServiceHint() {
        const raw = new URLSearchParams(window.location.search).get("service");
        return raw ? raw.trim().toLowerCase() : "";
      }

      function resolveServiceByHint(hint) {
        if (!hint) return null;
        if (hint === "demo") {
          return services.find((svc) => svc.name?.toLowerCase().includes("demo")) || null;
        }
        if (hint === "consultation" || hint === "konsultaatio") {
          return (
            services.find((svc) => svc.name?.toLowerCase().includes("konsultaatio")) ||
            services.find((svc) => svc.name?.toLowerCase().includes("consultation")) ||
            null
          );
        }

        return (
          services.find(
            (svc) => svc.id === hint || svc.name?.toLowerCase() === hint || svc.name?.toLowerCase().includes(hint),
          ) || null
        );
      }

      async function applyServicePrefillFromUrl() {
        const hint = extractServiceHint();
        const resolvedService = resolveServiceByHint(hint);
        if (!resolvedService) return;
        elements.serviceSelect.value = resolvedService.id;
        await onServiceChange();
      }

      async function loadServicesFromSupabase() {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/booking_services?select=*&order=created_at.asc`, {
          headers: SUPABASE_HEADERS,
        });
        if (!res.ok) throw new Error("Supabase services fetch failed");
        const data = await res.json();
        return { services: data || [] };
      }

      async function loadAvailabilityFromSupabase(serviceId, startDate, endDate) {
        const [serviceRes, availabilityRes, holidaysRes] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/booking_services?id=eq.${serviceId}&select=duration_minutes&limit=1`, {
            headers: SUPABASE_HEADERS,
          }),
          fetch(
            `${SUPABASE_URL}/rest/v1/booking_availability?service_id=eq.${serviceId}&select=day_of_week,date_override,start_time,end_time,is_available&is_available=eq.true`,
            { headers: SUPABASE_HEADERS },
          ),
          fetch(
            `${SUPABASE_URL}/rest/v1/finnish_holidays?select=date&date=gte.${startDate}&date=lte.${endDate}`,
            { headers: SUPABASE_HEADERS },
          ),
        ]);

        if (!serviceRes.ok || !availabilityRes.ok || !holidaysRes.ok) {
          throw new Error("Supabase availability fetch failed");
        }

        const serviceRows = await serviceRes.json();
        const availabilityRows = await availabilityRes.json();
        const holidayRows = await holidaysRes.json();

        const durationMinutes = serviceRows?.[0]?.duration_minutes || 30;
        const holidays = (holidayRows || []).map((h) => h.date);
        const holidaySet = new Set(holidays);

        const weekly = new Map();
        const overrides = new Map();
        (availabilityRows || []).forEach((row) => {
          if (row.date_override) {
            overrides.set(row.date_override, row);
            return;
          }
          const list = weekly.get(row.day_of_week) || [];
          list.push(row);
          weekly.set(row.day_of_week, list);
        });

        const availability = {};
        for (let d = new Date(`${startDate}T00:00:00.000Z`); d <= new Date(`${endDate}T23:59:59.999Z`); ) {
          const dateStr = d.toISOString().split("T")[0];
          const dayOfWeek = d.getUTCDay();
          const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
          const schedule = overrides.get(dateStr) || (weekly.get(dayOfWeek) || [])[0];
          if (schedule && !isWeekend && !holidaySet.has(dateStr)) {
            const toMinutes = (time) => {
              const [hours, minutes] = time.split(":").map(Number);
              return hours * 60 + minutes;
            };
            const toTimeString = (minutes) =>
              `${Math.floor(minutes / 60).toString().padStart(2, "0")}:${(minutes % 60).toString().padStart(2, "0")}`;

            const slots = [];
            let current = toMinutes(schedule.start_time);
            const endMinutes = toMinutes(schedule.end_time);
            while (current + durationMinutes <= endMinutes) {
              const timeStr = toTimeString(current);
              const slotStart = new Date(`${dateStr}T${timeStr}:00.000Z`);
              const slotEnd = new Date(slotStart.getTime() + durationMinutes * 60 * 1000);
              slots.push(timeStr);
              current += 30;
            }
            if (slots.length > 0) availability[dateStr] = slots;
          }
          d.setUTCDate(d.getUTCDate() + 1);
        }

        return { availability, holidays };
      }

      async function reserveWithSupabase(payload) {
        const serviceRes = await fetch(
          `${SUPABASE_URL}/rest/v1/booking_services?id=eq.${payload.serviceId}&select=name,duration_minutes&limit=1`,
          { headers: SUPABASE_HEADERS },
        );
        if (!serviceRes.ok) throw new Error("Supabase service lookup failed");
        const serviceRows = await serviceRes.json();
        if (!serviceRows || serviceRows.length === 0) throw new Error("Service not found");
        const durationMinutes = serviceRows[0].duration_minutes;

        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/booking_reservations`, {
          method: "POST",
          headers: { ...SUPABASE_HEADERS, Prefer: "return=representation" },
          body: JSON.stringify([
            {
              service_id: payload.serviceId,
              customer_name: payload.customerName,
              customer_email: payload.customerEmail,
              customer_phone: payload.customerPhone,
              customer_company: payload.customerCompany || null,
              customer_notes: payload.customerNotes || null,
              reserved_at: payload.reservedAt,
              duration_minutes: durationMinutes,
              status: "confirmed",
            },
          ]),
        });
        if (!insertRes.ok) throw new Error("Supabase reservation insert failed");
        const rows = await insertRes.json();
        return { reservationId: rows?.[0]?.id };
      }

      async function loadServices() {
        try {
          let data;
          try {
            const res = await fetch(`${API_BASE}/api/v1/booking/services`);
            const contentType = res.headers.get("content-type") || "";
            const bodyText = await res.text();
            if (!res.ok) throw new Error(`Backend returned ${res.status}`);
            if (!contentType.includes("application/json")) {
              const preview = bodyText.slice(0, 80).replace(/\s+/g, " ").trim();
              throw new Error(`Backend returned non-JSON. Preview: ${preview}`);
            }
            data = JSON.parse(bodyText);
          } catch {
            data = await loadServicesFromSupabase();
          }
          services = data.services || [];

          // Populate select
          elements.serviceSelect.innerHTML = '<option value="">-- Valitse palvelu --</option>';
          services.forEach((svc) => {
            const option = document.createElement("option");
            option.value = svc.id;
            option.textContent = `${svc.name} (${svc.duration_minutes} min)`;
            elements.serviceSelect.appendChild(option);
          });
          await applyServicePrefillFromUrl();
        } catch (err) {
          showError(err instanceof Error ? err.message : "Palveluiden lataaminen epäonnistui");
          console.error(err);
        }
      }

      function setupEventListeners() {
        elements.serviceSelect.addEventListener("change", onServiceChange);
        elements.dateInput.addEventListener("change", onDateChange);
        elements.timeSelect.addEventListener("change", onTimeChange);
        elements.submitButton.addEventListener("click", onSubmit);

        // Validate form on input
        [
          elements.nameInput,
          elements.emailInput,
          elements.phoneInput,
          elements.dateInput,
          elements.timeSelect,
        ].forEach((el) => {
          el.addEventListener("change", validateForm);
          el.addEventListener("input", validateForm);
        });
      }

      async function onServiceChange() {
        const serviceId = elements.serviceSelect.value;
        if (!serviceId) {
          elements.dateInput.value = "";
          elements.timeSelect.innerHTML = '<option value="">-- Valitse aika --</option>';
          elements.timeSelect.disabled = true;
          validateForm();
          return;
        }

        selectedService = services.find((s) => s.id === serviceId);
        elements.dateInput.value = "";
        elements.timeSelect.innerHTML = '<option value="">-- Valitse aika --</option>';
        elements.timeSelect.disabled = true;

        await loadAvailability(serviceId);
        validateForm();
      }

      async function loadAvailability(serviceId) {
        try {
          const today = new Date();
          const startDate = today.toISOString().split("T")[0];
          const endDate = new Date(today.getTime() + 60 * 24 * 60 * 60 * 1000)
            .toISOString()
            .split("T")[0];

          let data;
          try {
            const res = await fetch(
              `${API_BASE}/api/v1/booking/availability/${serviceId}?startDate=${startDate}&endDate=${endDate}`,
            );
            if (!res.ok) throw new Error("Backend availability failed");
            data = await res.json();
          } catch {
            data = await loadAvailabilityFromSupabase(serviceId, startDate, endDate);
          }

          availableSlots = data.availability || {};
          disabledDates.clear();

          // Disable holidays
          if (data.holidays) {
            data.holidays.forEach((h) => disabledDates.add(h));
          }

          // Disable dates with no available slots
          const allDates = new Set(Object.keys(availableSlots));
          for (let d = new Date(startDate); d <= new Date(endDate); d.setDate(d.getDate() + 1)) {
            const dateStr = d.toISOString().split("T")[0];
            const dayOfWeek = d.getUTCDay();
            // Disable Sundays (0) and Saturdays (6), plus holidays
            if (
              dayOfWeek === 0 ||
              dayOfWeek === 6 ||
              (disabledDates.has(dateStr) && !allDates.has(dateStr))
            ) {
              disabledDates.add(dateStr);
            }
          }

          // Init/update date picker
          if (datePickerInstance) {
            datePickerInstance.destroy();
          }

          datePickerInstance = flatpickr("#dateInput", {
            locale: "fi",
            minDate: today,
            maxDate: new Date(today.getTime() + 60 * 24 * 60 * 60 * 1000),
            disable: Array.from(disabledDates),
            disableMobile: true,
            onChange: onDateChange,
          });
        } catch (err) {
          showError("Saatavuuden lataaminen epäonnistui");
          console.error(err);
        }
      }

      function onDateChange() {
        const dateStr = elements.dateInput.value;
        const slots = availableSlots[dateStr] || [];

        elements.timeSelect.innerHTML = '<option value="">-- Valitse aika --</option>';
        slots.forEach((time) => {
          const option = document.createElement("option");
          option.value = time;
          option.textContent = time;
          elements.timeSelect.appendChild(option);
        });

        elements.timeSelect.disabled = slots.length === 0;
        validateForm();
      }

      function onTimeChange() {
        validateForm();
      }

      function validateForm() {
        const isValid =
          elements.serviceSelect.value &&
          elements.dateInput.value &&
          elements.timeSelect.value &&
          elements.nameInput.value &&
          elements.emailInput.value &&
          elements.phoneInput.value;

        elements.submitButton.disabled = !isValid;
      }

      async function onSubmit() {
        if (!validateEmail(elements.emailInput.value)) {
          showError("Kelpava sähköpostiosoite vaaditaan");
          return;
        }

        const service = services.find((s) => s.id === elements.serviceSelect.value);
        if (!service) {
          showError("Valittu palvelu ei ole saatavilla. Päivitä sivu ja yritä uudelleen.");
          return;
        }
        const dateStr = elements.dateInput.value;
        const timeStr = elements.timeSelect.value;
        const [year, month, day] = dateStr.split("-").map(Number);
        const [hours, minutes] = timeStr.split(":").map(Number);
        const localDateTime = new Date(year, month - 1, day, hours, minutes, 0, 0);
        const dateTimeStr = localDateTime.toISOString();

        const payload = {
          serviceId: elements.serviceSelect.value,
          customerName: elements.nameInput.value,
          customerEmail: elements.emailInput.value,
          customerPhone: elements.phoneInput.value,
          customerCompany: elements.companyInput.value || "",
          customerNotes: elements.notesInput.value || "",
          reservedAt: dateTimeStr,
        };

        elements.loading.classList.add("show");
        elements.submitButton.disabled = true;

        try {
          lastReservationTransport = "backend";
          try {
            const res = await fetch(`${API_BASE}/api/v1/booking/reserve`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Varauksen luominen epäonnistui");
          } catch {
            lastReservationTransport = "supabase-direct";
            await reserveWithSupabase(payload);
          }

          // Success
          hideError();
          elements.form.style.display = "none";
          elements.successContainer.style.display = "block";
          elements.successText.textContent =
            lastReservationTransport === "backend"
              ? `Varaus ${service.name}:lle on vahvistettu. Sähköposti on lähetetty osoitteeseen ${elements.emailInput.value}.`
              : `Varaus ${service.name}:lle on vahvistettu. Tarkistusviesti toimitetaan erikseen osoitteeseen ${elements.emailInput.value}.`;
        } catch (err) {
          showError(err instanceof Error ? err.message : "Tuntematon virhe");
        } finally {
          elements.loading.classList.remove("show");
          elements.submitButton.disabled = false;
        }
      }

      function showError(message) {
        elements.errorMessage.textContent = message;
        elements.errorMessage.classList.add("show");
      }

      function hideError() {
        elements.errorMessage.classList.remove("show");
      }

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      // Start
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
