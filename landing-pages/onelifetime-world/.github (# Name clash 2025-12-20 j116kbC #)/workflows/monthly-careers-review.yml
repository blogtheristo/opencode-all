name: Monthly Careers Page Review & Update

# Runs on the 23rd of every month at 9:00 AM Helsinki time (7:00 UTC)
# This gives one week before month-end for review and updates
on:
  schedule:
    - cron: '0 7 23 * *'  # 9:00 AM EET on the 23rd of each month
  workflow_dispatch:  # Allow manual trigger for testing
    inputs:
      force_update:
        description: 'Force creation of review issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-monthly-review:
    name: Create Monthly Review Issue
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Get current date info
        id: date
        run: |
          echo "current_month=$(date +'%B %Y')" >> $GITHUB_OUTPUT
          echo "current_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "next_month=$(date -d '+1 month' +'%B %Y')" >> $GITHUB_OUTPUT
          echo "deadline=$(date -d '+7 days' +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          
      - name: Create monthly review issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentMonth = '${{ steps.date.outputs.current_month }}';
            const deadline = '${{ steps.date.outputs.deadline }}';
            const nextMonth = '${{ steps.date.outputs.next_month }}';
            
            const issueBody = `
            # 🗓️ Monthly Careers Page Review - ${currentMonth}
            
            **@ristopaarni** - Time for our monthly careers page review!
            
            **⏰ Deadline**: ${deadline} (one week from today)
            
            ---
            
            ## 📋 Review Checklist
            
            Please answer the following questions to keep our careers page up-to-date:
            
            ### 1. Should we update the careers page this month?
            
            - [ ] Yes, we have updates
            - [ ] No, everything is current
            - [ ] Postpone to next month
            
            **Reason/Notes:**
            <!-- Add your notes here -->
            
            ---
            
            ### 2. Current Hiring Situation
            
            **Total headcount as of today:**
            - Current employees: ___
            - Target by end of ${nextMonth}: ___
            
            **Active recruitment:**
            - [ ] Yes, actively hiring
            - [ ] No, hiring paused
            - [ ] Passive recruitment only
            
            **Notes:**
            <!-- Add details about hiring pipeline, timeline, etc. -->
            
            ---
            
            ### 3. Role Status Update
            
            Please update the status of each role:
            
            #### Engineering Roles
            - [ ] **Senior Full-Stack Developer** (Next.js/TypeScript)
              - Status: [Open / Filled / On Hold / Removed]
              - If filled: Name/Start date: ___
              - Notes: ___
              
            - [ ] **Edge Computing Engineer** (NVIDIA Jetson)
              - Status: [Open / Filled / On Hold / Removed]
              - If filled: Name/Start date: ___
              - Notes: ___
              
            - [ ] **AI/ML Engineer** (LLM Integration)
              - Status: [Open / Filled / On Hold / Removed]
              - If filled: Name/Start date: ___
              - Notes: ___
            
            #### Business Roles
            - [ ] **Sales Engineer** (Climate Tech)
              - Status: [Open / Filled / On Hold / Removed]
              - If filled: Name/Start date: ___
              - Notes: ___
              
            - [ ] **Customer Success Manager**
              - Status: [Open / Filled / On Hold / Removed]
              - If filled: Name/Start date: ___
              - Notes: ___
            
            #### New Roles (if any)
            <!-- Add any new positions we're opening -->
            
            ---
            
            ### 4. Legal & Compliance Updates
            
            **Code of Conduct:**
            - [ ] No changes needed
            - [ ] Minor updates required
            - [ ] Major revision required
            
            **Changes needed (if any):**
            <!-- Describe what needs to be updated and why -->
            
            **GDPR/Employment Law:**
            - [ ] All compliant, no changes
            - [ ] Updates needed
            
            **Changes:**
            <!-- Add details -->
            
            **Legal review status:**
            - Last review date: ___
            - Next scheduled review: ___
            - [ ] Schedule legal review for Q${Math.ceil((new Date().getMonth() + 1) / 3)}
            
            ---
            
            ### 5. Marketing & Messaging Updates
            
            **Company positioning:**
            - [ ] No changes
            - [ ] Update mission statement
            - [ ] Update value proposition
            - [ ] Update technical capabilities
            
            **Changes needed:**
            <!-- Describe updates to company messaging -->
            
            **Recent achievements to highlight:**
            <!-- E.g., new customers, funding, partnerships, awards -->
            - 
            - 
            
            **Metrics updates:**
            - Platform performance: ___
            - Customer count: ___
            - Key wins this month: ___
            
            **Competitor changes:**
            <!-- Any competitive landscape updates that affect our positioning? -->
            
            ---
            
            ### 6. Benefits & Compensation Updates
            
            **Salary ranges:**
            - [ ] Current ranges are competitive
            - [ ] Need to adjust (market changes)
            
            **Benefits updates:**
            - [ ] No changes
            - [ ] Update benefits package
            
            **Changes:**
            <!-- Details on any benefit/compensation updates -->
            
            ---
            
            ### 7. Technical Stack Updates
            
            **Infrastructure changes affecting job descriptions:**
            - [ ] No changes
            - [ ] Update tech stack in job posts
            
            **Changes:**
            <!-- E.g., new tools, platforms, frameworks we're now using -->
            
            ---
            
            ### 8. Culture & Work Environment
            
            **Remote work policy:**
            - [ ] No changes
            - [ ] Update policy
            
            **Office/workspace:**
            - [ ] No changes
            - [ ] New office/changes to mention
            
            **Team size/structure:**
            - Current team size: ___
            - Recent organizational changes: ___
            
            ---
            
            ### 9. Action Items
            
            Based on your answers above, what needs to be done:
            
            - [ ] Update Code of Conduct (v${process.env.CURRENT_VERSION || '1.0.0'} → v___)
            - [ ] Update job descriptions
            - [ ] Add new job postings
            - [ ] Remove filled positions
            - [ ] Update company description
            - [ ] Update benefits section
            - [ ] Update tech stack
            - [ ] Schedule legal review
            - [ ] Update metrics/achievements
            - [ ] Other: ___
            
            ---
            
            ### 10. Deployment Checklist (After Review Complete)
            
            - [ ] All questions answered above
            - [ ] Code of Conduct updated (if needed)
            - [ ] Careers page content updated
            - [ ] Changes reviewed locally (npm run dev)
            - [ ] Build successful (npm run build)
            - [ ] Ready to deploy via Git push
            
            ---
            
            ## 📊 Previous Month Metrics (For Reference)
            
            **Last update:** <!-- Will be auto-filled from previous issue -->
            **Roles filled last month:** <!-- Will be auto-filled -->
            **Page views:** Check [Cloudflare Analytics](https://dash.cloudflare.com/)
            **Applications received:** ___
            
            ---
            
            ## 🚀 Deployment Instructions
            
            Once you've completed this review and made necessary updates:
            
            \`\`\`bash
            # 1. Update Code of Conduct (if needed)
            # Edit: code-of-conduct.md
            
            # 2. Update careers page content
            # Edit: app/careers/page.tsx
            
            # 3. Test locally
            npm run dev
            # Visit: http://localhost:3000/careers
            
            # 4. Build for production
            npm run build
            
            # 5. Commit and deploy
            git add .
            git commit -m "feat(careers): monthly update - ${currentMonth}"
            git push origin main
            
            # Cloudflare auto-deploys in 2-3 minutes ✅
            \`\`\`
            
            ---
            
            ## 📝 Notes & Reminders
            
            - **Response deadline**: ${deadline}
            - **Quarterly legal review**: Check if due this month
            - **Annual items**: Check if any annual updates are due
            - **Archive this issue**: After deployment, close this issue
            
            ---
            
            **Auto-generated by [Monthly Careers Review Workflow](.github/workflows/monthly-careers-review.yml)**
            `;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: \`📅 Monthly Careers Review - \${currentMonth}\`,
              body: issueBody,
              labels: ['careers', 'monthly-review', 'risto-action-required'],
              assignees: ['ristopaarni']  // Assign to Risto
            });
            
            console.log(\`Created issue #\${issue.data.number}\`);
            return issue.data.number;
            
      - name: Send notification
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = ${{ steps.create_issue.outputs.result }};
            console.log(`✅ Monthly review issue #${issueNumber} created successfully`);
            console.log(`📧 Notification sent to Risto`);

  # Optional: Send Slack notification (if you use Slack)
  notify-slack:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    needs: create-monthly-review
    if: ${{ vars.SLACK_WEBHOOK_URL != '' }}
    
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "📅 Monthly Careers Review Required",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🗓️ Monthly Careers Page Review"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Hi Risto!* Time for our monthly careers page review.\n\n⏰ *Deadline:* ${{ steps.date.outputs.deadline }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Action Required:*\n• Review hiring status\n• Update role statuses\n• Check legal compliance\n• Update marketing content"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "📝 Open Review Issue"
                      },
                      "url": "https://github.com/${{ github.repository }}/issues/${{ needs.create-monthly-review.outputs.issue_number }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # Optional: Send email notification (if configured)
  notify-email:
    name: Send Email Notification
    runs-on: ubuntu-latest
    needs: create-monthly-review
    if: ${{ secrets.SENDGRID_API_KEY != '' }}
    
    steps:
      - name: Send email via SendGrid
        uses: actions/github-script@v7
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: 'risto@lifetime.fi'
        with:
          script: |
            const sgMail = require('@sendgrid/mail');
            sgMail.setApiKey(process.env.SENDGRID_API_KEY);
            
            const msg = {
              to: process.env.TO_EMAIL,
              from: 'noreply@lifetime.fi',
              subject: '📅 Monthly Careers Review - Action Required',
              html: \`
                <h2>🗓️ Monthly Careers Page Review</h2>
                <p>Hi Risto,</p>
                <p>It's time for our monthly careers page review. Please complete the review by <strong>\${{ steps.date.outputs.deadline }}</strong>.</p>
                
                <h3>Action Items:</h3>
                <ul>
                  <li>Review current hiring status</li>
                  <li>Update role statuses (filled/open/on-hold)</li>
                  <li>Check for legal/compliance updates</li>
                  <li>Update marketing content and achievements</li>
                </ul>
                
                <p><a href="https://github.com/\${{ github.repository }}/issues/\${{ needs.create-monthly-review.outputs.issue_number }}" style="display: inline-block; padding: 10px 20px; background-color: #0366d6; color: white; text-decoration: none; border-radius: 5px;">📝 Open Review Issue</a></p>
                
                <p>This is an automated reminder from your GitHub Actions workflow.</p>
              \`
            };
            
            await sgMail.send(msg);
            console.log('✅ Email sent successfully');

# Separate workflow that runs when review issue is closed
---
name: Deploy Careers Page Updates

on:
  issues:
    types: [closed]

jobs:
  check-and-deploy:
    name: Check if Monthly Review and Deploy
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'monthly-review')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Parse issue for updates needed
        id: parse_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            
            // Check if Code of Conduct update is needed
            const needsCodeUpdate = issueBody.includes('[x] Update Code of Conduct') || 
                                    issueBody.includes('[X] Update Code of Conduct');
            
            // Check if any updates are marked as needed
            const needsUpdate = issueBody.includes('[x] Yes, we have updates') ||
                               issueBody.includes('[X] Yes, we have updates');
            
            console.log(\`Needs update: \${needsUpdate}\`);
            console.log(\`Needs Code of Conduct update: \${needsCodeUpdate}\`);
            
            core.setOutput('needs_update', needsUpdate);
            core.setOutput('needs_code_update', needsCodeUpdate);
            
            return { needsUpdate, needsCodeUpdate };
      
      - name: Add deployment instructions comment
        if: steps.parse_issue.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = \`
            ## 🚀 Ready to Deploy Updates
            
            Based on your review, updates are needed. Here's what to do next:
            
            ### Step 1: Make Updates Locally
            
            \\\`\\\`\\\`bash
            # Clone/pull latest
            cd ~/projects/onelifetime-world
            git checkout main
            git pull origin main
            
            # Create update branch
            git checkout -b monthly-update-\${new Date().toISOString().slice(0, 7)}
            
            # Make your updates:
            # - Edit code-of-conduct.md (if needed)
            # - Edit app/careers/page.tsx
            # - Update job descriptions
            # - Update company info
            \\\`\\\`\\\`
            
            ### Step 2: Test Locally
            
            \\\`\\\`\\\`bash
            npm run dev
            # Visit: http://localhost:3000/careers
            # Verify all changes look correct
            \\\`\\\`\\\`
            
            ### Step 3: Build & Deploy
            
            \\\`\\\`\\\`bash
            npm run build  # Must succeed
            
            git add .
            git commit -m "feat(careers): monthly update - \$(date +'%B %Y')"
            git push origin monthly-update-\${new Date().toISOString().slice(0, 7)}
            
            # Create PR or merge to main
            git checkout main
            git merge monthly-update-\${new Date().toISOString().slice(0, 7)}
            git push origin main
            \\\`\\\`\\\`
            
            ### Step 4: Verify Deployment
            
            - Cloudflare deploys in 2-3 minutes
            - Check: https://onelifetime.world/careers
            - Verify all updates are live
            - Close this issue when done ✅
            
            ---
            
            *Auto-generated deployment instructions*
            \`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
      
      - name: Archive review data
        if: steps.parse_issue.outputs.needs_update == 'true'
        run: |
          # Archive this month's review for future reference
          mkdir -p .github/archives
          echo "Archived review from issue #${{ github.event.issue.number }}" >> .github/archives/reviews.log
          echo "Date: $(date)" >> .github/archives/reviews.log
          echo "---" >> .github/archives/reviews.log
