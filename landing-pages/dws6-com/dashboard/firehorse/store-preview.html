<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifetime Firehorse™ Store - 9 Firehorse Products | DWS IQ</title>
    <!--
      HIC 27.09.2026 (product-readiness-portfolio, tranche 2 part B):
      "Replace/upgrade dws6.com/dashboard/firehorse/store-preview.html ... so it dynamically
      renders the 9 Chapter 5 products from the canonical dws10.com products JSON, with current
      prices/descriptions/features, direct checkout CTA and details CTA. Remove stale hardcoded
      8-product/legacy content and malformed duplicate closing markup. Preserve accessibility and
      avoid unsafe innerHTML (escape strings)."

      Data source: dws6.com/dashboard/firehorse/firehorse-chapter5-products.json — a generated,
      same-origin mirror of the 9 Firehorse (Chapter 5) products from
      dws10.com/config/products.json, produced by
      scripts/truth/generate-firehorse-store-preview-data.mjs (dws6.com and dws10.com are
      different origins with no confirmed CORS allowance, so this page cannot fetch
      dws10.com/config/products.json directly). Re-run that generator after any catalogue change
      to this page's 9 products; never hand-edit the JSON.
    -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .status-note {
            text-align: center;
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            gap: 12px;
        }

        .product-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #10b981;
            white-space: nowrap;
        }

        .product-label {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }

        .product-description {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .features {
            margin-bottom: 20px;
        }

        .feature-item {
            display: inline-block;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            margin: 4px 4px 4px 0;
            font-size: 0.8rem;
            color: #475569;
        }

        .delivery-note {
            font-size: 0.78rem;
            color: #64748b;
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cta-button {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            text-align: center;
        }

        .cta-button:hover,
        .cta-button:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .details-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
        }

        .details-button:hover,
        .details-button:focus-visible {
            background: #667eea;
            color: white;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        .footer a {
            color: white;
        }

        .category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .load-error {
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.25);
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .load-error a {
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-fire" aria-hidden="true"></i> Lifetime Firehorse™ Store</h1>
            <p>9 Firehorse applications for compliance automation, omnichannel marketing, reporting and data services</p>
        </div>
        <p class="status-note" id="statusNote">Loading current prices and availability from the canonical catalogue…</p>

        <div class="products-grid" id="productsGrid" aria-live="polite"></div>

        <div class="footer">
            <p>&copy; 2026 Firehorse by DWS IQ 6 | Lifetime Oy | All Rights Reserved</p>
            <p style="margin-top: 10px;">
                <a href="https://dws10.com"><i class="fas fa-globe" aria-hidden="true"></i> Visit DWS IQ Platform</a>
            </p>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var DATA_URL = 'firehorse-chapter5-products.json';
            var grid = document.getElementById('productsGrid');
            var statusNote = document.getElementById('statusNote');

            function escapeHtml(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function formatPrice(price, currency) {
                if (typeof price !== 'number') return '—';
                var symbol = { EUR: '€', USD: '$', GBP: '£' }[currency] || (currency ? currency + ' ' : '€');
                if (price === 0) return 'Free';
                try {
                    return symbol + new Intl.NumberFormat('en-IE', { maximumFractionDigits: 0 }).format(price);
                } catch (e) {
                    return symbol + price;
                }
            }

            // Builds the card using DOM APIs and textContent for every dynamic value — never
            // interpolates catalogue strings into innerHTML, so no field in products.json can
            // inject markup even if it later contains a stray "<" or "&".
            function buildCard(p) {
                var card = document.createElement('div');
                card.className = 'product-card';

                var category = document.createElement('div');
                category.className = 'category';
                category.textContent = p.storeCategory || 'Firehorse';
                card.appendChild(category);

                var headerRow = document.createElement('div');
                headerRow.className = 'product-header';

                var titleWrap = document.createElement('div');
                var title = document.createElement('div');
                title.className = 'product-title';
                title.textContent = p.name || p.id;
                titleWrap.appendChild(title);
                if (p.caption) {
                    var label = document.createElement('div');
                    label.className = 'product-label';
                    label.textContent = p.caption;
                    titleWrap.appendChild(label);
                }
                headerRow.appendChild(titleWrap);

                var priceWrap = document.createElement('div');
                priceWrap.style.textAlign = 'right';
                var price = document.createElement('div');
                price.className = 'product-price';
                price.textContent = formatPrice(p.price, p.currency);
                priceWrap.appendChild(price);
                if (p.priceNote) {
                    var priceLabel = document.createElement('div');
                    priceLabel.className = 'product-label';
                    priceLabel.textContent = p.priceNote;
                    priceWrap.appendChild(priceLabel);
                }
                headerRow.appendChild(priceWrap);
                card.appendChild(headerRow);

                if (p.description) {
                    var desc = document.createElement('div');
                    desc.className = 'product-description';
                    desc.textContent = p.description;
                    card.appendChild(desc);
                }

                if (Array.isArray(p.features) && p.features.length) {
                    var features = document.createElement('div');
                    features.className = 'features';
                    p.features.slice(0, 4).forEach(function (f) {
                        var chip = document.createElement('span');
                        chip.className = 'feature-item';
                        chip.textContent = f;
                        features.appendChild(chip);
                    });
                    card.appendChild(features);
                }

                if (p.fulfilment && (p.fulfilment.owner || p.fulfilment.acknowledgementSla)) {
                    var note = document.createElement('div');
                    note.className = 'delivery-note';
                    var bits = [];
                    if (p.fulfilment.owner) bits.push('Delivered by ' + p.fulfilment.owner);
                    if (p.fulfilment.acknowledgementSla) bits.push('acknowledged within ' + p.fulfilment.acknowledgementSla);
                    note.textContent = bits.join(', ') + '.';
                    card.appendChild(note);
                }

                var actions = document.createElement('div');
                actions.className = 'card-actions';

                if (p.checkoutUrl) {
                    var buyLink = document.createElement('a');
                    buyLink.className = 'cta-button';
                    buyLink.href = p.checkoutUrl;
                    buyLink.textContent = 'Buy now';
                    var buyIcon = document.createElement('i');
                    buyIcon.className = 'fas fa-arrow-right';
                    buyIcon.setAttribute('aria-hidden', 'true');
                    buyIcon.style.marginLeft = '8px';
                    buyLink.appendChild(buyIcon);
                    actions.appendChild(buyLink);
                }

                if (p.detailsUrl) {
                    var detailsLink = document.createElement('a');
                    detailsLink.className = 'details-button';
                    detailsLink.href = p.detailsUrl;
                    detailsLink.target = '_blank';
                    detailsLink.rel = 'noopener';
                    detailsLink.textContent = 'View details';
                    actions.appendChild(detailsLink);
                }

                card.appendChild(actions);
                return card;
            }

            function render(data) {
                var products = (data && Array.isArray(data.products)) ? data.products : [];
                grid.textContent = '';
                products.forEach(function (p) {
                    grid.appendChild(buildCard(p));
                });
                statusNote.textContent = products.length + ' Firehorse products \u00b7 catalogue version ' +
                    escapeHtml(data && data.catalogVersion || '—') + ' \u00b7 prices and availability current as of this page load.';
            }

            function renderError() {
                grid.textContent = '';
                var box = document.createElement('div');
                box.className = 'load-error';
                box.textContent = 'Could not load current Firehorse product data. ';
                var link = document.createElement('a');
                link.href = 'https://dws10.com/buy/';
                link.textContent = 'View the live Firehorse store on dws10.com instead.';
                box.appendChild(link);
                grid.appendChild(box);
                statusNote.textContent = '';
            }

            fetch(DATA_URL, { cache: 'no-store' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(render)
                .catch(renderError);
        })();
    </script>
</body>
</html>
