<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily Mission Control</title>
    <meta name="theme-color" content="#0c1222" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c1222;
        --panel: #141c2e;
        --line: #2a3548;
        --text: #e8eef7;
        --muted: #8b9bb4;
        --accent: #7dd3c0;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 18px 40px;
      }
      h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      a.card {
        display: block;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 16px;
        margin-bottom: 12px;
        color: inherit;
        text-decoration: none;
        min-height: 48px;
      }
      a.card:hover {
        border-color: var(--accent);
      }
      a.card strong {
        display: block;
        font-size: 1.05rem;
        margin-bottom: 4px;
      }
      .centre {
        font-size: 0.75rem;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .install {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 24px;
        line-height: 1.4;
      }
      .footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Daily Mission Control</h1>
      <p class="muted" id="authLine">Checking access…</p>
      <div id="list"></div>
      <p class="footer"><a href="../">Open full Mission Control</a></p>
      <p class="install">
        Win11: Edge/Chrome → Install app / pin to taskbar.<br />
        iPhone: Safari → Share → Add to Home Screen.
      </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
      import { getCurrentUser, getSupabaseClient } from "../../../shared/js/supabase-client.js";
      import { handleOAuthCallback } from "../../../shared/js/auth-handler.js";
      import { requireHicAuth, buildQueue, topThree, CENTRES } from "../mission-control.js";

      const user = await requireHicAuth(getCurrentUser, handleOAuthCallback);
      if (!user) throw new Error("auth");
      document.getElementById("authLine").textContent = `${user.email} · today’s top 3`;

      const queue = await buildQueue(getSupabaseClient());
      const top = topThree(queue);
      const list = document.getElementById("list");
      if (!top.length) {
        list.innerHTML = `<p class="muted">No open missions — <a href="../" style="color:var(--accent)">open full Mission Control</a></p>`;
      } else {
        list.innerHTML = top
          .map((item, i) => {
            const c = CENTRES[item.centre];
            const href = `../?centre=${encodeURIComponent(item.centre)}&id=${encodeURIComponent(item.id)}`;
            return `<a class="card" href="${href}">
          <div class="centre">${i + 1}. ${c?.label || item.centre}</div>
          <strong>${item.title.replace(/</g, "&lt;")}</strong>
          <span class="muted">${(item.nextAction || "").replace(/</g, "&lt;")}</span>
        </a>`;
          })
          .join("");
      }
    </script>
  </body>
</html>
