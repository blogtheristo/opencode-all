<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DWS6 Platform</title>
    <meta name="description" content="Sign in to DWS6 Platform - Access your dashboards, reports, and enterprise services.">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           DWS6 GAMMA ENTERPRISE DESIGN SYSTEM
           User Login - Clean & Simple
           ============================================ */

        :root {
            --color-primary: #0a1628;
            --color-primary-light: #152238;
            --color-accent: #0066cc;
            --color-accent-hover: #0052a3;
            --color-success: #0d7a3e;
            --color-warning: #b45309;
            --color-danger: #dc2626;
            
            --color-white: #ffffff;
            --color-gray-50: #f8fafc;
            --color-gray-100: #f1f5f9;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e1;
            --color-gray-400: #94a3b8;
            --color-gray-500: #64748b;
            --color-gray-600: #475569;
            --color-gray-700: #334155;
            --color-gray-800: #1e293b;
            --color-gray-900: #0f172a;
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--color-primary) 0%, #0d2847 50%, var(--color-primary) 100%);
            color: var(--color-gray-100);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
        }

        /* === LOGIN CONTAINER === */
        .login-container {
            width: 100%;
            max-width: 420px;
        }

        /* === HEADER === */
        .login-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .logo-img {
            height: 48px;
            width: auto;
        }

        .logo-text {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--color-white);
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: var(--color-gray-400);
        }

        /* === LOGIN CARD === */
        .login-card {
            background: var(--color-primary-light);
            border: 1px solid rgba(0, 102, 204, 0.2);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 102, 204, 0.05);
        }

        /* === MESSAGES === */
        .message {
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
            font-size: 0.875rem;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        /* === FORM === */
        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-gray-300);
            margin-bottom: var(--space-2);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--color-gray-700);
            border-radius: var(--radius-md);
            color: var(--color-white);
            font-size: 1rem;
            font-family: inherit;
            transition: all var(--transition-fast);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-input::placeholder {
            color: var(--color-gray-500);
        }

        /* === BUTTONS === */
        .btn {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-hover));
            color: var(--color-white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 204, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* === DIVIDER === */
        .divider {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin: var(--space-6) 0;
            color: var(--color-gray-500);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-gray-700);
        }

        /* === SOCIAL BUTTONS === */
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .btn-social {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--color-gray-700);
            border-radius: var(--radius-md);
            background: rgba(15, 23, 42, 0.3);
            color: var(--color-white);
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
        }

        .btn-social:hover {
            background: rgba(15, 23, 42, 0.5);
            border-color: var(--color-gray-600);
        }

        .btn-social.google:hover {
            border-color: #4285F4;
            background: rgba(66, 133, 244, 0.1);
        }

        .btn-social.microsoft:hover {
            border-color: #00A4EF;
            background: rgba(0, 164, 239, 0.1);
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        /* === LINKS === */
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: var(--space-6);
            font-size: 0.875rem;
        }

        .links a {
            color: var(--color-gray-400);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .links a:hover {
            color: var(--color-accent);
        }

        /* === FOOTER === */
        .login-footer {
            margin-top: var(--space-8);
            text-align: center;
        }

        .footer-text {
            font-size: 0.75rem;
            color: var(--color-gray-500);
            margin-bottom: var(--space-3);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: var(--space-4);
            font-size: 0.75rem;
        }

        .footer-links a {
            color: var(--color-gray-500);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .footer-links a:hover {
            color: var(--color-accent);
        }

        .admin-link {
            margin-top: var(--space-4);
            padding-top: var(--space-4);
            border-top: 1px solid var(--color-gray-800);
        }

        .admin-link a {
            font-size: 0.75rem;
            color: var(--color-gray-500);
            text-decoration: none;
        }

        .admin-link a:hover {
            color: var(--color-danger);
        }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            .login-card {
                padding: var(--space-6);
            }

            .links {
                flex-direction: column;
                gap: var(--space-2);
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="logo">
                <img src="https://dws10.com/DWS_IQ2026.png" alt="DWS IQ" class="logo-img">
                <span class="logo-text">DWS6</span>
            </div>
            <p class="login-subtitle">Sign in to access your dashboard</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <!-- Messages -->
            <div class="message error" id="errorMessage"></div>
            <div class="message success" id="successMessage"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">or continue with</div>

            <!-- Social Login Buttons -->
            <div class="social-buttons">
                <button type="button" class="btn-social google" onclick="handleGoogleLogin()">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google Workspace
                </button>

                <button type="button" class="btn-social microsoft" onclick="handleMicrosoftLogin()">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
                        <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
                        <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
                        <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
                    </svg>
                    Microsoft 365
                </button>
            </div>

            <!-- Links -->
            <div class="links">
                <a href="/forgot-password/">Forgot password?</a>
                <a href="/register/">Create account</a>
            </div>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <p class="footer-text">
                © 2025 Lifetime Oy · Secure authentication powered by Supabase
            </p>
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="/privacy-policy/">Privacy</a>
                <a href="/terms/">Terms</a>
            </div>
            <div class="admin-link">
                <a href="/admin/login/">🔐 Administrator Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getSupabaseClient } from '../shared/js/supabase-client.js';
        import { login, loginWithGoogle, showError, showSuccess, setButtonLoading } from '../shared/js/auth-handler.js';
        import { handlePostLoginRedirect } from '../shared/js/role-router.js';

        const params = new URLSearchParams(window.location.search);
        const ROLE = params.get('role') || 'dws_iq_standard';

        // Initialize Supabase
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🔐 DWS6 Login - Initializing Supabase...');
            getSupabaseClient();
        });

        // Standard Login Handler
        window.handleLogin = async function(event) {
            event.preventDefault();

            const email = document.getElementById('email')?.value || '';
            const password = document.getElementById('password')?.value || '';
            const loginBtn = document.querySelector('.btn-primary');

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            setButtonLoading(loginBtn, true, 'Signing in...');

            try {
                const result = await login(email, password, ROLE);

                if (result.success) {
                    if (result.requiresMfa) {
                        showSuccess('✅ Credentials verified. Redirecting to MFA...');
                        setTimeout(() => {
                            window.location.href = '/mfa-verify/index.html';
                        }, 1000);
                        return;
                    }
                    
                    showSuccess('✅ Login successful! Redirecting...');
                    setTimeout(() => handlePostLoginRedirect(), 1000);
                } else {
                    showError(result.error || 'Login failed. Please check your credentials.');
                    setButtonLoading(loginBtn, false, 'Sign In');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('An error occurred. Please try again.');
                setButtonLoading(loginBtn, false, 'Sign In');
            }
        };

        // Google OAuth Login
        window.handleGoogleLogin = async function() {
            const btn = document.querySelector('.btn-social.google');
            setButtonLoading(btn, true, 'Redirecting...');

            try {
                const result = await loginWithGoogle(ROLE);
                if (!result.success) {
                    showError(result.error || 'Google login failed');
                    setButtonLoading(btn, false, 'Google Workspace');
                }
            } catch (error) {
                console.error('Google login error:', error);
                showError('Google login failed. Please try again.');
                setButtonLoading(btn, false, 'Google Workspace');
            }
        };

        // Microsoft OAuth Login (placeholder)
        window.handleMicrosoftLogin = async function() {
            showSuccess('🔐 Microsoft 365 login coming soon. Please use email/password or Google.');
        };
    </script>
</body>
</html>
