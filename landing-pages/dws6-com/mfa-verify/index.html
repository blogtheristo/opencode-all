<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Verification | DWS IQ 6</title>
    <link rel="stylesheet" href="../shared/css/auth-styles.css">
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
    <style>
        .code-input {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: center;
            margin: var(--spacing-xl) 0;
        }
        .code-input input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 600;
            padding: 0;
            border-radius: var(--radius-md);
        }
        .code-input input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }
        .backup-link {
            text-align: center;
            margin-top: var(--spacing-lg);
        }
        .backup-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .backup-link a:hover {
            text-decoration: underline;
        }
        .backup-form {
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-lg);
            border-top: 1px solid rgba(148, 163, 184, 0.2);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-section">
                <img src="https://dws10.com/DWS_IQ2026.png" alt="DWS IQ">
                <h1>DWS IQ 6</h1>
            </div>

            <h2 class="page-title">Two-Factor Verification</h2>
            <p class="page-subtitle" id="subtitle">Enter the 6-digit code from your authenticator app</p>

            <div class="security-badge">
                <strong>Additional Security Step</strong>
                Your account is protected with two-factor authentication
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- TOTP Code Entry -->
            <div id="totpSection">
                <div class="code-input" id="codeInput">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" autofocus>
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="cancelVerification()">Cancel</button>
                    <button class="btn btn-primary" id="verifyBtn" onclick="verifyCode()">Verify</button>
                </div>

                <div class="backup-link">
                    <a href="#" onclick="showBackupForm(event)">Use a backup code instead</a>
                </div>
            </div>

            <!-- Backup Code Entry -->
            <div id="backupSection" class="hidden">
                <div class="backup-form">
                    <div class="form-group">
                        <label for="backupCode">Backup Code</label>
                        <input type="text" id="backupCode" placeholder="XXXX-XXXX" autocomplete="off" 
                               style="text-transform: uppercase; letter-spacing: 2px; text-align: center; font-family: monospace; font-size: 1.2rem;">
                    </div>

                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="showTotpForm()">Use authenticator app</button>
                        <button class="btn btn-primary" id="backupBtn" onclick="useBackupCode()">Use Backup Code</button>
                    </div>
                </div>
            </div>

            <div class="footer-info">
                <p>Having trouble? <a href="https://dws10.com/contact/">Contact Support</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getSupabaseClient } from '../shared/js/supabase-client.js';
        import { showError, showSuccess, setButtonLoading } from '../shared/js/auth-handler.js';
        import { handlePostLoginRedirect } from '../shared/js/role-router.js';
        import { 
            getPendingMfaChallenge, 
            createMfaChallenge, 
            verifyMfaCode, 
            useBackupCode 
        } from '../shared/js/mfa-handler.js';

        let challengeData = null;

        window.addEventListener('DOMContentLoaded', async () => {
            console.log('MFA Verification - Initializing...');
            getSupabaseClient();
            
            // Get pending MFA challenge
            challengeData = getPendingMfaChallenge();
            
            if (!challengeData) {
                showError('No pending authentication. Please login again.');
                setTimeout(() => {
                    window.location.href = '/login/portal.html';
                }, 2000);
                return;
            }
            
            // Create MFA challenge
            const result = await createMfaChallenge(challengeData.factorId);
            if (!result.success) {
                showError('Failed to create verification challenge');
                return;
            }
            
            challengeData.challengeId = result.challengeId;
            
            setupCodeInputs();
        });

        function setupCodeInputs() {
            const inputs = document.querySelectorAll('#codeInput input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = value;
                    
                    if (value && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    // Auto-submit when all filled
                    if (index === inputs.length - 1 && value) {
                        const code = Array.from(inputs).map(i => i.value).join('');
                        if (code.length === 6) {
                            verifyCode();
                        }
                    }
                });
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const paste = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = paste.replace(/[^0-9]/g, '').slice(0, 6);
                    
                    digits.split('').forEach((digit, i) => {
                        if (inputs[i]) inputs[i].value = digit;
                    });
                    
                    if (digits.length === 6) {
                        verifyCode();
                    }
                });
            });
        }

        window.verifyCode = async function() {
            const inputs = document.querySelectorAll('#codeInput input');
            const code = Array.from(inputs).map(i => i.value).join('');
            
            if (code.length !== 6) {
                showError('Please enter all 6 digits');
                return;
            }
            
            const btn = document.getElementById('verifyBtn');
            setButtonLoading(btn, true, 'Verifying...');
            
            const result = await verifyMfaCode(
                challengeData.factorId, 
                challengeData.challengeId, 
                code
            );
            
            if (!result.success) {
                showError(result.error || 'Invalid code. Please try again.');
                setButtonLoading(btn, false, 'Verify');
                inputs.forEach(i => i.value = '');
                inputs[0].focus();
                return;
            }
            
            showSuccess('Verification successful! Redirecting...');
            setTimeout(() => handlePostLoginRedirect(), 1500);
        };

        window.useBackupCode = async function() {
            const codeInput = document.getElementById('backupCode');
            const code = codeInput.value.replace(/[^A-Za-z0-9]/g, '');
            
            if (code.length < 8) {
                showError('Please enter a valid backup code');
                return;
            }
            
            const btn = document.getElementById('backupBtn');
            setButtonLoading(btn, true, 'Verifying...');
            
            const result = await useBackupCode(code);
            
            if (!result.success) {
                showError(result.error || 'Invalid backup code');
                setButtonLoading(btn, false, 'Use Backup Code');
                codeInput.value = '';
                codeInput.focus();
                return;
            }
            
            showSuccess('Backup code accepted! Redirecting...');
            setTimeout(() => handlePostLoginRedirect(), 1500);
        };

        window.showBackupForm = function(event) {
            event.preventDefault();
            document.getElementById('totpSection').classList.add('hidden');
            document.getElementById('backupSection').classList.remove('hidden');
            document.getElementById('subtitle').textContent = 'Enter one of your backup codes';
            document.getElementById('backupCode').focus();
        };

        window.showTotpForm = function() {
            document.getElementById('backupSection').classList.add('hidden');
            document.getElementById('totpSection').classList.remove('hidden');
            document.getElementById('subtitle').textContent = 'Enter the 6-digit code from your authenticator app';
            document.querySelector('#codeInput input').focus();
        };

        window.cancelVerification = function() {
            sessionStorage.removeItem('mfa_challenge');
            window.location.href = '/login/portal.html';
        };
    </script>
</body>
</html>
