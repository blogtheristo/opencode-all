<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Client Login | DWS IQ</title>
    <link rel="stylesheet" href="../../shared/css/auth-styles.css">
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
</head>
<body class="theme-enterprise">
    <div class="container">
        <div class="login-card">
            <div class="logo-section">
                <img src="https://dws10.com/DWS_IQ2026.png" alt="DWS IQ">
                <h1>Enterprise Portal</h1>
            </div>

            <h2 class="page-title">🏢 Enterprise Client Access</h2>
            <p class="page-subtitle">Public cloud enterprise dashboard</p>

            <div class="security-badge">
                <strong>🔒 Enterprise Security</strong>
                Multi-tenant access with organization management
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@company.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        Login to Enterprise Portal
                    </button>
                </div>

                <div class="links">
                    <a href="#" onclick="showResetPassword(event)">Forgot Password?</a>
                    <a href="#" onclick="showRegister(event)">Request Demo</a>
                </div>
            </form>

            <div class="social-login">
                <div class="social-divider">Enterprise SSO</div>
                <button onclick="handleGoogleLogin()" class="social-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    Google Workspace
                </button>
                <button onclick="handleMicrosoftLogin()" class="social-btn" style="margin-top: 8px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <rect width="24" height="24"></rect>
                    </svg>
                    Microsoft 365
                </button>
            </div>

            <div class="footer-info">
                <p>🔐 Enterprise-grade security | <a href="/privacy-policy/">Privacy Policy</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getSupabaseClient } from '../../shared/js/supabase-client.js';
        import { login, resetPassword } from '../../shared/js/auth-handler.js';
        import { handlePostLoginRedirect } from '../../shared/js/role-router.js';

        const ROLE = 'enterprise_client';

        window.addEventListener('DOMContentLoaded', () => {
            console.log('🔐 Enterprise Client Login - Initializing...');
            getSupabaseClient();
        });

        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Logging in...';
            
            const result = await login(email, password, ROLE);
            
            if (result.success) {
                document.getElementById('successMessage').textContent = '✅ Login successful! Loading portal...';
                document.getElementById('successMessage').classList.add('show');
                setTimeout(() => handlePostLoginRedirect(), 1500);
            } else {
                document.getElementById('errorMessage').textContent = result.error || 'Login failed';
                document.getElementById('errorMessage').classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login to Enterprise Portal';
            }
        };

        window.handleGoogleLogin = async function() {
            const client = getSupabaseClient();
            const { error } = await client.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: `${window.location.origin}/dashboard/enterprise/index.html` }
            });
            if (error) alert(error.message);
        };

        window.handleMicrosoftLogin = function() {
            alert('Microsoft 365 SSO integration coming soon. Contact support@dws6.com');
        };

        window.showResetPassword = function(event) {
            event.preventDefault();
            const email = prompt('Enter your email:');
            if (email) resetPassword(email);
        };

        window.showRegister = function(event) {
            event.preventDefault();
            window.location.href = 'https://dws10.com/contact/';
        };
    </script>
</body>
</html>
