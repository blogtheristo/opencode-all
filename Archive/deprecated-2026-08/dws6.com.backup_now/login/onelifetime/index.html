<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneLifetime.world Community Login</title>
    <link rel="stylesheet" href="../../shared/css/auth-styles.css">
    <link rel="icon" href="https://onelifetime.world/OneLifetime+Logo.png" type="image/png">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-section">
                <img src="https://onelifetime.world/OneLifetime+Logo.png" alt="OneLifetime" style="height: 60px;">
                <h1>OneLifetime</h1>
            </div>

            <h2 class="page-title">🌍 Community Portal</h2>
            <p class="page-subtitle">Join the OneLifetime.world community</p>

            <div class="security-badge">
                <strong>🔒 Community Access</strong>
                Connect, collaborate, and grow together
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        Login to Community
                    </button>
                </div>

                <div class="links">
                    <a href="#" onclick="showResetPassword(event)">Forgot Password?</a>
                    <a href="#" onclick="showRegister(event)">Join Community</a>
                </div>
            </form>

            <div class="social-login">
                <div class="social-divider">Or continue with</div>
                <button onclick="handleGoogleLogin()" class="social-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    Google
                </button>
            </div>

            <div class="footer-info">
                <p>🔐 Secured by Supabase Auth | <a href="https://onelifetime.world/privacy-policy/">Privacy</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getSupabaseClient } from '../../shared/js/supabase-client.js';
        import { login, resetPassword } from '../../shared/js/auth-handler.js';
        import { handlePostLoginRedirect } from '../../shared/js/role-router.js';

        const ROLE = 'community_user';

        window.addEventListener('DOMContentLoaded', () => {
            console.log('🔐 OneLifetime Community Login - Initializing...');
            getSupabaseClient();
        });

        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Logging in...';
            
            const result = await login(email, password, ROLE);
            
            if (result.success) {
                document.getElementById('successMessage').textContent = '✅ Welcome to OneLifetime! Redirecting...';
                document.getElementById('successMessage').classList.add('show');
                setTimeout(() => handlePostLoginRedirect(), 1500);
            } else {
                document.getElementById('errorMessage').textContent = result.error || 'Login failed';
                document.getElementById('errorMessage').classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login to Community';
            }
        };

        window.handleGoogleLogin = async function() {
            const client = getSupabaseClient();
            const { error } = await client.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: `${window.location.origin}/dashboard/onelifetime/index.html` }
            });
            if (error) alert(error.message);
        };

        window.showResetPassword = function(event) {
            event.preventDefault();
            const email = prompt('Enter your email:');
            if (email) resetPassword(email);
        };

        window.showRegister = function(event) {
            event.preventDefault();
            window.location.href = 'https://onelifetime.world/';
        };
    </script>
</body>
</html>
