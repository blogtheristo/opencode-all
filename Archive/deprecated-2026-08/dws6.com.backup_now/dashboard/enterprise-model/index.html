<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Studio Dashboard</title>
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; color: #1e293b; }
        .header { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); padding: 16px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.25rem; }
        .logout-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .welcome-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .dashboard-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-value { font-size: 2rem; font-weight: 700; color: #ec4899; margin-bottom: 4px; }
        .stat-label { font-size: 0.9rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Enterprise AI Studio</h1>
        <button onclick="handleLogout()" class="logout-btn">Logout</button>
    </div>
    <div class="container">
        <div class="welcome-card">
            <h2>Enterprise Model Preparation</h2>
            <div id="userInfo">Loading...</div>
        </div>
        <div class="dashboard-grid">
            <div class="dashboard-card"><h3>Private Datasets</h3><div class="stat-value">28</div><div class="stat-label">Uploaded</div></div>
            <div class="dashboard-card"><h3>Custom Models</h3><div class="stat-value">7</div><div class="stat-label">Training</div></div>
            <div class="dashboard-card"><h3>Deployments</h3><div class="stat-value">12</div><div class="stat-label">Production</div></div>
            <div class="dashboard-card"><h3>API Calls</h3><div class="stat-value">1.2M</div><div class="stat-label">This month</div></div>
        </div>
        <div class="welcome-card" style="margin-top: 20px;">
            <h3>Enterprise Vertex AI</h3>
            <p style="color: #64748b; margin-top: 8px;">
                Custom model training, fine-tuning, and deployment with Google Vertex AI Workbench.
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getCurrentUser } from '../../shared/js/supabase-client.js';
        import { logout, requireRole } from '../../shared/js/auth-handler.js';
        
        window.addEventListener('DOMContentLoaded', async () => {
            await requireRole('enterprise_model');
            const user = await getCurrentUser();
            if (user) document.getElementById('userInfo').textContent = `Logged in as: ${user.email}`;
        });
        
        window.handleLogout = async function() {
            await logout();
            window.location.href = '/login/enterprise-model/';
        };
    </script>
</body>
</html>
