<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal Dashboard</title>
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }
        .header { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); padding: 16px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.25rem; }
        .logout-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .welcome-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .dashboard-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-value { font-size: 2rem; font-weight: 700; color: #8b5cf6; margin-bottom: 4px; }
        .stat-label { font-size: 0.9rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 Enterprise Portal</h1>
        <button onclick="handleLogout()" class="logout-btn">Logout</button>
    </div>
    <div class="container">
        <div class="welcome-card">
            <h2>Enterprise Dashboard</h2>
            <div id="userInfo">Loading...</div>
        </div>
        <div class="dashboard-grid">
            <div class="dashboard-card"><h3>Projects</h3><div class="stat-value">48</div><div class="stat-label">Active portfolio</div></div>
            <div class="dashboard-card"><h3>Compliance</h3><div class="stat-value">100%</div><div class="stat-label">CSRD & EPBD</div></div>
            <div class="dashboard-card"><h3>API Keys</h3><div class="stat-value">5</div><div class="stat-label">Active</div></div>
            <div class="dashboard-card"><h3>Team</h3><div class="stat-value">24</div><div class="stat-label">Members</div></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getCurrentUser } from '../../shared/js/supabase-client.js';
        import { logout } from '../../shared/js/auth-handler.js';
        import { requireRole } from '../../shared/js/auth-handler.js';
        window.addEventListener('DOMContentLoaded', async () => {
            await requireRole('enterprise_client');
            const user = await getCurrentUser();
            if (user) document.getElementById('userInfo').textContent = `Logged in as: ${user.email}`;
        });
        window.handleLogout = async function() {
            await logout();
            window.location.href = '/login/enterprise/';
        };
    </script>
</body>
</html>
