[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dws6"
version = "0.1.0"
description = "DWS6 Climate Tech Platform with Agentic AI"
requires-python = ">=3.11"
# This is a private monorepo, not a PyPI package. The standard
# "Private :: Do Not Upload" classifier blocks accidental publication
# and signals to PyPI-publishing GitHub Apps (Submit-PyPI etc.) that
# this repo is not a publication target. See
# docs/field-notes/2026-04-22-ci-hygiene-audit.md for the phantom
# submit-pypi check this guards against.
classifiers = ["Private :: Do Not Upload"]

[tool.poetry]
# Disable package mode - we use Poetry only for dependency management
package-mode = false

[tool.ruff]
# Same line length as Black
line-length = 88
target-version = "py311"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and security (S) by default
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "S101",  # Use of assert (common in tests)
    "S603",  # subprocess without shell=True (often intentional)
    "S104",  # Binding to all interfaces (dev servers)
    "S105",  # Hardcoded password (false positives on OAuth)
    "S110",  # try-except-pass (sometimes intentional)
    "N806",  # Constant naming in functions (acceptable)
    "N811",  # Constant import naming (acceptable)
    "N817",  # CamelCase import as acronym (ET is common)
    "N818",  # Exception suffix (legacy code)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"**/test_*.py" = ["S101", "PLR2004", "TID252", "B017", "PT011"]
"**/tests/**/*.py" = ["S101", "PLR2004", "TID252", "B017", "PT011"]

# Scripts can print and use bare excepts in legacy code
"scripts/**/*.py" = ["T201", "E722", "B904"]

# MCP servers can bind to all interfaces
"mcp-hub/**/*.py" = ["ARG001", "B904"]
"mcp-servers/**/*.py" = ["ARG001", "B904"]

# Site build scripts may have legacy patterns
"sites/**/*.py" = ["E722", "N806"]

# Config modules may re-raise without from
"src/config/**/*.py" = ["B904"]
"Firehorse/Automation/**/*.py" = ["N999"]

[tool.ruff.format]
# Use double quotes for strings (Black-compatible)
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line ending
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["dws6", "firehorse", "mcp_hub"]
