<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWS 6 IQ - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #1a2332 0%, #2d3748 100%); }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .nav-bottom { bottom: 0; left: 0; right: 0; z-index: 50; }
        .chart-container { height: 250px; }
        .slider-container { position: relative; height: 6px; background: #e0e0e0; border-radius: 3px; }
        .slider-track { height: 100%; background: linear-gradient(90deg, #4a90e2, #f4a261); border-radius: 3px; transition: width 0.3s ease; }
        .slider-thumb { position: absolute; top: -8px; width: 22px; height: 22px; background: white; border: 3px solid #4a90e2; border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-thumb:hover { transform: scale(1.1); }
        .metric-card { transition: all 0.3s ease; }
        .metric-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Header -->
    <div class="gradient-bg px-4 pt-12 pb-6">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='index.html'" class="text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-2xl font-bold text-white">Portfolio</h1>
            </div>
            <button class="text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
                </svg>
            </button>
        </div>

        <!-- Portfolio Summary -->
        <div class="bg-white rounded-xl p-4 mb-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="text-center">
                    <p class="text-gray-500 text-sm mb-1">Total Value</p>
                    <p class="text-2xl font-bold text-gray-800">$2.85M</p>
                </div>
                <div class="text-center">
                    <p class="text-gray-500 text-sm mb-1">Day Change</p>
                    <p class="text-2xl font-bold text-green-600">+$12.5K</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-4 pb-20">
        <!-- Asset Allocation Manager -->
        <div class="bg-white rounded-xl card-shadow p-4 mb-6">
            <h3 class="text-lg font-semibold mb-4">Asset Allocation</h3>
            <div id="allocation-chart" class="chart-container mb-4"></div>
            
            <!-- Allocation Sliders -->
            <div class="space-y-4" id="allocation-sliders">
                <div class="allocation-item">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium">US Stocks</span>
                        <span class="text-sm text-gray-500" id="us-stocks-value">35%</span>
                    </div>
                    <div class="slider-container" data-asset="us-stocks">
                        <div class="slider-track" style="width: 35%"></div>
                        <div class="slider-thumb" style="left: calc(35% - 11px)"></div>
                    </div>
                </div>
                
                <div class="allocation-item">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium">International</span>
                        <span class="text-sm text-gray-500" id="international-value">25%</span>
                    </div>
                    <div class="slider-container" data-asset="international">
                        <div class="slider-track" style="width: 25%"></div>
                        <div class="slider-thumb" style="left: calc(25% - 11px)"></div>
                    </div>
                </div>
                
                <div class="allocation-item">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium">Bonds</span>
                        <span class="text-sm text-gray-500" id="bonds-value">20%</span>
                    </div>
                    <div class="slider-container" data-asset="bonds">
                        <div class="slider-track" style="width: 20%"></div>
                        <div class="slider-thumb" style="left: calc(20% - 11px)"></div>
                    </div>
                </div>
                
                <div class="allocation-item">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium">Real Estate</span>
                        <span class="text-sm text-gray-500" id="real-estate-value">12%</span>
                    </div>
                    <div class="slider-container" data-asset="real-estate">
                        <div class="slider-track" style="width: 12%"></div>
                        <div class="slider-thumb" style="left: calc(12% - 11px)"></div>
                    </div>
                </div>
                
                <div class="allocation-item">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium">Commodities</span>
                        <span class="text-sm text-gray-500" id="commodities-value">8%</span>
                    </div>
                    <div class="slider-container" data-asset="commodities">
                        <div class="slider-track" style="width: 8%"></div>
                        <div class="slider-thumb" style="left: calc(8% - 11px)"></div>
                    </div>
                </div>
            </div>

            <button class="w-full mt-4 bg-blue-600 text-white py-3 rounded-lg font-medium" onclick="rebalancePortfolio()">
                Rebalance Portfolio
            </button>
        </div>

        <!-- Holdings List -->
        <div class="bg-white rounded-xl card-shadow p-4 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">Holdings</h3>
                <div class="flex space-x-2">
                    <button class="text-xs px-3 py-1 bg-gray-100 rounded-full" onclick="sortHoldings('value')">Value</button>
                    <button class="text-xs px-3 py-1 bg-gray-100 rounded-full" onclick="sortHoldings('change')">Change</button>
                </div>
            </div>
            <div class="space-y-3" id="holdings-list">
                <!-- Holdings will be populated by JavaScript -->
            </div>
        </div>

        <!-- Performance Metrics -->
        <div class="bg-white rounded-xl card-shadow p-4 mb-6">
            <h3 class="text-lg font-semibold mb-4">Performance Metrics</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 text-xs mb-1">Sharpe Ratio</p>
                    <p class="text-lg font-bold text-gray-800">1.85</p>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 text-xs mb-1">Beta</p>
                    <p class="text-lg font-bold text-gray-800">0.92</p>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 text-xs mb-1">Alpha</p>
                    <p class="text-lg font-bold text-gray-800">2.34%</p>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <p class="text-gray-500 text-xs mb-1">Max Drawdown</p>
                    <p class="text-lg font-bold text-red-600">-8.2%</p>
                </div>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="bg-white rounded-xl card-shadow p-4 mb-6">
            <h3 class="text-lg font-semibold mb-4">Recent Transactions</h3>
            <div class="space-y-3" id="transaction-history">
                <!-- Transactions will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed nav-bottom bg-white border-t border-gray-200 px-4 py-2">
        <div class="flex justify-around">
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-gray-400" data-page="index.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                </svg>
                <span class="text-xs font-medium">Dashboard</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-blue-600" data-page="portfolio.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"></path>
                </svg>
                <span class="text-xs font-medium">Portfolio</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-gray-400" data-page="analytics.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path>
                </svg>
                <span class="text-xs font-medium">Analytics</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-gray-400" data-page="settings.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path>
                </svg>
                <span class="text-xs font-medium">Settings</span>
            </button>
        </div>
    </nav>

    <script>
        // Portfolio page specific functionality
        class PortfolioManager {
            constructor() {
                this.allocations = {
                    'us-stocks': 35,
                    'international': 25,
                    'bonds': 20,
                    'real-estate': 12,
                    'commodities': 8
                };
                this.init();
            }

            init() {
                this.initializeCharts();
                this.setupSliders();
                this.populateHoldings();
                this.populateTransactions();
                this.setupNavigation();
            }

            initializeCharts() {
                const chartDom = document.getElementById('allocation-chart');
                const chart = echarts.init(chartDom);
                
                const data = [
                    { value: 35, name: 'US Stocks', itemStyle: { color: '#4a90e2' } },
                    { value: 25, name: 'International', itemStyle: { color: '#f4a261' } },
                    { value: 20, name: 'Bonds', itemStyle: { color: '#2a9d8f' } },
                    { value: 12, name: 'Real Estate', itemStyle: { color: '#e76f51' } },
                    { value: 8, name: 'Commodities', itemStyle: { color: '#264653' } }
                ];

                const option = {
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['50%', '50%'],
                        data: data,
                        label: {
                            show: true,
                            position: 'outside',
                            formatter: '{b}\n{d}%',
                            fontSize: 10,
                            color: '#666'
                        },
                        labelLine: { show: true },
                        emphasis: {
                            itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' }
                        }
                    }],
                    tooltip: {
                        trigger: 'item',
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        textStyle: { color: '#fff', fontSize: 12 },
                        formatter: '{b}: {c}%'
                    }
                };

                chart.setOption(option);
            }

            setupSliders() {
                document.querySelectorAll('.slider-container').forEach(container => {
                    const thumb = container.querySelector('.slider-thumb');
                    const track = container.querySelector('.slider-track');
                    const asset = container.dataset.asset;
                    
                    let isDragging = false;
                    
                    thumb.addEventListener('mousedown', (e) => {
                        isDragging = true;
                        e.preventDefault();
                    });
                    
                    thumb.addEventListener('touchstart', (e) => {
                        isDragging = true;
                        e.preventDefault();
                    });
                    
                    document.addEventListener('mousemove', (e) => {
                        if (isDragging) this.updateSlider(container, e.clientX);
                    });
                    
                    document.addEventListener('touchmove', (e) => {
                        if (isDragging) this.updateSlider(container, e.touches[0].clientX);
                    });
                    
                    document.addEventListener('mouseup', () => {
                        isDragging = false;
                    });
                    
                    document.addEventListener('touchend', () => {
                        isDragging = false;
                    });
                });
            }

            updateSlider(container, clientX) {
                const rect = container.getBoundingClientRect();
                const percentage = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
                const asset = container.dataset.asset;
                
                this.allocations[asset] = Math.round(percentage);
                this.updateSliderUI(container, percentage);
                this.updateAllocationDisplay(asset, percentage);
            }

            updateSliderUI(container, percentage) {
                const thumb = container.querySelector('.slider-thumb');
                const track = container.querySelector('.slider-track');
                
                track.style.width = percentage + '%';
                thumb.style.left = `calc(${percentage}% - 11px)`;
            }

            updateAllocationDisplay(asset, percentage) {
                const valueElement = document.getElementById(asset + '-value');
                if (valueElement) {
                    valueElement.textContent = Math.round(percentage) + '%';
                }
            }

            populateHoldings() {
                const holdings = [
                    { symbol: 'AAPL', name: 'Apple Inc.', value: 285000, change: 2.34, shares: 1500, weight: 10.0 },
                    { symbol: 'MSFT', name: 'Microsoft Corp.', value: 245000, change: -0.87, shares: 800, weight: 8.6 },
                    { symbol: 'GOOGL', name: 'Alphabet Inc.', value: 198000, change: 1.23, shares: 150, weight: 6.9 },
                    { symbol: 'AMZN', name: 'Amazon.com Inc.', value: 176000, change: 3.45, shares: 120, weight: 6.2 },
                    { symbol: 'TSLA', name: 'Tesla Inc.', value: 154000, change: -2.11, shares: 600, weight: 5.4 },
                    { symbol: 'NVDA', name: 'NVIDIA Corp.', value: 142000, change: 4.56, shares: 280, weight: 5.0 },
                    { symbol: 'META', name: 'Meta Platforms', value: 128000, change: 1.87, shares: 350, weight: 4.5 },
                    { symbol: 'BRK.B', name: 'Berkshire Hathaway', value: 115000, change: 0.45, shares: 420, weight: 4.0 }
                ];

                const holdingsList = document.getElementById('holdings-list');
                holdingsList.innerHTML = holdings.map(holding => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg metric-card">
                        <div class="flex-1">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                    <span class="text-blue-600 font-semibold text-sm">${holding.symbol.charAt(0)}</span>
                                </div>
                                <div>
                                    <p class="font-semibold text-sm">${holding.symbol}</p>
                                    <p class="text-gray-500 text-xs">${holding.shares} shares • ${holding.weight}%</p>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold text-sm">$${holding.value.toLocaleString()}</p>
                            <p class="text-xs ${holding.change >= 0 ? 'text-green-600' : 'text-red-600'}">
                                ${holding.change >= 0 ? '+' : ''}${holding.change}%
                            </p>
                        </div>
                    </div>
                `).join('');
            }

            populateTransactions() {
                const transactions = [
                    { date: '2024-01-15', type: 'BUY', symbol: 'NVDA', shares: 50, price: 495.22, amount: 24761 },
                    { date: '2024-01-12', type: 'SELL', symbol: 'AAPL', shares: 25, price: 185.92, amount: 4648 },
                    { date: '2024-01-10', type: 'BUY', symbol: 'MSFT', shares: 30, price: 378.85, amount: 11365.5 },
                    { date: '2024-01-08', type: 'DIVIDEND', symbol: 'MSFT', shares: 0, price: 0, amount: 240 },
                    { date: '2024-01-05', type: 'BUY', symbol: 'GOOGL', shares: 15, price: 142.56, amount: 2138.4 }
                ];

                const transactionHistory = document.getElementById('transaction-history');
                transactionHistory.innerHTML = transactions.map(tx => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 ${tx.type === 'BUY' ? 'bg-green-100' : tx.type === 'SELL' ? 'bg-red-100' : 'bg-blue-100'} rounded-full flex items-center justify-center">
                                <span class="text-xs font-semibold ${tx.type === 'BUY' ? 'text-green-600' : tx.type === 'SELL' ? 'text-red-600' : 'text-blue-600'}">
                                    ${tx.type.charAt(0)}
                                </span>
                            </div>
                            <div>
                                <p class="font-semibold text-sm">${tx.symbol}</p>
                                <p class="text-gray-500 text-xs">${new Date(tx.date).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold text-sm">${tx.shares > 0 ? tx.shares + ' shares' : 'Dividend'}</p>
                            <p class="text-gray-500 text-xs">$${tx.amount.toLocaleString()}</p>
                        </div>
                    </div>
                `).join('');
            }

            setupNavigation() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const page = e.currentTarget.dataset.page;
                        if (page && page !== 'portfolio.html') {
                            window.location.href = page;
                        }
                    });
                });
            }
        }

        function rebalancePortfolio() {
            alert('Portfolio rebalancing initiated. This would typically connect to your brokerage API.');
        }

        function sortHoldings(criteria) {
            // Implementation for sorting holdings
            console.log('Sorting by:', criteria);
        }

        // Initialize portfolio manager
        document.addEventListener('DOMContentLoaded', () => {
            new PortfolioManager();
        });
    </script>
</body>
</html>
