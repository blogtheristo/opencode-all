# Google Cloud Build — automated build + deploy for dws-iq-backend.
#
# Triggered by:
#   - Cloud Build GitHub trigger on push to claude/b2b-payment-stack-DNdkW (dev)
#   - Cloud Build GitHub trigger on push to main (prod)
#   - Manual: `gcloud builds submit --config=cloudbuild.yaml .`
#
# Mirrors the manual deploy documented in docs/CLOUD_ENVIRONMENTS.md §4.5.
# Every config change here should be reflected in that section (and vice versa).
#
# ============================================================================
# CRITICAL: Cloud Build runs as the Compute SA, NOT the legacy Cloud Build SA
# ============================================================================
# Per §4.4 Gotcha — for projects created or migrated since mid-2024 (incl.
# dws6run6), Cloud Build executes builds as:
#
#     1074393862472-compute@developer.gserviceaccount.com   <- USE THIS
#
# NOT the legacy default that AI assistants (and old GCP docs) keep suggesting:
#
#     1074393862472@cloudbuild.gserviceaccount.com          <- IGNORE THIS
#
# Verify which SA your project uses with:
#     gcloud builds list --limit=1 --format="value(serviceAccount)"
#
# Granting roles to the legacy SA is silently ineffective — the build will
# run, then the deploy step will fail with "Permission denied" on Cloud Run
# or Artifact Registry, exactly the trap that cost us hours on 2026-04-24.
#
# Required IAM on the Cloud Build worker SA (the Compute SA above):
#   - roles/artifactregistry.writer    on dws-iq-repo (already granted)
#   - roles/run.admin                  on dws6run6 (to deploy Cloud Run revisions)
#   - roles/iam.serviceAccountUser     on dws6run6 (to act as the runtime SA)
#   - roles/secretmanager.secretAccessor — DO NOT grant project-wide; the
#     runtime SA already has per-secret accessor via Provision-DwsIqSecrets.ps1
#     (least-privilege per §4.5 Principle 3)
# ============================================================================

steps:
  # ------------------------------------------------------------------
  # 1. Build image (tagged with both commit SHA and :latest)
  # ------------------------------------------------------------------
  - id: build
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq-repo/dws-iq-backend:$COMMIT_SHA"
      - "-t"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq-repo/dws-iq-backend:latest"
      - "."

  # ------------------------------------------------------------------
  # 2. Push both tags to Artifact Registry
  # ------------------------------------------------------------------
  - id: push-sha
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq-repo/dws-iq-backend:$COMMIT_SHA"
    waitFor: ["build"]

  - id: push-latest
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq-repo/dws-iq-backend:latest"
    waitFor: ["build"]

  # ------------------------------------------------------------------
  # 3. Deploy to Cloud Run (dws-iq-backend in europe-north1)
  #
  # Env vars = non-secret config (safe to commit, visible in service spec).
  # Secrets  = runtime refs to Secret Manager, never materialised in the spec.
  # Both SUPABASE_SERVICE_KEY and SUPABASE_SERVICE_ROLE_KEY point to the same
  # secret — see §4.5 "Required backend secrets" note.
  # ------------------------------------------------------------------
  - id: deploy
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "dws-iq-backend"
      - "--image=europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq-repo/dws-iq-backend:$COMMIT_SHA"
      - "--region=europe-north1"
      - "--platform=managed"
      - "--port=8080"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--concurrency=80"
      - "--timeout=60"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--set-env-vars=NODE_ENV=production,EMAIL_FROM=risto@onelifetime.world,SMTP_HOST=email-smtp.eu-north-1.amazonaws.com,SMTP_PORT=587,SMTP_SECURE=false"
      - "--set-secrets=STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_KEY=supabase-service-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-key:latest,JWT_SECRET=jwt-secret:latest,SMTP_USER=smtp-user:latest,SMTP_PASS=smtp-pass:latest"
    waitFor: ["push-sha"]

images:
  - "europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq-repo/dws-iq-backend:$COMMIT_SHA"
  - "europe-north1-docker.pkg.dev/$PROJECT_ID/dws-iq-repo/dws-iq-backend:latest"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: "europe-north1"

timeout: "1200s"
