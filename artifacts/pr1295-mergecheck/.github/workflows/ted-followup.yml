# TED day-3 follow-up emails (counts toward daily SES cap).

name: TED Follow-up

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Send follow-ups
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'risto@onelifetime.world' }}
          TED_OUTREACH_TO: ${{ secrets.TED_OUTREACH_TO || secrets.OUTREACH_DIGEST_EMAIL }}
          OUTREACH_DIGEST_EMAIL: ${{ secrets.OUTREACH_DIGEST_EMAIL }}
        run: node --import tsx scripts/ted-followup.ts
