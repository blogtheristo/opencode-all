# DWS IQ Prometheus Configuration
# 
# Monitoring configuration for the hybrid Docker + Cloudflare deployment.
# Collects metrics from MCP Hub, Temporal, PostgreSQL, and Redis.
#
# @version 1.0.0

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  
  external_labels:
    monitor: 'dws-iq-hybrid'
    environment: 'development'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MCP Hub metrics
  - job_name: 'mcp-hub'
    static_configs:
      - targets: ['mcp-hub:8765']
    metrics_path: /metrics
    scrape_interval: 10s

  # Supabase MCP Server metrics
  - job_name: 'supabase-mcp'
    static_configs:
      - targets: ['supabase-mcp:8766']
    metrics_path: /metrics
    scrape_interval: 10s

  # Temporal metrics
  - job_name: 'temporal'
    static_configs:
      - targets: ['temporal:7233']
    metrics_path: /metrics
    scrape_interval: 30s

  # PostgreSQL metrics (via postgres_exporter if deployed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis metrics (via redis_exporter if deployed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Node exporter (if deployed)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # AI Agents (Agent Foundry)
  - job_name: 'agent-foundry'
    static_configs:
      - targets: ['agent-foundry:8080']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Docker daemon metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # Docker containers (via Docker daemon API)
  - job_name: 'docker'
    static_configs:
      - targets: ['docker:9323']
    scrape_interval: 30s
    metrics_path: /metrics
