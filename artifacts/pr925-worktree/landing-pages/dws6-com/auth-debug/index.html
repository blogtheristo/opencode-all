<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Supabase Auth Debug - DWS6</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f1f5f9; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #1e293b; }
    input { padding: 8px; margin: 5px; width: 200px; }
    button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #2563eb; }
    pre { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 4px; overflow: auto; max-height: 600px; }
    .section { margin: 20px 0; padding: 15px; border-left: 4px solid #3b82f6; background: #f0f9ff; }
    .error { border-left-color: #ef4444; background: #fef2f2; color: #991b1b; }
    .success { border-left-color: #10b981; background: #f0fdf4; color: #166534; }
    .warning { border-left-color: #f59e0b; background: #fffbeb; color: #92400e; }
    code { background: #e2e8f0; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Supabase Auth Debug - DWS6</h1>
    
    <div class="section warning">
      <h3>⚠️ Important Notes:</h3>
      <ul>
        <li>Our app looks for: <code>user.user_metadata.role</code></li>
        <li>After login, we'll inspect what Supabase returns</li>
        <li>If role is missing, that's why login fails</li>
      </ul>
    </div>

    <div class="section">
      <h3>Test Credentials</h3>
      Email: <input id="email" placeholder="test-mobile@dws6.com" value="test-mobile@dws6.com" />
      <br/>
      Password: <input id="password" type="password" placeholder="TestMobile123!" value="TestMobile123!" />
      <br/>
      <button id="btn">🚀 Test Login & Inspect</button>
    </div>

    <div id="output"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // Get from your config
    const SUPABASE_URL = 'https://kpucuwwfhuwurdxyjjtz.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_mZtEHU2k4WolHxePGF6g3w_tdkMCWRh'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const output = document.getElementById('output')

    document.getElementById('btn').addEventListener('click', async () => {
      output.innerHTML = '<div class="section">⏳ Attempting login...</div>'
      
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      try {
        // STEP 1: Try to sign in
        console.log('📝 STEP 1: Attempting signInWithPassword...')
        const { data, error } = await supabase.auth.signInWithPassword({ 
          email, 
          password 
        })

        let html = '<div class="section">'
        
        if (error) {
          html += '<h3 class="error">❌ Sign In Error</h3>'
          html += '<pre>' + JSON.stringify(error, null, 2) + '</pre>'
          html += '<p><strong>Problem:</strong> Could not authenticate user. Check email/password.</p>'
          output.innerHTML = html + '</div>'
          return
        }

        html += '<h3 class="success">✅ Sign In Successful!</h3>'
        html += '<p>User authenticated. Now checking metadata...</p>'

        // STEP 2: Get session
        console.log('📋 STEP 2: Getting session...')
        const sessionRes = await supabase.auth.getSession()
        const session = sessionRes.data.session

        if (!session) {
          html += '<p class="error">❌ No session found!</p>'
        } else {
          html += '<p class="success">✅ Session found</p>'
        }

        // STEP 3: Get current user
        console.log('👤 STEP 3: Getting current user...')
        const userRes = await supabase.auth.getUser()
        const user = userRes.data.user

        if (!user) {
          html += '<p class="error">❌ No user found!</p>'
          output.innerHTML = html + '</div>'
          return
        }

        html += '<p class="success">✅ User found</p>'

        // STEP 4: Inspect metadata
        console.log('🔍 STEP 4: Inspecting metadata...')
        
        const userMetadata = user.user_metadata
        const appMetadata = user.app_metadata
        const role = user.user_metadata?.role
        const permissions = user.user_metadata?.permissions

        html += '<h3>📊 User Metadata Analysis</h3>'
        html += '<pre>user.user_metadata = ' + JSON.stringify(userMetadata, null, 2) + '</pre>'
        
        html += '<h3>🔐 App Metadata</h3>'
        html += '<pre>user.app_metadata = ' + JSON.stringify(appMetadata, null, 2) + '</pre>'

        html += '<h3>🎯 What Our App Needs</h3>'
        if (role) {
          html += '<p class="success">✅ <code>user.user_metadata.role</code> = <strong>' + role + '</strong></p>'
        } else {
          html += '<p class="error">❌ <code>user.user_metadata.role</code> = <strong>NOT FOUND!</strong></p>'
          html += '<p><strong>This is why login fails!</strong> Our app checks for user_metadata.role but it\'s not there.</p>'
        }

        if (permissions) {
          html += '<p class="success">✅ <code>user.user_metadata.permissions</code> = <strong>' + JSON.stringify(permissions) + '</strong></p>'
        } else {
          html += '<p class="error">⚠️ <code>user.user_metadata.permissions</code> = <strong>NOT FOUND</strong></p>'
        }

        // STEP 5: Show full user object
        html += '<h3>📋 Complete User Object</h3>'
        html += '<pre>' + JSON.stringify(user, null, 2) + '</pre>'

        // STEP 6: Show full session object  
        html += '<h3>🎫 Complete Session Object</h3>'
        html += '<pre>' + JSON.stringify(session, null, 2) + '</pre>'

        // STEP 7: Decode JWT
        html += '<h3>🔐 JWT Token (Access Token)</h3>'
        const token = session.access_token
        const decoded = JSON.parse(atob(token.split('.')[1]))
        html += '<pre>' + JSON.stringify(decoded, null, 2) + '</pre>'
        if (decoded.user_metadata?.role) {
          html += '<p class="success">✅ Role found in JWT token: <strong>' + decoded.user_metadata.role + '</strong></p>'
        } else {
          html += '<p class="error">❌ Role NOT found in JWT token claims</p>'
        }

        output.innerHTML = html + '</div>'

      } catch (e) {
        output.innerHTML = '<div class="section error"><h3>❌ Exception</h3><pre>' + e.message + '</pre></div>'
      }
    })
  </script>
</body>
</html>
