version: '3.9'

# DWS MCP Hub - Multi-Agent Orchestration Platform
# Complete infrastructure for coordinating Cursor AI, Claude Code, and Gemini Pro
# 
# Quick Start:
#   1. cp .env.mcp.example .env.mcp
#   2. Edit .env.mcp with your credentials
#   3. docker-compose -f docker-compose.mcp.yml up -d
#
# Services:
#   - MCP Coordination Hub (port 8765)
#   - Supabase MCP Server (port 8766)
#   - Temporal.io Workflow Engine (ports 7233, 8088)
#   - PostgreSQL Context Store (port 5432)

services:
  # ============================================================================
  # POSTGRESQL - Context Store & Session Persistence
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: mcp-hub-postgres
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: mcp_hub
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TEMPORAL.IO - Workflow Durability & Orchestration
  # ============================================================================
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: mcp-hub-temporal
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=mcp_user
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-change_me_in_production}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks:
      - mcp-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal UI - Web interface for monitoring workflows
  temporal-ui:
    image: temporalio/ui:2.21.0
    container_name: mcp-hub-temporal-ui
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    networks:
      - mcp-network
    depends_on:
      temporal:
        condition: service_healthy

  # ============================================================================
  # MCP COORDINATION HUB - Multi-Agent Orchestration
  # ============================================================================
  mcp-hub:
    build:
      context: ./services/mcp-hub
      dockerfile: Dockerfile
    container_name: mcp-coordination-hub
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      # Server Configuration
      - HOST=${MCP_HUB_HOST:-0.0.0.0}
      - PORT=${MCP_HUB_PORT:-8765}
      - LOG_LEVEL=${MCP_LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      
      # Database
      - DATABASE_URL=postgresql://mcp_user:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/mcp_hub
      
      # Temporal Workflow Engine
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-dws-mcp-hub}
      
      # AI Providers
      - CURSOR_API_KEY=${CURSOR_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      
      # Workflow Patterns
      - ENABLE_FAN_OUT_PATTERN=${ENABLE_FAN_OUT_PATTERN:-true}
      - ENABLE_REFLECTION_PATTERN=${ENABLE_REFLECTION_PATTERN:-true}
      - ENABLE_SEQUENTIAL_PATTERN=${ENABLE_SEQUENTIAL_PATTERN:-true}
      - MAX_PARALLEL_TASKS=${MAX_PARALLEL_TASKS:-10}
      
      # Security
      - MCP_HUB_AUTH_ENABLED=${MCP_HUB_AUTH_ENABLED:-true}
      - MCP_HUB_API_KEY=${MCP_HUB_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      
      # Monitoring
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_PORT=${METRICS_PORT:-9090}
    ports:
      - "${MCP_HUB_PORT:-8765}:8765"
      - "${METRICS_PORT:-9090}:9090"
    volumes:
      - ${LOGS_PATH:-./logs}:/app/logs
    networks:
      - mcp-network
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # SUPABASE MCP SERVER - Session Persistence & Firehorse Integration
  # ============================================================================
  supabase-mcp:
    build:
      context: ./services/supabase-mcp
      dockerfile: Dockerfile
    container_name: supabase-mcp-server
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      # Server Configuration
      - HOST=${MCP_HUB_HOST:-0.0.0.0}
      - PORT=${SUPABASE_MCP_PORT:-8766}
      - LOG_LEVEL=${MCP_LOG_LEVEL:-info}
      
      # Supabase Connection
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      
      # Local PostgreSQL (for development)
      - LOCAL_DATABASE_URL=postgresql://mcp_user:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/mcp_hub
      
      # Session Configuration
      - SESSION_STORE_TYPE=${SESSION_STORE_TYPE:-supabase}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-168}
      - AUTO_GENERATE_CLAUDE_MD=${AUTO_GENERATE_CLAUDE_MD:-true}
      
      # Firehorse Add-Ons
      - FIREHORSE_API_URL=${FIREHORSE_API_URL}
      - FIREHORSE_API_KEY=${FIREHORSE_API_KEY}
      
      # Compliance
      - EU_COMPLIANCE_DB_ENABLED=${EU_COMPLIANCE_DB_ENABLED:-true}
      - EN_15978_CALCULATOR_ENABLED=${EN_15978_CALCULATOR_ENABLED:-true}
      - CARBON_CALC_API_URL=${CARBON_CALC_API_URL}
    ports:
      - "${SUPABASE_MCP_PORT:-8766}:8766"
    volumes:
      - ${LOGS_PATH:-./logs}:/app/logs
      - ./claude-sessions:/app/claude-sessions  # CLAUDE.md auto-generation
    networks:
      - mcp-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # PROMETHEUS - Metrics Collection (Optional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: mcp-hub-prometheus
    restart: ${RESTART_POLICY:-unless-stopped}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - mcp-network
    profiles:
      - monitoring

  # ============================================================================
  # GRAFANA - Metrics Visualization (Optional)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: mcp-hub-grafana
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - mcp-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  mcp-network:
    name: ${NETWORK_NAME:-mcp-hub-network}
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

