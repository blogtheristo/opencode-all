# Quality Gate Agent — AgentFoundry Production Config
#
# Code-Version: 1.0.0
# Branch: claude/agents-v2-implementation-PPLwb-EIYyg
# Introduced-In: PR-pending (claude/agents-v2-implementation-PPLwb-EIYyg)
# Date: 2026-04-22
# Owner: Lifetime Oy — risto.paarni@lifetime.fi
#
# This config captures DEPLOYMENT-ONLY concerns (model tier, budget, rate
# limits, guardrails, deployment phase). The system prompt and execution
# logic live in src/agents/quality-gate.agent.ts (source of truth).
# Badges referenced: see kb/wiki/concepts/badges-library.md for canonical
# V2 · SKILLED AGENTS, Standards Strip, and KYA-WRAPPED BY DEFAULT markup.

agent:
  id: "quality-gate-001"
  name: "Quality Gate Agent"
  version: "1.0.0"
  class: "QualityGateAgent"
  source: "src/agents/quality-gate.agent.ts"
  segment: "platform"
  tagline: "Runtime validation gate — blocks agent output that fails schema / fact / citation checks"

  model:
    # Model selection goes through src/agents/model-selector.ts — configured
    # per tier. Override here only if this agent needs a pinned model.
    tier: "fast"
    fallback_chain: ["claude-haiku-4-5-20251001", "llama-3.3-70b-versatile", "qwen2.5:72b"]
    temperature: 0.2
    max_tokens: 4000

  capabilities:
    - schema-validation
    - fact-check
    - citation-verification
    - pii-scrub
    - confidence-scoring

  regulations:
    - "EU AI Act Article 12 (logging)"
    - "GDPR Article 5 (accuracy)"

  tools:
    - fact_extraction_service
    - pii_scrubber

  # Skills exposed to end users / other agents (slash commands + MCP tools/list)
  skills:
    - "runtime gate"

  # Industry pages that list this agent in their V2 Skilled Agents block
  industry_pages:
    - all 11 industry pages (runtime, invisible to visitor)

  # Guardrails (enforced by QualityGate runtime)
  guardrails:
    require_citations: true
    pii_scrub: true
    kya_wrapped: true # badges-library.md v1.1
    max_execution_seconds: 60
    verify_facts: true
    flag_low_confidence_below: 70

  # Rate limits
  rate_limits:
    calls_per_minute: 10
    calls_per_hour: 300
    calls_per_day: 1500

  # Cost tracking
  cost_tracking:
    budget_monthly_eur: 60
    alert_at_percentage: 80

  # Deployment phase — silent_pilot -> advisor -> autonomous
  deployment:
    phase: "silent_pilot"
    approval_required: false
    start_date: "2026-04-22"
    review_frequency: "daily"
    advance_to_advisor_after_days: 30

  # Observability
  logging:
    level: "INFO"
    output: "AgentFoundry/logs/quality-gate-001.log"
    rotation: "daily"
    retention_days: 90

  monitoring:
    alert_on_error: true
    alert_on_budget_threshold: true
    daily_summary: true
    telemetry_channel: "src/agents/telemetry.service.ts"

  # Lifetime Scope Signals (event bus)
  # Quality Gate sits between every upstream agent and its downstream consumers:
  # upstream agents emit READY:execution-complete, the gate validates, then the
  # gate emits COMPLETE:validated, which every other agent listens for.
  signals:
    emits:
      - "[QUALITY-GATE-001]:COMPLETE:validated:{session_id}"
      - "[QUALITY-GATE-001]:ERROR:execution-failed:{reason}"
    listens:
      - "[*]:READY:execution-complete:{session_id}"
