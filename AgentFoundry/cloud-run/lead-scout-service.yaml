# Google Cloud Run Service Configuration
# Lead Scout Agent - lead-scout-001
# Purpose: Lead enrichment, ICP scoring, trigger event detection

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agent-lead-scout-001
  namespace: default
  labels:
    cloud.googleapis.com/location: europe-north1
    agent: lead-scout
    environment: production
    project: dws-iq6
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/launch-stage: BETA

spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0" # Scale to zero
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true" # Faster cold starts
        run.googleapis.com/execution-environment: gen2 # Second generation execution environment
    spec:
      serviceAccountName: sales-agents@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 10
      timeoutSeconds: 300 # 5 minutes max per request

      containers:
        - name: lead-scout-agent
          image: europe-north1-docker.pkg.dev/PROJECT_ID/dws-agents/sales-agent:latest

          # Resource limits
          resources:
            limits:
              cpu: "1000m" # 1 vCPU
              memory: "512Mi" # 512 MB RAM
            requests:
              cpu: "1000m"
              memory: "512Mi"

          # Environment variables
          env:
            - name: AGENT_ID
              value: "lead-scout-001"
            - name: AGENT_CONFIG_PATH
              value: "/app/AgentFoundry/configs/production/lead-scout-001.yaml"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: REGION
              value: "europe-north1"

          # Secrets from Google Secret Manager
          envFrom:
            - secretRef:
                name: anthropic-api-key
            - secretRef:
                name: supabase-credentials
            - secretRef:
                name: apollo-api-key
            - secretRef:
                name: clearbit-api-key
            - secretRef:
                name: slack-webhook
            - secretRef:
                name: teams-webhook
                name: notify-webhook
            - secretRef:
                name: whatsapp-alerting

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Port configuration
          ports:
            - name: http1
              containerPort: 8080

      # Scaling configuration
      scaling:
        minInstances: 0 # Cost optimization: scale to zero
        maxInstances: 5
        targetConcurrency: 8 # Request per instance before scaling up

  traffic:
    - percent: 100
      latestRevision: true
