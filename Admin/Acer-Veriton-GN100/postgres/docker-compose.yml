# =============================================================================
# DWS Edge PostgreSQL — Acer Veriton GN100
# =============================================================================
# Runs PostgreSQL 16 with TimescaleDB + pg_duckdb + pgvector on the
# ARM64 edge device. Designed for:
#   - Agent execution telemetry (TimescaleDB hypertables)
#   - Ad-hoc OLAP analytics (pg_duckdb)
#   - Vector search for local LLM RAG (pgvector)
#   - EU Article 12 audit log mirror
#
# Usage:
#   docker compose up -d              # start
#   docker compose logs -f postgres   # watch logs
#   docker compose down               # stop (data persists)
#   docker compose down -v            # stop + delete data
#
# Connect:
#   psql postgresql://dws_edge:${EDGE_PG_PASSWORD}@localhost:5432/dws_edge
#
# Base: timescale/timescaledb:2.25.2-pg16 (Aiven parity)
# Edge extras: pg_duckdb v1.1.1 (OLAP, blocked on Aiven) + pgvector 0.8.x
#
# @version 2.0.0
# @license Proprietary — Lifetime Oy
# =============================================================================

services:
  # ============================================================================
  # PostgreSQL 16 + TimescaleDB + pg_duckdb + pgvector
  # ============================================================================
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dws-edge-postgres
    environment:
      POSTGRES_USER: dws_edge
      POSTGRES_PASSWORD: ${EDGE_PG_PASSWORD:?Set EDGE_PG_PASSWORD in .env}
      POSTGRES_DB: dws_edge
      # TimescaleDB tuning for GN100 (120 GiB RAM, 10 cores)
      TIMESCALEDB_TUNE: "true"
    ports:
      - "127.0.0.1:5432:5432"  # localhost only — use SSH tunnel for remote access
    volumes:
      - edge_pg_data:/var/lib/postgresql/data
      # All tuning via command-line flags below — no external config file needed
    command: >
      postgres
        -c shared_preload_libraries=timescaledb
        -c max_connections=100
        -c shared_buffers=8GB
        -c effective_cache_size=24GB
        -c maintenance_work_mem=2GB
        -c work_mem=256MB
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=8
        -c wal_buffers=64MB
        -c max_wal_size=4GB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c jit=on
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_connections=on
        -c log_disconnections=on
        -c log_lock_waits=on
    shm_size: '4gb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dws_edge -d dws_edge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dws-edge-network
    deploy:
      resources:
        limits:
          memory: 32G
        reservations:
          memory: 16G

  # ============================================================================
  # pgAdmin (optional — for web-based DB management)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dws-edge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-risto@onelifetime.world}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "127.0.0.1:5050:5050"  # localhost only — SSH tunnel for remote
    volumes:
      - edge_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dws-edge-network
    profiles:
      - admin

volumes:
  edge_pg_data:
    driver: local
  edge_pgadmin_data:
    driver: local

networks:
  dws-edge-network:
    driver: bridge
