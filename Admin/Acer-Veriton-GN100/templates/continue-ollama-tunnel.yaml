name: DWS Veriton Tunnel
version: 1.0.0
schema: v1

models:
  - name: Qwen3-Coder 30B (Veriton Tunnel)
    provider: ollama
    model: qwen3-coder:30b
    # Prefer 127.0.0.1 on Windows (see docs/continue-ollama-tunnel.yaml in repo root).
    apiBase: http://127.0.0.1:11435
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

context:
  - provider: diff
  - provider: file
  - provider: code
  - provider: terminal

rules:
  - Start an SSH tunnel before use: ssh -L 127.0.0.1:11435:localhost:11434 admin100@192.168.101.113
  - Point Continue at localhost:11435 so the inference endpoint stays private.
