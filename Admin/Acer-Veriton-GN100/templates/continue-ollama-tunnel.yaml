name: DWS Veriton Tunnel
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder 32B (Veriton Tunnel)
    provider: ollama
    model: qwen2.5-coder:32b
    apiBase: http://localhost:11435
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

context:
  - provider: diff
  - provider: file
  - provider: code
  - provider: terminal

rules:
  - Start an SSH tunnel before use: ssh -L 11435:localhost:11434 admin100@<veriton-host>
  - Point Continue at localhost:11435 so the inference endpoint stays private.
