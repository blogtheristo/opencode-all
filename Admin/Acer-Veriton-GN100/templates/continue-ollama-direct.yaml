name: DWS Veriton Direct
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder 32B (Veriton Direct)
    provider: ollama
    model: qwen2.5-coder:32b
    apiBase: http://veriton-host-or-ip:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

context:
  - provider: diff
  - provider: file
  - provider: code
  - provider: terminal

rules:
  - Use direct mode only on a trusted private network.
  - Keep firewall rules in place so only approved client IPs can reach port 11434.
