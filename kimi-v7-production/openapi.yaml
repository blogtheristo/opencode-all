openapi: 3.1.0
info:
  title: DWS IQ Mobile API
  version: 0.1.3
  description: Mobile-focused endpoints for portfolio, projects, KPIs, and alerts.
servers:
  - url: https://api.dwsiq.example.com 
security:
  - oidc: []
  - bearerAuth: []
tags:
  - name: Portfolio
  - name: Projects
  - name: Schedule
  - name: Safety
  - name: Quality
  - name: Resources
  - name: Alerts
paths:
  /portfolio/summary:
    get:
      tags: [Portfolio]
      summary: Get portfolio-level KPIs and top alerts
      parameters:
        - name: region
          in: query
          schema: { type: string }
        - name: limitAlerts
          in: query
          schema: { type: integer, default: 5, minimum: 0, maximum: 20 }
      responses:
        "200":
          description: Portfolio KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects:
    get:
      tags: [Projects]
      summary: List projects with KPI summary
      parameters:
        - { name: region, in: query, schema: { type: string } }
        - { name: phase, in: query, schema: { type: string, enum: ["Design","Procurement","Execution","Closeout"] } }
        - { name: risk, in: query, schema: { type: string, enum: ["green","amber","red"] } }
        - { name: spiLt, in: query, schema: { type: number, format: float } }
        - { name: cpiLt, in: query, schema: { type: number, format: float } }
        - { name: safety, in: query, schema: { type: string, enum: ["green","amber","red"] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string, description: "Opaque pagination cursor" } }
      responses:
        "200":
          description: Paged projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
  /projects/{id}/kpis:
    get:
      tags: [Projects]
      summary: Project overview KPIs
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Project KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKpis"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
  /projects/{id}/schedule/critical:
    get:
      tags: [Schedule]
      summary: Critical path tasks and milestones
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Critical path details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriticalPath"
  /projects/{id}/safety:
    get:
      tags: [Safety]
      summary: Safety metrics and incidents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Safety data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Safety"
  /projects/{id}/quality:
    get:
      tags: [Quality]
      summary: Quality metrics and NCRs
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Quality data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quality"
  /projects/{id}/resources:
    get:
      tags: [Resources]
      summary: Resource utilization snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resource data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resources"
  /projects/{id}/cashflow:
    get:
      tags: [Projects]
      summary: Cash flow actual vs. plan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cash flow series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashFlow"
  /alerts:
    get:
      tags: [Alerts]
      summary: Cross-domain alerts feed
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: ["info","amber","red"] } }
        - { name: domain, in: query, schema: { type: string, enum: ["cost","schedule","safety","quality","resources","risk"] } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Alerts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
    post:
      tags: [Alerts]
      summary: Acknowledge alerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alertIds]
              properties:
                alertIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Ack result
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: array
                    items: { type: string }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.dwsiq.example.com/.well-known/openid-configuration 
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    Retry-After:
      description: Seconds to wait before retrying
      schema: { type: integer }
    X-RateLimit-Limit:
      description: Request limit for current window
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requests remaining in current window
      schema: { type: integer }
    X-RateLimit-Reset:
      description: Epoch seconds when the window resets
      schema: { type: integer }
  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsError:
      description: Rate limit exceeded. Honor Retry-After or rate-limit headers.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Error code for programmatic handling
              example: "RATE_LIMIT_EXCEEDED"
            message:
              type: string
              description: Human-readable error message
              example: "Rate limit exceeded. Try again in 60 seconds."
            details:
              type: object
              description: Additional error context
              properties:
                retryAfter:
                  type: integer
                  description: Seconds until retry
                  example: 60
                rateLimit:
                  type: object
                  properties:
                    limit:
                      type: integer
                      description: Request limit per window
                    remaining:
                      type: integer
                      description: Remaining requests in window
                    reset:
                      type: integer
                      description: Epoch seconds when limit resets
    PortfolioSummary:
      type: object
      properties:
        asOf:
          type: string
          format: date-time
        portfolio:
          type: object
          properties:
            spi:
              type: number
              format: float
            cpi:
              type: number
              format: float
            budgetVsForecastPct:
              type: number
              format: float
            trifr:
              type: number
              format: float
            ltifr:
              type: number
              format: float
            nearMissesMtd:
              type: integer
            ncrOpen:
              type: integer
            ncrOverdue:
              type: integer
            cashBurn:
              type: array
              items:
                type: object
                properties:
                  week:
                    type: string
                    format: date
                  value:
                    type: number
                    format: float
            changeOrders:
              type: object
              properties:
                pending:
                  type: integer
                approved:
                  type: integer
                netValue:
                  type: number
                  format: float
        topAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
    ProjectListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCard"
        nextCursor:
          type: string
          nullable: true
    ProjectCard:
      type: object
      properties:
        projectId:
          type: string
        name:
          type: string
        region:
          type: string
        phase:
          type: string
        spi:
          type: number
          format: float
        cpi:
          type: number
          format: float
        percentComplete:
          type: number
          format: float
        daysAheadBehind:
          type: integer
        facVsBudgetPct:
          type: number
          format: float
        safetyRag:
          type: string
          enum: ["green","amber","red"]
        qualityRag:
          type: string
          enum: ["green","amber","red"]
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
    ProjectKpis:
      type: object
      properties:
        projectId:
          type: string
        name:
          type: string
        region:
          type: string
        phase:
          type: string
        spi:
          type: number
          format: float
        cpi:
          type: number
          format: float
        percentComplete:
          type: number
          format: float
        daysAheadBehind:
          type: integer
        facVsBudgetPct:
          type: number
          format: float
        budget:
          type: number
          format: float
        committed:
          type: number
          format: float
        actual:
          type: number
          format: float
        forecastAtCompletion:
          type: number
          format: float
        changeOrders:
          type: object
          properties:
            pending:
              type: integer
            approved:
              type: integer
            netValue:
              type: number
              format: float
        safety:
          $ref: "#/components/schemas/SafetySummary"
        quality:
          $ref: "#/components/schemas/QualitySummary"
        resources:
          $ref: "#/components/schemas/ResourcesSummary"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
    SafetySummary:
      type: object
      properties:
        trifr:
          type: number
          format: float
        ltifr:
          type: number
          format: float
        nearMissesMtd:
          type: integer
        openActions:
          type: integer
    QualitySummary:
      type: object
      properties:
        ncrOpen:
          type: integer
        ncrOverdue:
          type: integer
        reworkPct:
          type: number
          format: float
    ResourcesSummary:
      type: object
      properties:
        workforceToday:
          type: integer
        planToday:
          type: integer
        equipUtilPct:
          type: number
          format: float
    CriticalPath:
      type: object
      properties:
        spi:
          type: number
          format: float
        baselineFinish:
          type: string
          format: date
        forecastFinish:
          type: string
          format: date
        criticalTasks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              floatDays:
                type: integer
              due:
                type: string
                format: date
              responsible:
                type: string
        milestonesNext:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              due:
                type: string
                format: date
              status:
                type: string
                enum: ["on-track","at-risk","slipped"]
    Safety:
      type: object
      properties:
        trifr12m:
          type: number
          format: float
        ltifr12m:
          type: number
          format: float
        nearMissesMtd:
          type: integer
        incidents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              severity:
                type: string
                enum: ["low","med","high"]
              date:
                type: string
                format: date
              status:
                type: string
                enum: ["open","closed"]
              actionsOpen:
                type: integer
        actions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              desc:
                type: string
              ageDays:
                type: integer
              owner:
                type: string
              status:
                type: string
                enum: ["open","closed"]
    Quality:
      type: object
      properties:
        ncrOpen:
          type: integer
        ncrOverdue:
          type: integer
        cycleTimeDays:
          type: number
          format: float
        reworkPct:
          type: number
          format: float
        defectsByTrade:
          type: array
          items:
            type: object
            properties:
              trade:
                type: string
              count:
                type: integer
    Resources:
      type: object
      properties:
        workforceToday:
          type: integer
        planToday:
          type: integer
        equipUtilPct:
          type: number
          format: float
        overtimeHours:
          type: number
          format: float
        subcontractors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              onTimePct:
                type: number
                format: float
              reworkPct:
                type: number
                format: float
              safetyIncidents:
                type: integer
    CashFlow:
      type: object
      properties:
        currency:
          type: string
          example: "EUR"
        series:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
                example: "2025-W01"
              planned:
                type: number
                format: float
              actual:
                type: number
                format: float
    Alert:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
          nullable: true
        type:
          type: string
          enum: ["cost","schedule","safety","quality","resources","risk"]
        severity:
          type: string
          enum: ["info","amber","red"]
        message:
          type: string
        ageHours:
          type: integer
        createdAt:
          type: string
          format: date-time
    AlertListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        nextCursor:
          type: string
          nullable: true