<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWS 6 IQ - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #1a2332 0%, #2d3748 100%); }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .text-gradient { background: linear-gradient(135deg, #4a90e2, #f4a261); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-bg { background-image: url('./resources/hero-bg.jpg'); background-size: cover; background-position: center; }
        .glass-effect { backdrop-filter: blur(10px); background: rgba(255,255,255,0.1); }
        .nav-bottom { bottom: 0; left: 0; right: 0; z-index: 50; }
        .chart-container { height: 300px; }
        .metric-card { transition: all 0.3s ease; }
        .metric-card:active { transform: scale(0.98); }
        .pulse-animation { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .loading-skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Hero Section -->
    <div class="hero-bg gradient-bg min-h-screen relative">
        <!-- Header -->
        <div class="relative z-10 px-4 pt-12 pb-6">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-white">DWS 6 IQ</h1>
                    <p class="text-blue-200 text-sm">Investment Dashboard</p>
                </div>
                <div class="glass-effect rounded-full p-3">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5-5-5h5v-12"></path>
                    </svg>
                </div>
            </div>

            <!-- Portfolio Value -->
            <div class="text-center mb-8">
                <div class="glass-effect rounded-2xl p-6 mx-4">
                    <p class="text-blue-200 text-sm mb-2">Total Portfolio Value</p>
                    <h2 class="text-4xl font-bold text-white mb-2" id="portfolio-value">$0</h2>
                    <div class="flex items-center justify-center space-x-2">
                        <span class="text-green-400 text-sm font-medium" id="daily-change">+$0 (0.00%)</span>
                        <span class="text-xs text-gray-400">Today</span>
                    </div>
                </div>
            </div>

            <!-- Quick Stats Carousel -->
            <div class="splide mb-8" id="stats-carousel">
                <div class="splide__track">
                    <ul class="splide__list">
                        <li class="splide__slide">
                            <div class="glass-effect rounded-xl p-4 mx-2 metric-card">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-blue-200 text-xs">Total Return</span>
                                    <svg class="w-4 h-4 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                                    </svg>
                                </div>
                                <p class="text-white text-lg font-semibold" id="total-return">+$0</p>
                                <p class="text-green-400 text-xs">+12.5% All Time</p>
                            </div>
                        </li>
                        <li class="splide__slide">
                            <div class="glass-effect rounded-xl p-4 mx-2 metric-card">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-blue-200 text-xs">Cash Available</span>
                                    <svg class="w-4 h-4 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"></path>
                                    </svg>
                                </div>
                                <p class="text-white text-lg font-semibold">$125,430</p>
                                <p class="text-blue-400 text-xs">Ready to invest</p>
                            </div>
                        </li>
                        <li class="splide__slide">
                            <div class="glass-effect rounded-xl p-4 mx-2 metric-card">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-blue-200 text-xs">Risk Score</span>
                                    <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                                    </svg>
                                </div>
                                <p class="text-white text-lg font-semibold">6.2/10</p>
                                <p class="text-yellow-400 text-xs">Moderate</p>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="bg-white rounded-t-3xl min-h-screen relative z-20">
            <!-- Time Period Selector -->
            <div class="px-4 pt-6 pb-4">
                <div class="flex space-x-1 bg-gray-100 rounded-lg p-1" id="period-selector">
                    <button class="period-btn flex-1 py-2 px-3 text-xs font-medium rounded-md transition-all" data-period="1D">1D</button>
                    <button class="period-btn flex-1 py-2 px-3 text-xs font-medium rounded-md transition-all" data-period="1W">1W</button>
                    <button class="period-btn flex-1 py-2 px-3 text-xs font-medium rounded-md transition-all active" data-period="1M">1M</button>
                    <button class="period-btn flex-1 py-2 px-3 text-xs font-medium rounded-md transition-all" data-period="3M">3M</button>
                    <button class="period-btn flex-1 py-2 px-3 text-xs font-medium rounded-md transition-all" data-period="1Y">1Y</button>
                    <button class="period-btn flex-1 py-2 px-3 text-xs font-medium rounded-md transition-all" data-period="ALL">ALL</button>
                </div>
            </div>

            <!-- Performance Chart -->
            <div class="px-4 mb-6">
                <div class="bg-white rounded-xl card-shadow p-4">
                    <h3 class="text-lg font-semibold mb-4">Portfolio Performance</h3>
                    <div id="performance-chart" class="chart-container"></div>
                </div>
            </div>

            <!-- Asset Allocation -->
            <div class="px-4 mb-6">
                <div class="bg-white rounded-xl card-shadow p-4">
                    <h3 class="text-lg font-semibold mb-4">Asset Allocation</h3>
                    <div id="allocation-chart" class="chart-container"></div>
                </div>
            </div>

            <!-- Holdings List -->
            <div class="px-4 mb-6">
                <div class="bg-white rounded-xl card-shadow p-4">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold">Top Holdings</h3>
                        <button class="text-blue-600 text-sm font-medium" onclick="window.location.href='portfolio.html'">View All</button>
                    </div>
                    <div class="space-y-3" id="holdings-list">
                        <!-- Holdings will be populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Market Overview -->
            <div class="px-4 mb-20">
                <div class="bg-white rounded-xl card-shadow p-4">
                    <h3 class="text-lg font-semibold mb-4">Market Overview</h3>
                    <div class="space-y-3" id="market-overview">
                        <!-- Market data will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed nav-bottom bg-white border-t border-gray-200 px-4 py-2">
        <div class="flex justify-around">
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-blue-600" data-page="index.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                </svg>
                <span class="text-xs font-medium">Dashboard</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-gray-400" data-page="portfolio.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"></path>
                </svg>
                <span class="text-xs font-medium">Portfolio</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-gray-400" data-page="analytics.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path>
                </svg>
                <span class="text-xs font-medium">Analytics</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-2 px-3 text-gray-400" data-page="settings.html">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path>
                </svg>
                <span class="text-xs font-medium">Settings</span>
            </button>
        </div>
    </nav>

    <script src="main.js"></script>
</body>
</html>
