# Revolut Checkout Worker - Cloudflare Configuration
#
# Creates Revolut orders via the Merchant API for the DWS store.
# Keeps the secret key server-side (never exposed to frontend).
#
# Deployment: npx wrangler deploy -c wrangler.revolut.toml
# Local dev:  npx wrangler dev -c wrangler.revolut.toml
# Set secret: npx wrangler secret put REVOLUT_SECRET_KEY -c wrangler.revolut.toml
#
# @version 1.0.0
# @license Proprietary - Lifetime Oy

name = "dws-revolut-checkout"
main = "revolut-checkout-worker.ts"
compatibility_date = "2024-12-01"

# ============================================================================
# Environment Variables (non-secrets)
# ============================================================================

[vars]
REVOLUT_API_URL = "https://merchant.revolut.com/api"
ENVIRONMENT = "production"

# ============================================================================
# Secrets (set via wrangler secret put)
# ============================================================================
# Required:
# - REVOLUT_SECRET_KEY: Revolut Merchant API secret key (sk_...)
#
# Set with: npx wrangler secret put REVOLUT_SECRET_KEY -c wrangler.revolut.toml

# ============================================================================
# Routes
# ============================================================================

[[routes]]
pattern = "api.dws10.com/checkout/*"
zone_name = "dws10.com"

# ============================================================================
# Placement (Smart Routing - nearest Cloudflare edge)
# ============================================================================

[placement]
mode = "smart"

# ============================================================================
# Observability
# ============================================================================

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# ============================================================================
# Development Environment
# ============================================================================

[env.development]
name = "dws-revolut-checkout-dev"
vars = { REVOLUT_API_URL = "https://sandbox-merchant.revolut.com/api", ENVIRONMENT = "development" }

# ============================================================================
# Staging Environment
# ============================================================================

[env.staging]
name = "dws-revolut-checkout-staging"
vars = { REVOLUT_API_URL = "https://sandbox-merchant.revolut.com/api", ENVIRONMENT = "staging" }

# ============================================================================
# Production Environment
# ============================================================================

[env.production]
name = "dws-revolut-checkout"
vars = { REVOLUT_API_URL = "https://merchant.revolut.com/api", ENVIRONMENT = "production" }
