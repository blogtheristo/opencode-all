# DWS Search Worker - Cloudflare Configuration
#
# Unified document search API backed by Upstash Redis + Supabase file_index.
#
# Deployment: npx wrangler deploy -c src/cloudflare/wrangler.search.toml
# Local dev:  npx wrangler dev -c src/cloudflare/wrangler.search.toml
#
# @version 1.0.0
# @license Proprietary - Lifetime Oy
# @see docs/architecture/SEARCH_ARCHITECTURE.md

name = "dws-search-worker"
main = "search-worker.ts"
compatibility_date = "2024-12-01"

# ============================================================================
# Worker Settings
# ============================================================================

[build]
command = "npm run build:worker"

[build.upload]
format = "modules"
main = "./dist/search-worker.js"

# ============================================================================
# Environment Variables (non-secrets)
# ============================================================================

[vars]
ENVIRONMENT = "production"

# ============================================================================
# Secrets (set via wrangler secret put)
# ============================================================================
# Required secrets:
# - UPSTASH_REDIS_REST_URL: Upstash Redis REST endpoint
# - UPSTASH_REDIS_REST_TOKEN: Upstash Redis REST token
# - SUPABASE_URL: Supabase project URL
# - SUPABASE_SERVICE_KEY: Supabase service role key
# - SEARCH_SYNC_API_KEY: API key for /sync endpoint
#
# Set with: npx wrangler secret put UPSTASH_REDIS_REST_URL -c src/cloudflare/wrangler.search.toml

# ============================================================================
# KV Namespaces
# ============================================================================

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "rate-limit-kv-id"  # Replace with actual KV namespace ID
preview_id = "rate-limit-kv-preview-id"

# ============================================================================
# EU Data Residency & Routing
# ============================================================================

[placement]
mode = "smart"

[[routes]]
pattern = "api.dws10.com/search*"
zone_name = "dws10.com"

[[routes]]
pattern = "api.dws10.com/sync"
zone_name = "dws10.com"

[[routes]]
pattern = "api.dws10.com/health"
zone_name = "dws10.com"

# ============================================================================
# Development Environment
# ============================================================================

[env.development]
name = "dws-search-worker-dev"
vars = { ENVIRONMENT = "development" }

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "rate-limit-kv-dev-id"

# ============================================================================
# Observability
# ============================================================================

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# ============================================================================
# Limits
# ============================================================================

[limits]
cpu_ms = 10000  # 10 seconds — search + sync should be fast
