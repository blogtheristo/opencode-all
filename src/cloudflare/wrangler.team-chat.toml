# DWS IQ Team Chat Worker - Persona Chat Proxy
#
# Proxies chat messages to Claude API with persona system prompts.
# Uses Haiku 4.5 for fast, cost-effective responses.
#
# Deployment: npx wrangler deploy -c wrangler.team-chat.toml
# Local dev:  npx wrangler dev -c wrangler.team-chat.toml
# Secrets:    npx wrangler secret put ANTHROPIC_API_KEY -c wrangler.team-chat.toml
#
# Code-Version: 1.0.0
# Date: 2026-03-28
# Owner: Lifetime Oy

name = "dws-iq-team-chat"
main = "team-chat-worker.ts"
compatibility_date = "2024-12-01"

[build]
command = "npx esbuild team-chat-worker.ts --bundle --format=esm --outfile=dist/team-chat-worker.js"

[build.upload]
format = "modules"
main = "./dist/team-chat-worker.js"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://dws6.com,https://www.dws6.com,http://localhost:8788"

# EU data residency
[placement]
mode = "smart"

# Rate limiting KV
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "PLACEHOLDER_CREATE_WITH_wrangler_kv_namespace_create"

# Routes
# Uncomment after creating KV namespace and setting secrets:
# [[routes]]
# pattern = "chat.dws6.com/*"
# zone_name = "dws6.com"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Staging
[env.staging]
name = "dws-iq-team-chat-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://staging.dws6.com,http://localhost:8788,http://localhost:3000"

# Production
[env.production]
name = "dws-iq-team-chat"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://dws6.com,https://www.dws6.com"
