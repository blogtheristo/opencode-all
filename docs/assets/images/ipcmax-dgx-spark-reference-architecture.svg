<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Reference Architecture: Industrial Vision & Sensor AI with iPCMax Gateways & NVIDIA DGX Spark
  </text>

  <!-- Main sections with colored backgrounds -->

  <!-- Enterprise & Cloud Connectivity Layer -->
  <rect x="50" y="70" width="1100" height="120" fill="#e8f4f8" stroke="#0066cc" stroke-width="2" rx="5"/>
  <text x="70" y="95" font-size="16" font-weight="bold" fill="#0066cc">Enterprise & Cloud Connectivity Layer</text>

  <!-- Cloud Platform boxes -->
  <rect x="450" y="105" width="140" height="70" fill="#fff" stroke="#0066cc" stroke-width="1" rx="3"/>
  <text x="520" y="130" font-size="11" text-anchor="middle" fill="#333">Cloud Platform</text>
  <text x="520" y="145" font-size="9" text-anchor="middle" fill="#666">(Azure IoT Edge,</text>
  <text x="520" y="157" font-size="9" text-anchor="middle" fill="#666">AWS IoT Greengrass)</text>

  <g>
    <rect x="610" y="105" width="70" height="18" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="645" y="117" font-size="10" text-anchor="middle" fill="#333">NVIDIA NGC</text>

    <rect x="610" y="125" width="70" height="18" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="645" y="137" font-size="10" text-anchor="middle" fill="#333">Container Registry</text>

    <rect x="610" y="145" width="70" height="18" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="645" y="157" font-size="10" text-anchor="middle" fill="#333">AI Model Training</text>
  </g>

  <!-- Central Edge AI Compute Layer (NVIDIA DGX Spark) -->
  <rect x="50" y="210" width="1100" height="180" fill="#fff3e0" stroke="#ff6f00" stroke-width="2" rx="5"/>
  <text x="70" y="235" font-size="16" font-weight="bold" fill="#ff6f00">Central Edge AI Compute Layer (NVIDIA DGX Spark)</text>

  <!-- DGX Spark main box -->
  <rect x="100" y="255" width="900" height="110" fill="#ffe8cc" stroke="#ff6f00" stroke-width="2" rx="3"/>
  <text x="550" y="275" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">NVIDIA DGX Spark (Unified Memory)</text>

  <!-- Components inside DGX Spark -->
  <g font-size="9" fill="#333">
    <rect x="130" y="290" width="80" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="170" y="305" text-anchor="middle">NVIDIA GPU</text>
    <text x="170" y="315" text-anchor="middle">Inference</text>

    <rect x="230" y="290" width="80" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="270" y="305" text-anchor="middle">Tensor GPU</text>
    <text x="270" y="315" text-anchor="middle">Cores</text>

    <rect x="330" y="290" width="80" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="370" y="305" text-anchor="middle">NeMo GPU</text>
    <text x="370" y="315" text-anchor="middle">Certified</text>

    <rect x="430" y="290" width="80" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="470" y="305" text-anchor="middle">Anomaly</text>
    <text x="470" y="315" text-anchor="middle">Detection</text>

    <rect x="530" y="290" width="80" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="570" y="305" text-anchor="middle">Vision</text>
    <text x="570" y="315" text-anchor="middle">Inference</text>

    <rect x="630" y="290" width="80" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="670" y="305" text-anchor="middle">NVIDIA NGC</text>
    <text x="670" y="315" text-anchor="middle">Integration</text>
  </g>

  <!-- Specification boxes -->
  <g font-size="10" fill="#333">
    <text x="1020" y="275" font-weight="bold">Specification</text>
    <text x="1020" y="290">iPCMax Gateways:</text>
    <text x="1020" y="303">Intel Atom/Core i</text>
    <text x="1020" y="316">Multiple I/O</text>
    <text x="1020" y="329">Wide Temp</text>
    <text x="1020" y="342">DGX Spark:</text>
    <text x="1020" y="355">Nvidia GPU</text>
    <text x="1020" y="368">Unified Memory</text>
  </g>

  <!-- Industrial Ethernet Switch & Low-Latency TSN Network -->
  <rect x="100" y="375" width="900" height="40" fill="#e0f0ff" stroke="#0066cc" stroke-width="1" rx="2"/>
  <text x="550" y="395" font-size="11" text-anchor="middle" fill="#0066cc" font-weight="bold">
    Industrial Ethernet Switch (e.g., Siemens Scalance) | Low-Latency TSN Network | Ruggedized
  </text>

  <!-- Industrial Edge Compute Layer (iPCMax DIN-rail Gateways) -->
  <rect x="50" y="430" width="1100" height="180" fill="#f0e8f8" stroke="#6a1b9a" stroke-width="2" rx="5"/>
  <text x="70" y="455" font-size="16" font-weight="bold" fill="#6a1b9a">Industrial Edge Compute Layer (iPCMax Gateways)</text>

  <!-- Three iPCMax gateway boxes -->
  <g font-size="10" fill="#333">
    <rect x="100" y="475" width="140" height="110" fill="#fff" stroke="#6a1b9a" stroke-width="2" rx="3"/>
    <text x="170" y="495" text-anchor="middle" font-weight="bold">iPCMax DIN-rail</text>
    <text x="170" y="510" text-anchor="middle">Gateway (Model A)</text>
    <text x="170" y="530" text-anchor="middle" font-size="9">Sensor Data Aggregation</text>
    <text x="170" y="542" text-anchor="middle" font-size="9">Protocol Conversion</text>
    <text x="170" y="554" text-anchor="middle" font-size="9">(MQTT, OPC UA)</text>
    <text x="170" y="567" text-anchor="middle" font-size="9">Time-Sensitive</text>
    <text x="170" y="575" text-anchor="middle" font-size="9">Networking (TSN)</text>

    <rect x="280" y="475" width="140" height="110" fill="#fff" stroke="#6a1b9a" stroke-width="2" rx="3"/>
    <text x="350" y="495" text-anchor="middle" font-weight="bold">iPCMax DIN-rail</text>
    <text x="350" y="510" text-anchor="middle">Gateway (Model B)</text>
    <text x="350" y="530" text-anchor="middle" font-size="9">Sensor Data Aggregation</text>
    <text x="350" y="542" text-anchor="middle" font-size="9">Protocol Conversion</text>
    <text x="350" y="554" text-anchor="middle" font-size="9">(MQTT, OPC UA)</text>
    <text x="350" y="567" text-anchor="middle" font-size="9">Local Security</text>
    <text x="350" y="575" text-anchor="middle" font-size="9">Features</text>
  </g>

  <!-- Secure Boot section -->
  <rect x="460" y="475" width="140" height="40" fill="#ffe8e8" stroke="#d32f2f" stroke-width="1" rx="2"/>
  <text x="530" y="495" text-anchor="middle" font-weight="bold" fill="#d32f2f" font-size="11">Secure Boot</text>
  <text x="530" y="510" text-anchor="middle" fill="#999" font-size="8">Encryption & Auth</text>

  <!-- Data flow information -->
  <g font-size="9" fill="#333">
    <rect x="100" y="595" width="500" height="10" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
    <text x="350" y="602" text-anchor="middle">Modbus RTU/TCP | IO-Link | CAN bus | MQTT</text>
  </g>

  <!-- Industrial Field Layer -->
  <rect x="50" y="625" width="1100" height="150" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="70" y="650" font-size="16" font-weight="bold" fill="#2e7d32">Industrial Field Layer</text>

  <!-- Individual sensors/cameras -->
  <g font-size="10" fill="#333">
    <rect x="100" y="670" width="100" height="80" fill="#fff" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="150" y="690" text-anchor="middle" font-weight="bold">Vibration</text>
    <text x="150" y="707" text-anchor="middle">Sensor</text>
    <text x="150" y="724" text-anchor="middle" font-size="8" fill="#999">Modbus IO-Link</text>
    <text x="150" y="740" text-anchor="middle" font-size="8" fill="#999">Data</text>

    <rect x="230" y="670" width="100" height="80" fill="#fff" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="280" y="690" text-anchor="middle" font-weight="bold">Temperature</text>
    <text x="280" y="707" text-anchor="middle">Sensor</text>
    <text x="280" y="724" text-anchor="middle" font-size="8" fill="#999">Analog/Digital</text>
    <text x="280" y="740" text-anchor="middle" font-size="8" fill="#999">Input</text>

    <rect x="360" y="670" width="100" height="80" fill="#fff" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="410" y="690" text-anchor="middle" font-weight="bold">Pressure</text>
    <text x="410" y="707" text-anchor="middle">Transducer</text>
    <text x="410" y="724" text-anchor="middle" font-size="8" fill="#999">4-20mA</text>
    <text x="410" y="740" text-anchor="middle" font-size="8" fill="#999">Current Loop</text>

    <rect x="490" y="670" width="100" height="80" fill="#fff" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="540" y="690" text-anchor="middle" font-weight="bold">Energy</text>
    <text x="540" y="707" text-anchor="middle">Meter</text>
    <text x="540" y="724" text-anchor="middle" font-size="8" fill="#999">Modbus RTU</text>
    <text x="540" y="740" text-anchor="middle" font-size="8" fill="#999">Power Data</text>

    <rect x="620" y="670" width="100" height="80" fill="#fff" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="670" y="690" text-anchor="middle" font-weight="bold">GigE Vision</text>
    <text x="670" y="707" text-anchor="middle">Camera</text>
    <text x="670" y="724" text-anchor="middle" font-size="8" fill="#999">RTSP/GigE</text>
    <text x="670" y="740" text-anchor="middle" font-size="8" fill="#999">Vision Stream</text>
  </g>

  <!-- Legend/Key -->
  <g font-size="10" fill="#333">
    <text x="50" y="825" font-weight="bold">Network Architecture Key:</text>
    <line x1="50" y1="840" x2="200" y2="840" stroke="#0066cc" stroke-width="2"/>
    <text x="210" y="845" fill="#0066cc">Cloud Connectivity & Model Management</text>

    <line x1="50" y1="860" x2="200" y2="860" stroke="#ff6f00" stroke-width="2"/>
    <text x="210" y="865" fill="#ff6f00">Central GPU Compute (DGX Spark Inference)</text>

    <line x1="500" y1="840" x2="650" y2="840" stroke="#6a1b9a" stroke-width="2"/>
    <text x="660" y="845" fill="#6a1b9a">Edge Gateway (iPCMax DIN-rail)</text>

    <line x1="500" y1="860" x2="650" y2="860" stroke="#2e7d32" stroke-width="2"/>
    <text x="660" y="865" fill="#2e7d32">Field Sensors & I/O Devices</text>
  </g>

  <!-- Low latency note -->
  <rect x="800" y="815" width="300" height="70" fill="#fffacd" stroke="#daa520" stroke-width="1" rx="2"/>
  <text x="810" y="835" font-size="11" font-weight="bold" fill="#333">Deterministic Real-Time Characteristics:</text>
  <text x="810" y="850" font-size="9" fill="#333">• TSN-scheduled networking</text>
  <text x="810" y="863" font-size="9" fill="#333">• Sub-10ms latency sensor-to-inference</text>
  <text x="810" y="876" font-size="9" fill="#333">• QoS marking for critical streams</text>
</svg>
