# Copy relevant blocks into: %USERPROFILE%\.continue\config.yaml
# (or merge with your existing Continue config — do not overwrite unrelated models.)
#
# After SSH tunnel: localhost:11435 -> remote Ollama :11434
# Prefer 127.0.0.1 for apiBase on Windows (avoids some localhost / IPv6 edge cases).

name: DWS Ollama via SSH tunnel
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder 32B (tunnel)
    provider: ollama
    model: qwen2.5-coder:32b
    apiBase: http://127.0.0.1:11435
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096
      # If Continue reports "Model requires more system memory", lower this (e.g. 4096 or 2048).
      contextLength: 8192

context:
  - provider: diff
  - provider: file
  - provider: code
  - provider: terminal

rules:
  - Start the tunnel first: pwsh -File scripts/Start-OllamaTunnel-Watchdog.ps1
  - Model name must match `ollama list` on the server exactly (e.g. qwen2.5-coder:32b).
