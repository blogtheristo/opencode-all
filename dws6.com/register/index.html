<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | DWS IQ 6</title>
    <link rel="stylesheet" href="../shared/css/auth-styles.css">
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
    <style>
        .password-strength {
            margin-top: var(--spacing-sm);
            height: 4px;
            background: rgba(148, 163, 184, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            transition: width 0.3s, background-color 0.3s;
            width: 0;
        }
        .password-strength-label {
            font-size: 0.8rem;
            margin-top: 4px;
            color: var(--text-muted);
        }
        .password-requirements {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: var(--spacing-sm);
            padding-left: var(--spacing-md);
        }
        .password-requirements li {
            margin: 2px 0;
        }
        .password-requirements li.valid {
            color: var(--success-text);
        }
        .password-requirements li.valid::marker {
            content: "✓ ";
        }
        .name-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        @media (max-width: 480px) {
            .name-group {
                grid-template-columns: 1fr;
            }
        }
        .plan-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: var(--spacing-sm);
        }
        .plan-badge.free { background: rgba(96, 165, 250, 0.2); color: var(--primary-blue); }
        .plan-badge.starter { background: rgba(16, 185, 129, 0.2); color: var(--success-text); }
        .plan-badge.professional { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
        .plan-badge.enterprise { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-section">
                <img src="https://dws10.com/DWS_IQ2026.png" alt="DWS IQ">
                <h1>DWS IQ 6</h1>
            </div>

            <h2 class="page-title">
                Create Your Account
                <span class="plan-badge free" id="planBadge">Free</span>
            </h2>
            <p class="page-subtitle">Start your journey with DWS IQ 6</p>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="name-group">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="John" required autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Doe" required autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required autocomplete="new-password" oninput="updatePasswordStrength()">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="password-strength-label" id="strengthLabel"></div>
                    <ul class="password-requirements" id="requirements">
                        <li id="req-length">At least 12 characters</li>
                        <li id="req-upper">One uppercase letter</li>
                        <li id="req-lower">One lowercase letter</li>
                        <li id="req-number">One number</li>
                        <li id="req-special">One special character</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="organization">Organization (Optional)</label>
                    <input type="text" id="organization" name="organization" placeholder="Your company name" autocomplete="organization">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="/terms/" target="_blank">Terms of Service</a> and <a href="https://dws10.com/privacy-policy/" target="_blank">Privacy Policy</a></label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Send me product updates and tips (optional)</label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                        Create Account
                    </button>
                </div>

                <div class="links" style="justify-content: center;">
                    <a href="/login/portal.html">Already have an account? Sign in</a>
                </div>
            </form>

            <div class="social-login">
                <div class="social-divider">Or sign up with</div>
                <button onclick="handleGoogleSignup()" class="social-btn" id="googleBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </button>
            </div>

            <div class="footer-info">
                <p>Secured by Supabase Auth | <a href="https://dws10.com/privacy-policy/">Privacy Policy</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getSupabaseClient } from '../shared/js/supabase-client.js';
        import { register, loginWithGoogle, getPasswordStrength, showError, showSuccess, setButtonLoading } from '../shared/js/auth-handler.js';

        // Get plan from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || 'free';
        const role = urlParams.get('role') || 'dws_iq_standard';

        window.addEventListener('DOMContentLoaded', () => {
            console.log('Registration Page - Initializing...');
            getSupabaseClient();
            
            // Update plan badge
            const badge = document.getElementById('planBadge');
            badge.textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
            badge.className = `plan-badge ${plan}`;
        });

        window.updatePasswordStrength = function() {
            const password = document.getElementById('password').value;
            const strength = getPasswordStrength(password);
            
            const bar = document.getElementById('strengthBar');
            const label = document.getElementById('strengthLabel');
            
            const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];
            bar.style.width = widths[strength.score];
            bar.style.backgroundColor = strength.color;
            label.textContent = password ? strength.label : '';
            label.style.color = strength.color;
            
            // Update requirements
            document.getElementById('req-length').classList.toggle('valid', password.length >= 12);
            document.getElementById('req-upper').classList.toggle('valid', /[A-Z]/.test(password));
            document.getElementById('req-lower').classList.toggle('valid', /[a-z]/.test(password));
            document.getElementById('req-number').classList.toggle('valid', /[0-9]/.test(password));
            document.getElementById('req-special').classList.toggle('valid', /[^A-Za-z0-9]/.test(password));
        };

        window.handleRegister = async function(event) {
            event.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const organization = document.getElementById('organization').value.trim();
            const terms = document.getElementById('terms').checked;
            const newsletter = document.getElementById('newsletter').checked;
            
            // Validation
            if (!terms) {
                showError('Please agree to the Terms of Service and Privacy Policy');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            const btn = document.getElementById('registerBtn');
            setButtonLoading(btn, true, 'Creating account...');
            
            const result = await register(email, password, role, {
                firstName,
                lastName,
                organization,
                access_level: plan,
                newsletter_subscribed: newsletter
            });
            
            if (result.success) {
                showSuccess(result.message || 'Account created! Please check your email to verify.');
                
                // Show verification reminder
                setTimeout(() => {
                    document.getElementById('registerForm').innerHTML = `
                        <div class="security-badge" style="background: var(--success-bg); border-color: var(--success-border);">
                            <strong>Check Your Email</strong>
                            We've sent a verification link to <strong>${email}</strong>
                        </div>
                        <p style="text-align: center; color: var(--text-muted); margin: var(--spacing-lg) 0;">
                            Click the link in the email to activate your account.
                            <br><br>
                            Didn't receive it? Check your spam folder or 
                            <a href="#" onclick="resendEmail('${email}')">resend verification email</a>
                        </p>
                        <div class="button-group">
                            <a href="/login/portal.html" class="btn btn-primary btn-full">Go to Login</a>
                        </div>
                    `;
                }, 500);
            } else {
                showError(result.error || 'Registration failed. Please try again.');
                setButtonLoading(btn, false, 'Create Account');
            }
        };

        window.handleGoogleSignup = async function() {
            const btn = document.getElementById('googleBtn');
            setButtonLoading(btn, true, 'Redirecting...');
            
            const result = await loginWithGoogle(role);
            if (!result.success) {
                showError(result.error || 'Google signup failed');
                setButtonLoading(btn, false, 'Google');
            }
        };

        window.resendEmail = async function(email) {
            const { resendVerificationEmail } = await import('../shared/js/auth-handler.js');
            const result = await resendVerificationEmail(email);
            if (result.success) {
                showSuccess('Verification email sent!');
            } else {
                showError(result.error || 'Failed to resend email');
            }
        };
    </script>
</body>
</html>
