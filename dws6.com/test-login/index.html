<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - DWS6</title>
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }
        .container { max-width: 400px; margin: 50px auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .message { padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        .info { background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🧪 Test Login (No Role Required)</h1>
            
            <div id="message"></div>
            
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="test-mobile@dws6.com" value="test-mobile@dws6.com">
            </div>
            
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" placeholder="TestMobile123!" value="TestMobile123!">
            </div>
            
            <button onclick="testLogin()">Test Login</button>
            
            <div id="result" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseConfig } from '../../shared/config/supabase-config.js';
        
        const supabase = window.supabase.createClient(
            supabaseConfig.url,
            supabaseConfig.anonKey
        );

        window.testLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            if (!email || !password) {
                messageDiv.innerHTML = '<div class="message error">Please enter email and password</div>';
                return;
            }

            messageDiv.innerHTML = '<div class="message info">Testing login...</div>';
            resultDiv.innerHTML = '';

            try {
                // Test Supabase connection first
                const { data: user, error: meError } = await supabase.auth.getUser();
                console.log('Current user check:', user, meError);

                // Try to sign in
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error('Login error:', error);
                    messageDiv.innerHTML = `<div class="message error">❌ Login Failed: ${error.message}</div>`;
                    resultDiv.innerHTML = `
                        <h3>Debug Info:</h3>
                        <pre style="background: #f1f5f9; padding: 10px; border-radius: 6px; overflow: auto;">
Error: ${JSON.stringify(error, null, 2)}
                        </pre>
                    `;
                    return;
                }

                // Success!
                console.log('✅ Login successful!', data);
                messageDiv.innerHTML = '<div class="message success">✅ Login Successful!</div>';
                
                resultDiv.innerHTML = `
                    <h3>User Info:</h3>
                    <pre style="background: #f1f5f9; padding: 10px; border-radius: 6px; overflow: auto;">
Email: ${data.user.email}
User ID: ${data.user.id}
Metadata: ${JSON.stringify(data.user.user_metadata, null, 2)}
                    </pre>
                    <p style="margin-top: 15px; color: #64748b;">
                        ✅ Authentication works! 
                        <br>Redirecting to dashboard in 2 seconds...
                    </p>
                `;

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = '/dashboard/dws-iq-mobile/';
                }, 2000);

            } catch (error) {
                console.error('Exception:', error);
                messageDiv.innerHTML = `<div class="message error">❌ Error: ${error.message}</div>`;
                resultDiv.innerHTML = `
                    <h3>Exception Details:</h3>
                    <pre style="background: #f1f5f9; padding: 10px; border-radius: 6px; overflow: auto;">
${error.message}
                    </pre>
                `;
            }
        };

        // Test on page load
        console.log('✅ Test login page loaded');
        console.log('Supabase config:', {
            url: supabaseConfig.url,
            anonKey: supabaseConfig.anonKey ? 'SET' : 'NOT SET'
        });
    </script>
</body>
</html>
