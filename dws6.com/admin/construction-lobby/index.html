<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Lobby (FREE) Login | DWS6.com</title>
  <link rel="stylesheet" href="../../shared/css/auth-styles.css">
  <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <div class="logo-section">
        <img src="https://dws10.com/DWS_IQ2026.png" alt="DWS IQ">
        <h1>Construction Lobby</h1>
      </div>

      <h2 class="page-title">☕ FREE Dashboard Access</h2>
      <p class="page-subtitle">Kirjaudu sisään ja avaa Construction Dashboard V8 (FREE). Maksulliset tasot avaavat lisää työmaita, integraatioita ja edge‑tuotannon.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Sähköposti</label>
          <input id="email" name="email" type="email" required placeholder="nimi@yritys.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Salasana</label>
          <input id="password" name="password" type="password" required placeholder="••••••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;">🔐 Avaa FREE Dashboard</button>
      </form>

      <div style="margin-top: 14px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <a class="btn btn-secondary" href="/login/portal.html">Takaisin portaaliin</a>
        <a class="btn btn-secondary" href="/forgot-password/">Unohtuiko salasana?</a>
      </div>

      <p class="help-text" style="margin-top: 16px;">
        Haluatko FREE-kutsun? Käy sivulla <a href="https://dws10.com/construction-lobby/" target="_blank" rel="noopener noreferrer">Construction Lobby with Coffee</a>.
      </p>
    </div>
  </div>

  <script type="module">
    import { login } from '../../shared/js/auth-handler.js';
    import { handlePostLoginRedirect } from '../../shared/js/role-router.js';

    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const result = await login(email, password, 'construction_free');
      if (!result.success) {
        alert(result.error || 'Login failed');
        return;
      }
      await handlePostLoginRedirect();
    });
  </script>
</body>
</html>
