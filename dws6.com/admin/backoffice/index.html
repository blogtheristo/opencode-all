<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-Office Admin Login | DWS IQ</title>
    <link rel="stylesheet" href="../../shared/css/auth-styles.css">
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
</head>
<body class="theme-backoffice">
    <div class="container">
        <div class="login-card">
            <div class="logo-section">
                <img src="https://dws10.com/DWS_IQ2026.png" alt="DWS IQ">
                <h1>Back-Office Admin</h1>
            </div>

            <h2 class="page-title">⚙️ Administrator Access</h2>
            <p class="page-subtitle">System management and user administration</p>

            <div class="security-badge">
                <strong>🔒 Internal Access Only</strong>
                User management, containers, and system monitoring
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" name="email" placeholder="admin@dws6.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        Login to Admin Panel
                    </button>
                </div>

                <div class="links">
                    <a href="#" onclick="showResetPassword(event)">Forgot Password?</a>
                </div>
            </form>

            <div class="footer-info">
                <p style="color: #ef4444;">⚠️ Internal use only - All actions are logged</p>
                <p style="margin-top: 8px;">🔐 Secured by Supabase Auth</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getSupabaseClient } from '../../shared/js/supabase-client.js';
        import { login, resetPassword } from '../../shared/js/auth-handler.js';
        import { handlePostLoginRedirect } from '../../shared/js/role-router.js';

        const ROLE = 'backoffice_admin';

        window.addEventListener('DOMContentLoaded', () => {
            console.log('🔐 Back-Office Admin Login - Initializing...');
            getSupabaseClient();
        });

        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Authenticating...';
            
            const result = await login(email, password, ROLE);
            
            if (result.success) {
                document.getElementById('successMessage').textContent = '✅ Admin access granted! Loading panel...';
                document.getElementById('successMessage').classList.add('show');
                setTimeout(() => handlePostLoginRedirect(), 1500);
            } else {
                document.getElementById('errorMessage').textContent = result.error || 'Access denied';
                document.getElementById('errorMessage').classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login to Admin Panel';
            }
        };

        window.showResetPassword = function(event) {
            event.preventDefault();
            const email = prompt('Enter your admin email:');
            if (email) resetPassword(email);
        };
    </script>
</body>
</html>
