<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Control · DWS IQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c1222;
        --panel: #141c2e;
        --line: #2a3548;
        --text: #e8eef7;
        --muted: #8b9bb4;
        --accent: #7dd3c0;
        --warn: #e8a87c;
        --danger: #e07a7a;
        --gold: #c9a227;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px 20px 48px;
      }
      h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: clamp(1.75rem, 3vw, 2.25rem);
        font-weight: 700;
        margin: 0 0 6px;
        letter-spacing: -0.02em;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 16px;
        max-width: 52rem;
        line-height: 1.45;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-bottom: 18px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .stats strong {
        color: var(--warn);
        font-weight: 600;
      }
      .live {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 14px;
        margin-bottom: 20px;
      }
      .live label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      textarea {
        width: 100%;
        min-height: 72px;
        background: #0a101c;
        color: var(--text);
        border: 1px solid var(--line);
        padding: 10px;
        font: inherit;
        resize: vertical;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        align-items: center;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        padding: 10px 14px;
        min-height: 44px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-primary {
        border-color: var(--accent);
        color: var(--bg);
        background: var(--accent);
      }
      .btn-primary:hover {
        filter: brightness(1.05);
        color: var(--bg);
      }
      .centres {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      @media (max-width: 960px) {
        .centres {
          grid-template-columns: 1fr;
        }
      }
      .centre {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 14px;
        min-height: 280px;
        display: flex;
        flex-direction: column;
      }
      .centre h2 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 1.15rem;
        margin: 0 0 4px;
        font-weight: 600;
      }
      .centre .sub {
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .item {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .item:first-of-type {
        border-top: none;
      }
      .item h3 {
        margin: 0 0 4px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .meta {
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 2px 6px;
        border: 1px solid var(--danger);
        color: var(--danger);
        margin-left: 6px;
        vertical-align: middle;
      }
      .badge-hic {
        border-color: var(--gold);
        color: var(--gold);
      }
      .empty {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 12px 0;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 40;
      }
      .modal-bg.open {
        display: flex;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        max-width: 640px;
        width: 100%;
        max-height: 90vh;
        overflow: auto;
        padding: 18px;
      }
      .modal pre {
        white-space: pre-wrap;
        font-size: 0.8rem;
        background: #0a101c;
        padding: 12px;
        border: 1px solid var(--line);
        color: var(--text);
      }
      select,
      input[type="text"] {
        background: #0a101c;
        color: var(--text);
        border: 1px solid var(--line);
        padding: 8px 10px;
        font: inherit;
        min-height: 44px;
      }
      .links {
        margin-top: 18px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .links a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <script src="/shared-assets/nav/ironclad-nav.js"></script>
    <div class="wrap">
      <header>
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div>
            <h1>Mission Control</h1>
            <p class="lede" id="authLine">Checking access…</p>
            <div class="stats" id="stats" hidden>
              <span><strong id="overdueCount">0</strong> overdue / open items</span>
              <span>Nothing closes until you pick Hand to Grok or Take as HIC</span>
              <span class="muted"
                >Hand to Grok = anonymized/redacted only; raw threads → OpenCode local (EU)</span
              >
              <span id="dataSource" class="muted"></span>
            </div>
          </div>
          <a
            href="/dashboard/learn/"
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              color: var(--accent);
              text-decoration: none;
              padding: 10px 14px;
              border: 1px solid var(--line);
              white-space: nowrap;
              margin-top: 8px;
            "
          >
            <span>📅</span> Today's Deadlines
          </a>
        </div>
      </header>

      <section class="live" aria-label="Grok X daily input">
        <label for="livePaste">Paste today’s Grok / X daily (not synced to Supabase yet)</label>
        <textarea id="livePaste" placeholder="Paste live market note from Grok on X…"></textarea>
        <div class="row">
          <select id="liveCentre" aria-label="Assign to centre">
            <option value="investor">Investor</option>
            <option value="partnership">Partnership</option>
            <option value="sales">Sales (Trial)</option>
          </select>
          <button type="button" class="btn btn-primary" id="btnAssignLive">Assign to centre</button>
          <a class="btn" href="./daily/">Open Daily Top 3</a>
        </div>
      </section>

      <div class="centres" id="centres"></div>

      <section class="live" style="margin-top: 16px" aria-label="Add manual item">
        <label>Manual add</label>
        <div class="row">
          <select id="manualCentre">
            <option value="investor">Investor</option>
            <option value="partnership">Partnership</option>
            <option value="sales">Sales</option>
          </select>
          <input
            type="text"
            id="manualTitle"
            placeholder="Title"
            style="flex: 1; min-width: 160px"
          />
          <input
            type="text"
            id="manualNext"
            placeholder="Next action"
            style="flex: 2; min-width: 200px"
          />
          <button type="button" class="btn" id="btnManual">Add</button>
        </div>
      </section>

      <div class="links">
        <a href="/dashboard/">Dashboard hub</a>
        <a
          href="https://github.com/blogtheristo/dws6/blob/main/.claude/handoffs/claude/mission-control-ops.md"
          >Plan (handoff)</a
        >
      </div>
    </div>

    <div class="modal-bg" id="modal" role="dialog" aria-modal="true">
      <div class="modal">
        <h2
          id="modalTitle"
          style="font-family: &quot;Source Serif 4&quot;, Georgia, serif; margin-top: 0"
        >
          Prompt
        </h2>
        <pre id="modalBody"></pre>
        <div class="row">
          <button type="button" class="btn btn-primary" id="btnCopy">Copy</button>
          <button type="button" class="btn" id="btnDownload" hidden>Download .md</button>
          <button type="button" class="btn" id="btnClose">Close</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
      import {
        getCurrentUser,
        getUserRole,
        getSupabaseClient,
      } from "../../shared/js/supabase-client.js?v=20260917-mc-session";
      import { handleOAuthCallback } from "../../shared/js/auth-handler.js?v=20260917-mc-session";
      import {
        CENTRES,
        HIC_ACTIONS,
        requireHicAuth,
        buildQueue,
        itemsForCentre,
        buildGrokPrompt,
        buildOpenCodeHandoff,
        addLiveInput,
        addManualItem,
        setOverlay,
        getLiveInputs,
      } from "./mission-control.js?v=20260917-mc-session";

      let lastDownloadName = "mission-control-grok-overflow.md";
      let lastDownloadBody = "";

      const user = await requireHicAuth(getCurrentUser, handleOAuthCallback, getUserRole);
      if (!user) return;

      document.getElementById("authLine").textContent =
        `${user.email} · Workspace login only · Proton for outbound`;
      document.getElementById("stats").hidden = false;

      const params = new URLSearchParams(location.search);
      const focusId = params.get("id");
      const focusCentre = params.get("centre");

      const supabase = getSupabaseClient();
      let queue = await buildQueue(supabase);
      const hasLive = queue.some((i) => i.source === "supabase");
      document.getElementById("dataSource").textContent = hasLive
        ? "Source: Supabase outreach_threads"
        : "Source: Brief V2 seed (2026-08-24) + local";

      function render() {
        const open = queue.filter((i) => !i.dismissed);
        document.getElementById("overdueCount").textContent = String(open.length);
        const root = document.getElementById("centres");
        root.innerHTML = "";
        for (const c of Object.values(CENTRES)) {
          const items = itemsForCentre(queue, c.id);
          const el = document.createElement("section");
          el.className = "centre";
          el.id = `centre-${c.id}`;
          el.innerHTML = `<h2>${c.label}</h2><div class="sub">${c.noux}<br>${c.repo}</div>`;
          if (!items.length) {
            el.innerHTML += `<p class="empty">No open items — add manually or paste Grok/X.</p>`;
          } else {
            for (const item of items) {
              const div = document.createElement("div");
              div.className = "item";
              if (focusId && item.id === focusId) div.style.outline = "1px solid var(--accent)";
              div.innerHTML = `
              <h3>${escapeHtml(item.title)}
                ${item.noDemoEnv ? '<span class="badge">No demo env</span>' : ""}
                ${item.hicOwned ? '<span class="badge badge-hic">HIC</span>' : ""}
              </h3>
              <div class="meta">${escapeHtml(item.status)} · ${escapeHtml(item.id)} · ${escapeHtml(item.source || "")}</div>
              <div class="meta">${escapeHtml(item.nextAction || "")}</div>
              <div class="row">
                <button type="button" class="btn btn-primary" data-grok="${escapeAttr(item.id)}">Hand to Grok</button>
                <button type="button" class="btn" data-opencode="${escapeAttr(item.id)}">Open in OpenCode</button>
                <button type="button" class="btn" data-hic="${escapeAttr(item.id)}">Take as HIC</button>
              </div>`;
              el.appendChild(div);
            }
          }
          root.appendChild(el);
        }
        if (focusCentre) {
          document.getElementById(`centre-${focusCentre}`)?.scrollIntoView({ behavior: "smooth" });
        }
      }

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, "&#39;");
      }

      function findItem(id) {
        return queue.find((i) => i.id === id);
      }

      function openModal(title, body, { downloadable = false, filename = "" } = {}) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").textContent = body;
        lastDownloadBody = body;
        lastDownloadName = filename || "mission-control-opencode-ready.md";
        document.getElementById("btnDownload").hidden = !downloadable;
        document.getElementById("modal").classList.add("open");
      }

      document.getElementById("centres").addEventListener("click", (e) => {
        const grok = e.target.closest("[data-grok]");
        const opencode = e.target.closest("[data-opencode]");
        const hic = e.target.closest("[data-hic]");
        if (grok) {
          const item = findItem(grok.getAttribute("data-grok"));
          if (!item) return;
          const note = getLiveInputs()[0]?.text || "";
          openModal(
            "Hand to Grok (anonymized only — raw threads → Open in OpenCode)",
            buildGrokPrompt(item, note),
          );
        }
        if (opencode) {
          const item = findItem(opencode.getAttribute("data-opencode"));
          if (!item) return;
          const note = getLiveInputs()[0]?.text || "";
          const pack = buildOpenCodeHandoff(item, note);
          openModal("OpenCode Ready (HIC approval) — paste into OpenCode local/EU", pack.markdown, {
            downloadable: true,
            filename: "mission-control-grok-overflow-ready.md",
          });
        }
        if (hic) {
          const id = hic.getAttribute("data-hic");
          const item = findItem(id);
          if (!item) return;
          const choice = prompt(
            `Take as HIC — type one:\n${HIC_ACTIONS.map((a) => a.id).join(", ")}`,
            item.hicAction || "meeting",
          );
          if (!choice) return;
          const ok = HIC_ACTIONS.some((a) => a.id === choice.trim());
          if (!ok) {
            alert("Unknown action. Use: " + HIC_ACTIONS.map((a) => a.id).join(", "));
            return;
          }
          setOverlay(id, { hicOwned: true, hicAction: choice.trim() });
          queue = queue.map((i) =>
            i.id === id ? { ...i, hicOwned: true, hicAction: choice.trim() } : i,
          );
          render();
        }
      });

      document.getElementById("btnCopy").onclick = async () => {
        const text = document.getElementById("modalBody").textContent;
        await navigator.clipboard.writeText(text);
        document.getElementById("btnCopy").textContent = "Copied";
        setTimeout(() => {
          document.getElementById("btnCopy").textContent = "Copy";
        }, 1500);
      };
      document.getElementById("btnDownload").onclick = () => {
        const blob = new Blob([lastDownloadBody], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = lastDownloadName;
        a.click();
        URL.revokeObjectURL(url);
      };
      document.getElementById("btnClose").onclick = () =>
        document.getElementById("modal").classList.remove("open");

      document.getElementById("btnAssignLive").onclick = () => {
        const text = document.getElementById("livePaste").value.trim();
        const centre = document.getElementById("liveCentre").value;
        if (!text) return;
        const entry = { id: `live:${Date.now()}`, centre, text, at: new Date().toISOString() };
        addLiveInput(entry);
        document.getElementById("livePaste").value = "";
        location.reload();
      };

      document.getElementById("btnManual").onclick = () => {
        const centre = document.getElementById("manualCentre").value;
        const title = document.getElementById("manualTitle").value.trim();
        const nextAction = document.getElementById("manualNext").value.trim();
        if (!title) return;
        addManualItem({
          id: `manual:${Date.now()}`,
          centre,
          title,
          status: "manual",
          nextAction: nextAction || "Triage",
          nouxRoom: CENTRES[centre].noux,
          repoPath: CENTRES[centre].repo,
          noDemoEnv: true,
          priority: 2,
          source: "manual",
        });
        location.reload();
      };

      render();
    </script>
    <script src="/shared-assets/footer/ironclad-footer.js"></script>
  </body>
</html>
