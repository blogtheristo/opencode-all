<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Room</title>
  <style>
    body { margin: 0; font-family: Inter, -apple-system, sans-serif; background: #0b1220; color: #e2e8f0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid #3b82f6; background: transparent; color: #bfdbfe; cursor: pointer; }
    .btn:hover { background: #1d4ed8; color: #fff; }
    .event { border-left: 3px solid #3b82f6; padding: 10px 12px; margin: 8px 0; background: #0f172a; }
    .sev-high { border-left-color: #ef4444; }
    .sev-med { border-left-color: #f59e0b; }
    .sev-low { border-left-color: #22c55e; }
    .muted { color: #94a3b8; }
  </style>
</head>
<body>
  <script src="/shared-assets/nav/ironclad-nav.js"></script>
  <div class="container">
    <div class="card">
      <h1>Control Room</h1>
      <p id="roleLine" class="muted">Validating role...</p>
      <a class="btn" href="/dashboard/index.html">Back to Hub</a>
    </div>

    <div class="grid">
      <div class="card"><h3>API Sources</h3><p class="muted">Weather API, ERP API, Compliance API</p></div>
      <div class="card"><h3>Sensor Feed</h3><p class="muted">IoT telemetry and edge diagnostics</p></div>
      <div class="card"><h3>Robot Feed</h3><p class="muted">Fleet heartbeats and mission events</p></div>
    </div>

    <div class="card">
      <h2>Live Events</h2>
      <div id="events"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { getCurrentUser, getUserRole } from '../../shared/js/supabase-client.js';
    import { handleOAuthCallback } from '../../shared/js/auth-handler.js';

    const eventSchema = [
      { source: 'api', timestamp: new Date().toISOString(), severity: 'low', assetId: 'weather-eu', actionRequired: 'none', message: 'Forecast sync healthy' },
      { source: 'sensor', timestamp: new Date().toISOString(), severity: 'med', assetId: 'site-17', actionRequired: 'ack', message: 'CO₂ spike detected in zone B' },
      { source: 'robot', timestamp: new Date().toISOString(), severity: 'high', assetId: 'fleet-r2', actionRequired: 'dispatch', message: 'Autonomy fallback triggered' }
    ];

    await handleOAuthCallback();
    const user = await getCurrentUser();
    if (!user) {
      window.location.href = '/login/';
    } else {
      const role = await getUserRole();
      if (!['control_room', 'backoffice_admin'].includes(role || '')) {
        window.location.href = '/dashboard/index.html';
      } else {
        document.getElementById('roleLine').textContent = `Role: ${role}`;
      }
    }

    document.getElementById('events').innerHTML = eventSchema.map(ev => `
      <div class="event sev-${ev.severity}">
        <div><strong>${ev.source.toUpperCase()}</strong> · ${ev.assetId} · ${ev.severity.toUpperCase()}</div>
        <div class="muted">${ev.timestamp}</div>
        <div>${ev.message}</div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button class="btn" onclick="alert('Acknowledge: ${ev.assetId}')">Acknowledge</button>
          <button class="btn" onclick="alert('Launch workflow: ${ev.assetId}')">Launch Workflow</button>
        </div>
      </div>
    `).join('');
  </script>
  <script src="/shared-assets/footer/ironclad-footer.js"></script>
</body>
</html>
