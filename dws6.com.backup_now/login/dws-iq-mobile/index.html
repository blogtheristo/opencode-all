<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWS IQ Mobile V7 Login | Field Management</title>
    <link rel="stylesheet" href="../../shared/css/auth-styles.css">
    <link rel="icon" href="https://dws10.com/DWS_IQ2026.png" type="image/png">
</head>
<body class="theme-mobile">
    <div class="container">
        <div class="login-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <img src="https://dws10.com/DWS_IQ2026.png" alt="DWS IQ">
                <h1>DWS IQ Mobile</h1>
            </div>

            <!-- Page Title -->
            <h2 class="page-title">📱 Mobile Dashboard V7</h2>
            <p class="page-subtitle">Field management and on-site project tracking</p>

            <!-- Security Badge -->
            <div class="security-badge">
                <strong>🔒 Secure Field Access</strong>
                Mobile-optimized dashboard for construction site management
            </div>

            <!-- Messages -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me on this device</label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        Login to Mobile Dashboard
                    </button>
                </div>

                <div class="links">
                    <a href="#" onclick="showResetPassword(event)">Forgot Password?</a>
                    <a href="#" onclick="showRegister(event)">Create Account</a>
                </div>
            </form>

            <!-- Social Login -->
            <div class="social-login">
                <div class="social-divider">Or continue with</div>
                <button onclick="handleGoogleLogin()" class="social-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    Google Workspace
                </button>
            </div>

            <!-- Footer Info -->
            <div class="footer-info">
                <p>🔐 Secured by Supabase Auth | <a href="/privacy-policy/">Privacy Policy</a></p>
                <p style="margin-top: 8px; font-size: 0.8rem;">
                    Need help? Contact <a href="https://dws10.com/contact/">support@dws6.com</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Auth Scripts -->
    <script type="module">
        import { getSupabaseClient } from '../../shared/js/supabase-client.js';
        import { login, register, resetPassword } from '../../shared/js/auth-handler.js';
        import { handlePostLoginRedirect } from '../../shared/js/role-router.js';

        const ROLE = 'dws_iq_mobile';

        // Initialize Supabase
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🔐 DWS IQ Mobile V7 Login - Initializing...');
            getSupabaseClient();
        });

        // Handle login
        window.handleLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Logging in...';
            
            try {
                const result = await login(email, password, ROLE);
                
                if (result.success) {
                    showSuccess('✅ Login successful! Redirecting to mobile dashboard...');
                    setTimeout(() => {
                        handlePostLoginRedirect();
                    }, 1500);
                } else {
                    showError(result.error || 'Login failed. Please check your credentials.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login to Mobile Dashboard';
                }
            } catch (error) {
                showError('An unexpected error occurred. Please try again.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login to Mobile Dashboard';
            }
        };

        // Handle Google login
        window.handleGoogleLogin = async function() {
            const client = getSupabaseClient();
            if (!client) return;
            
            try {
                const { error } = await client.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: `${window.location.origin}/dashboard/dws-iq-mobile/index.html`
                    }
                });
                
                if (error) {
                    showError(error.message);
                }
            } catch (error) {
                showError('Google login failed. Please try again.');
            }
        };

        // Show reset password form
        window.showResetPassword = function(event) {
            event.preventDefault();
            const email = prompt('Enter your email address to reset password:');
            if (email) {
                resetPassword(email).then(result => {
                    if (result.success) {
                        showSuccess('✅ Password reset email sent! Check your inbox.');
                    } else {
                        showError(result.error || 'Failed to send reset email.');
                    }
                });
            }
        };

        // Show register form
        window.showRegister = function(event) {
            event.preventDefault();
            showInfo('Registration is currently invite-only. Contact your administrator for access.');
        };

        // UI Helpers
        window.showError = function(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            successDiv.classList.remove('show');
        };

        window.showSuccess = function(message) {
            const successDiv = document.getElementById('successMessage');
            const errorDiv = document.getElementById('errorMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            errorDiv.classList.remove('show');
        };

        window.showInfo = function(message) {
            alert(message); // Simple alert for now
        };
    </script>
</body>
</html>
