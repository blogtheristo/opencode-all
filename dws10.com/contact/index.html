<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Risto | Lifetime Oy</title>
<meta name="description" content="Send Risto a short message about DWS IQ, Lifetime Oy, partnerships, or investment.">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0f172a;color:#e2e8f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e3a5f,#0f172a 55%)}main{width:min(100% - 32px,640px);margin:0 auto;padding:72px 0}.card{padding:32px;border:1px solid rgba(148,163,184,.25);border-radius:16px;background:rgba(15,23,42,.9);box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{margin:0 0 8px;color:#f8fafc;font-size:clamp(1.8rem,5vw,2.5rem)}.intro{margin:0 0 28px;color:#94a3b8}form{display:grid;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:6px;color:#cbd5e1;font-size:.9rem;font-weight:600}input,textarea{width:100%;border:1px solid #334155;border-radius:8px;padding:11px 12px;color:#f8fafc;background:#111c30;font:inherit}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{outline:2px solid #60a5fa;outline-offset:1px}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}button{border:0;border-radius:8px;padding:13px 20px;color:#0f172a;background:#60a5fa;font:inherit;font-weight:700;cursor:pointer}button:disabled{cursor:wait;opacity:.65}.status{min-height:1.5em;margin:0;color:#94a3b8}.status.success{color:#4ade80}.status.error{color:#f87171}.signature{margin-top:28px;color:#94a3b8;font-size:.9rem}@media(max-width:560px){main{padding:32px 0}.card{padding:24px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main><section class="card" aria-labelledby="contact-title"><h1 id="contact-title">Send Risto a note</h1><p class="intro">A short form is all we need. Your message goes directly to Lifetime Oy.</p><form id="contact-form"><div class="grid"><label>Name<input name="name" autocomplete="name" maxlength="120" required></label><label>Work email<input name="email" type="email" autocomplete="email" maxlength="254" required></label></div><div class="grid"><label>Company<input name="company" autocomplete="organization" maxlength="160" required></label><label>Phone<input name="phone" type="tel" autocomplete="tel" maxlength="40" required></label></div><label>Message (optional)<textarea name="message" maxlength="4000"></textarea></label><label class="trap" aria-hidden="true">Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit">Send to Risto</button><p class="status" id="contact-status" role="status" aria-live="polite"></p></form><p class="signature">Risto Anton Päärni<br>Founder, CEO · Lifetime Oy<br>risto.paarni@lifetime.fi · +358 400 319 010</p></section></main>
<script>
const form=document.getElementById("contact-form"),status=document.getElementById("contact-status"),submit=form.querySelector("button");
form.addEventListener("submit",async event=>{event.preventDefault();status.className="status";status.textContent="Sending…";submit.disabled=true;try{const response=await fetch("/api/contact",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const result=await response.json();if(!response.ok)throw new Error(result.error||"The message could not be sent.");form.reset();status.className="status success";status.textContent="Sent. Risto will get back to you.";}catch(error){status.className="status error";status.textContent=error.message;}finally{submit.disabled=false;}});
</script></body></html>
