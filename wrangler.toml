name = "dws6-dashboard"
type = "javascript"
account_id = ""  # Add your Cloudflare Account ID
workers_dev = true
route = ""
zone_id = ""    # Add your Cloudflare Zone ID

[build]
cwd = "dws6.com"
command = "echo 'Build complete'"

[build.upload]
format = "service-worker"

[env.production]
name = "dws6-dashboard-prod"
routes = [
  { pattern = "dws6.com/*", zone_name = "dws6.com" }
]
