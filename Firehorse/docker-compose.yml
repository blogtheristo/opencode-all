# Firehorse Services - Docker Compose
# Development and local testing configuration

version: "3.8"

services:
  # ============================================================================
  # Firehorse Report Engine API
  # ============================================================================
  firehorse-reports:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: firehorse-reports
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - PORT=8084
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - TEMPLATES_DIR=/app/templates
      - CORS_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://dws10.com,https://onelifetime.world}
    volumes:
      - ./templates:/app/templates:ro
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # Firehorse Automation Service
  # ============================================================================
  firehorse-automation:
    build:
      context: ./Automation
      dockerfile: Dockerfile
    container_name: firehorse-automation
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - PORT=8085
      - REPORT_ENGINE_URL=http://firehorse-reports:8084
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL}
      - WHATSAPP_API_BASE_URL=${WHATSAPP_API_BASE_URL:-https://graph.facebook.com}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v20.0}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_DEFAULT_RECIPIENT=${WHATSAPP_DEFAULT_RECIPIENT}
      - WHATSAPP_TEMPLATE_NAME=${WHATSAPP_TEMPLATE_NAME}
      - WHATSAPP_TEMPLATE_LANGUAGE=${WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
      - CORS_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://dws10.com,https://onelifetime.world}
    depends_on:
      firehorse-reports:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # Firehorse Content DMS Service
  # ============================================================================
  firehorse-dms:
    build:
      context: ./dms
      dockerfile: Dockerfile
    container_name: firehorse-dms
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - PORT=8086
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-firehorse-documents}
      - CORS_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://dws10.com,https://onelifetime.world}
      - SIGNED_URL_EXPIRY_SECONDS=900
    depends_on:
      firehorse-reports:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # Redis (for job queue and caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: firehorse-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: firehorse-network

volumes:
  redis_data:
