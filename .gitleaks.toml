title = "DWS6 Gitleaks Configuration"

[allowlist]
  description = "Known safe patterns and example files"

  # Example/template files with placeholder values
  paths = [
    '''.mcp\.json\.example''',
    '''.env\.example''',
    '''docs/.*''',
    '''Learn/.*\.html''',
  ]

  # Known safe patterns (not real secrets)
  regexTarget = "match"
  regexes = [
    '''your[-_].*[-_]here''',
    '''ghp_your_personal_access_token_here''',
    '''sbp_your_personal_access_token_here''',
    '''your_docker_hub_pat_here''',
  ]
