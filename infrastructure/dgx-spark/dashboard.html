<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGX Spark — Observatory</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #71717a;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
    --cyan: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
  .header h1 span { color: var(--cyan); }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.up { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.degraded { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .status-dot.down { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .grid { display: grid; gap: 16px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-1 { grid-template-columns: 1fr; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* Gauges */
  .gauge { text-align: center; }
  .gauge-value { font-size: 36px; font-weight: 700; line-height: 1; }
  .gauge-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .gauge-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
  .gauge-fill.ok { background: var(--green); }
  .gauge-fill.warn { background: var(--yellow); }
  .gauge-fill.crit { background: var(--red); }

  /* Service grid */
  .svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .svc-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .svc-item .latency { font-size: 10px; color: var(--muted); margin-left: auto; }

  /* Containers */
  .container-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .container-table th {
    text-align: left; padding: 6px 10px; color: var(--muted);
    font-weight: 500; border-bottom: 1px solid var(--border);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .container-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }

  /* Drift alerts */
  .drift-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px; margin-bottom: 6px;
    font-size: 12px;
  }
  .drift-item.critical { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
  .drift-item.warn { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3); }
  .drift-item.info { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); }
  .drift-label { font-weight: 600; min-width: 100px; }

  /* Models */
  .model-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .model-item:last-child { border-bottom: none; }
  .model-size { color: var(--muted); font-size: 11px; }

  /* History sparkline */
  .sparkline { display: flex; align-items: flex-end; gap: 1px; height: 40px; }
  .spark-bar { flex: 1; background: var(--blue); border-radius: 1px 1px 0 0; min-width: 2px; opacity: 0.7; transition: height 0.3s; }
  .spark-bar:hover { opacity: 1; }

  .section { margin-top: 24px; }
  .no-data { color: var(--muted); font-size: 13px; text-align: center; padding: 24px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .tag.online { background: rgba(34,197,94,0.15); color: var(--green); }
  .tag.offline { background: rgba(239,68,68,0.15); color: var(--red); }

  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    body { padding: 12px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1><span>DGX Spark</span> Observatory</h1>
    <div class="header-right">
      <span id="system-status"><span class="status-dot"></span> loading...</span>
      <span id="last-update">--</span>
    </div>
  </div>

  <!-- System gauges -->
  <div class="grid grid-4" id="gauges">
    <div class="card gauge" id="cpu-gauge">
      <div class="card-title">CPU Load</div>
      <div class="gauge-value">--</div>
      <div class="gauge-label">-- cores</div>
      <div class="gauge-bar"><div class="gauge-fill ok" style="width:0%"></div></div>
    </div>
    <div class="card gauge" id="mem-gauge">
      <div class="card-title">Memory</div>
      <div class="gauge-value">--%</div>
      <div class="gauge-label">-- / -- GB</div>
      <div class="gauge-bar"><div class="gauge-fill ok" style="width:0%"></div></div>
    </div>
    <div class="card gauge" id="disk-gauge">
      <div class="card-title">Disk</div>
      <div class="gauge-value">--%</div>
      <div class="gauge-label">-- / -- GB</div>
      <div class="gauge-bar"><div class="gauge-fill ok" style="width:0%"></div></div>
    </div>
    <div class="card gauge" id="gpu-gauge">
      <div class="card-title">GPU</div>
      <div class="gauge-value">--%</div>
      <div class="gauge-label">-- / -- MB</div>
      <div class="gauge-bar"><div class="gauge-fill ok" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Services -->
  <div class="section">
    <div class="card">
      <div class="card-title">Services</div>
      <div class="svc-grid" id="services">
        <div class="no-data">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Runner + Models -->
  <div class="section grid grid-2">
    <div class="card">
      <div class="card-title">GitHub Actions Runner</div>
      <div id="runner-info" style="font-size:13px;">Loading...</div>
    </div>
    <div class="card">
      <div class="card-title">Ollama Models</div>
      <div id="ollama-models">Loading...</div>
    </div>
  </div>

  <!-- Containers -->
  <div class="section">
    <div class="card">
      <div class="card-title">Containers</div>
      <div id="containers" style="overflow-x:auto;">Loading...</div>
    </div>
  </div>

  <!-- Drift + History -->
  <div class="section grid grid-2">
    <div class="card">
      <div class="card-title">Drift Signals</div>
      <div id="drift-alerts">Loading...</div>
    </div>
    <div class="card">
      <div class="card-title">Memory Usage (last hour)</div>
      <div class="sparkline" id="mem-sparkline"></div>
    </div>
  </div>

<script>
const STATE_URL = '/state/latest';
const HISTORY_URL = '/state/history';
const REFRESH_MS = 15000;

function gaugeClass(pct, warnAt, critAt) {
  if (pct >= critAt) return 'crit';
  if (pct >= warnAt) return 'warn';
  return 'ok';
}

function updateGauge(id, value, label, pct, warnAt, critAt) {
  const el = document.getElementById(id);
  el.querySelector('.gauge-value').textContent = value;
  el.querySelector('.gauge-label').textContent = label;
  const fill = el.querySelector('.gauge-fill');
  fill.style.width = Math.min(pct, 100) + '%';
  fill.className = 'gauge-fill ' + gaugeClass(pct, warnAt, critAt);
}

function renderServices(services) {
  const el = document.getElementById('services');
  if (!services || services.length === 0) { el.innerHTML = '<div class="no-data">No services</div>'; return; }
  el.innerHTML = services.map(s => `
    <div class="svc-item">
      <span class="status-dot ${s.status}"></span>
      <span>${s.name}</span>
      <span class="latency">${s.latencyMs}ms</span>
    </div>
  `).join('');
}

function renderContainers(containers) {
  const el = document.getElementById('containers');
  if (!containers || containers.length === 0) { el.innerHTML = '<div class="no-data">No containers</div>'; return; }
  el.innerHTML = `
    <table class="container-table">
      <thead><tr><th>Name</th><th>Status</th><th>Health</th><th>Memory</th><th>Restarts</th><th>Uptime</th></tr></thead>
      <tbody>${containers.map(c => `
        <tr>
          <td>${c.name}</td>
          <td><span class="status-dot ${c.status === 'running' ? 'up' : 'down'}"></span> ${c.status}</td>
          <td>${c.health || 'n/a'}</td>
          <td>${c.memoryUsageMB} MB</td>
          <td>${c.restartCount}</td>
          <td style="color:var(--muted);font-size:11px">${c.uptime}</td>
        </tr>
      `).join('')}</tbody>
    </table>`;
}

function renderRunner(runner) {
  const el = document.getElementById('runner-info');
  if (!runner) { el.innerHTML = '<div class="no-data">Unknown</div>'; return; }
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <span class="tag ${runner.status}">${runner.status}</span>
      <span style="color:var(--muted)">PID ${runner.pid || 'n/a'}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;">
      ${runner.labels.map(l => `<span style="padding:2px 6px;background:rgba(255,255,255,0.06);border-radius:3px;font-size:10px;">${l}</span>`).join('')}
    </div>`;
}

function renderModels(ollama) {
  const el = document.getElementById('ollama-models');
  if (!ollama || ollama.status === 'down') {
    el.innerHTML = '<div class="no-data"><span class="status-dot down"></span> Ollama offline</div>';
    return;
  }
  if (ollama.models.length === 0) {
    el.innerHTML = '<div class="no-data">No models loaded</div>';
    return;
  }
  el.innerHTML = ollama.models.map(m => `
    <div class="model-item">
      <span>${m.name}</span>
      <span class="model-size">${m.size}</span>
    </div>
  `).join('');
}

function renderDrift(drift) {
  const el = document.getElementById('drift-alerts');
  if (!drift || drift.length === 0) {
    el.innerHTML = '<div style="color:var(--green);font-size:13px;">No drift detected</div>';
    return;
  }
  el.innerHTML = drift.map(d => `
    <div class="drift-item ${d.severity}">
      <span class="drift-label">${d.component}</span>
      <span>${d.expected} &rarr; ${d.actual}</span>
    </div>
  `).join('');
}

async function fetchHistory() {
  try {
    const res = await fetch(HISTORY_URL);
    const data = await res.json();
    const sparkEl = document.getElementById('mem-sparkline');
    if (!data.snapshots || data.snapshots.length < 2) {
      sparkEl.innerHTML = '<div class="no-data" style="width:100%">Collecting data...</div>';
      return;
    }
    const points = data.snapshots.slice(-60).map(s => s.system?.memory?.usedPercent || 0);
    const max = Math.max(...points, 1);
    sparkEl.innerHTML = points.map(p =>
      `<div class="spark-bar" style="height:${Math.max((p / max) * 100, 2)}%" title="${p}%"></div>`
    ).join('');
  } catch { /* ignore */ }
}

async function refresh() {
  try {
    const res = await fetch(STATE_URL);
    const snap = await res.json();

    // System status
    const statusEl = document.getElementById('system-status');
    const driftCount = (snap.drift || []).filter(d => d.severity === 'critical').length;
    const overallStatus = driftCount > 0 ? 'down' : (snap.drift?.length > 0 ? 'degraded' : 'up');
    const statusLabel = driftCount > 0 ? 'critical' : (snap.drift?.length > 0 ? 'degraded' : 'healthy');
    statusEl.innerHTML = `<span class="status-dot ${overallStatus}"></span> ${statusLabel}`;

    document.getElementById('last-update').textContent = new Date(snap.timestamp).toLocaleTimeString();

    // CPU
    const cpu = snap.system?.cpu;
    if (cpu) {
      const cpuPct = Math.round((cpu.loadAvg1m / cpu.cores) * 100);
      updateGauge('cpu-gauge', cpu.loadAvg1m.toFixed(1), `${cpu.cores} cores`, cpuPct, 70, 90);
    }

    // Memory
    const mem = snap.system?.memory;
    if (mem) {
      updateGauge('mem-gauge', mem.usedPercent + '%',
        `${(mem.usedMB/1024).toFixed(1)} / ${(mem.totalMB/1024).toFixed(0)} GB`,
        mem.usedPercent, 80, 90);
    }

    // Disk
    const disk = snap.system?.disk;
    if (disk) {
      updateGauge('disk-gauge', disk.usedPercent + '%',
        `${disk.usedGB} / ${disk.totalGB} GB`,
        disk.usedPercent, 75, 85);
    }

    // GPU
    const gpu = snap.system?.gpu;
    if (gpu) {
      updateGauge('gpu-gauge', gpu.utilPercent + '%',
        `${gpu.memoryUsedMB} / ${gpu.memoryTotalMB} MB`,
        gpu.utilPercent, 80, 95);
    } else {
      updateGauge('gpu-gauge', 'n/a', 'no GPU data', 0, 80, 95);
    }

    renderServices(snap.services);
    renderContainers(snap.containers);
    renderRunner(snap.runner);
    renderModels(snap.ollama);
    renderDrift(snap.drift);
    fetchHistory();

  } catch (err) {
    document.getElementById('system-status').innerHTML =
      `<span class="status-dot down"></span> connection error`;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
