# DGX Spark — Primary 24/7 Agent & Cron Runtime
# Hardware: Acer Veriton GN100 (NVIDIA Grace Blackwell GB10, 128GB, ARM64)
# Failover: GitHub Actions mirrors all cron schedules
#
# Code-Version: 1.0.0
# Branch: claude/dgx-spark-setup-UN9WR
# Date: 2026-03-29
# Owner: Lifetime Oy

services:
  # ==========================================================================
  # DWS IQ Backend (Express + all agents + node-cron schedulers)
  # ==========================================================================
  dws-backend:
    build:
      context: ../../
      dockerfile: infrastructure/dgx-spark/Dockerfile.backend
      platforms:
        - linux/arm64
    container_name: dws-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      # Ollama on host (DGX Spark native, not containerized)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Model routing: local first, API fallback
      LLM_PRIMARY: ollama
      LLM_FALLBACK: groq
      OLLAMA_MODEL: nemotron-3-super
      OLLAMA_MODEL_FAST: qwen3-coder:30b
      # Enable all schedulers
      ENABLE_CRON_JOBS: "true"
      ENABLE_MORNING_BRIEFING: "true"
      ENABLE_CONSTRUCTION_LEADS: "true"
      ENABLE_OUTREACH_DIGEST: "true"
      ENABLE_FIREHORSE_SCHEDULER: "true"
      ENABLE_INVESTOR_REPORTS: "true"
      ENABLE_ERP_SYNC: "true"
      # Heartbeat for failover detection
      HEARTBEAT_ENDPOINT: "true"
      HEARTBEAT_PORT: 9999
    volumes:
      - backend-logs:/app/logs
      - backup-data:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ==========================================================================
  # Cron Runner — All scheduled jobs (mirrors GitHub Actions schedules)
  # ==========================================================================
  dws-cron:
    build:
      context: ../../
      dockerfile: infrastructure/dgx-spark/Dockerfile.cron
      platforms:
        - linux/arm64
    container_name: dws-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PRIMARY: ollama
      LLM_FALLBACK: groq
      OLLAMA_MODEL: nemotron-3-super
      DWS_BACKEND_URL: http://dws-backend:8080
      # Heartbeat detection handled by the heartbeat container (:9999)
      # No HEARTBEAT_URL — cron-runner skips the periodic POST
    volumes:
      - backend-logs:/app/logs
      - backup-data:/app/backups
      - cron-state:/app/state
    depends_on:
      dws-backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ==========================================================================
  # Firehorse Report Engine
  # ==========================================================================
  firehorse-reports:
    build:
      context: ../../Firehorse
      dockerfile: api/Dockerfile
      platforms:
        - linux/arm64
    container_name: firehorse-reports
    restart: unless-stopped
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      PORT: 8084
    volumes:
      - firehorse-reports:/app/reports
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Redis (job queue, caching, rate limiting)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: dws-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # OpenClaw — Local autonomous agent runtime
  # EU-sovereign agent surface: no network egress; Brain wired to Nemotron 3 Super
  # via Ollama on the host. See DWS_DEPLOYMENT_STANDARD.md and field note
  # docs/field-notes/2026-03-29-dgx-spark-primary-runtime-setup.md §OpenClaw.
  # ==========================================================================
  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: dws-openclaw
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      PORT: 8090
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENCLAW_DEFAULT_MODEL: nemotron-3-super
      OPENCLAW_FAST_MODEL: qwen3-coder:30b
      # No egress by design — agent runtime stays inside the Spark LAN.
      # If a workload requires outbound calls, add the specific allow-list here
      # rather than opening egress wholesale.
      OPENCLAW_ALLOW_EGRESS: "false"
    volumes:
      - openclaw-state:/app/state
      - openclaw-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ==========================================================================
  # Heartbeat Service — Reports status to GitHub Actions failover
  # ==========================================================================
  heartbeat:
    build:
      context: .
      dockerfile: Dockerfile.heartbeat
      platforms:
        - linux/arm64
    container_name: dws-heartbeat
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      PORT: 9999
      CHECK_BACKEND: http://dws-backend:8080/health
      CHECK_CRON: http://dws-cron:8081/health
      CHECK_OLLAMA: http://host.docker.internal:11434/api/tags
      CHECK_REDIS: redis://redis:6379
      CHECK_OPENCLAW: http://openclaw:8090/health
      # GitHub repository for status reporting
      GITHUB_REPOSITORY: blogtheristo/dws6
    depends_on:
      dws-backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  backend-logs:
  backup-data:
  redis-data:
  firehorse-reports:
  cron-state:
  openclaw-state:
  openclaw-logs:

networks:
  default:
    name: dws-network
