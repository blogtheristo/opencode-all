# DGX Spark — Primary 24/7 Agent & Cron Runtime
# Hardware: Acer Veriton GN100 (NVIDIA Grace Blackwell GB10, 128GB, ARM64)
# Failover: GitHub Actions mirrors all cron schedules
#
# Code-Version: 1.1.0
# Introduced-In: PR-1045
# Branch: claude/aspire-isolated-mode-research-IXTT0
# Date: 2026-04-13
# Owner: Lifetime Oy
# Change: Added aspire-dashboard:13.2 (dashboard-only, option 1 from field note
#         2026-04-10-aspire-13-2-isolated-mode.md §2.4). No AppHost or .NET toolchain
#         required. OTEL_* env vars pre-wired to dws-backend and dws-cron — ignored
#         until @opentelemetry/sdk-node is added; establishes the contract.

services:
  # ==========================================================================
  # DWS IQ Backend (Express + all agents + node-cron schedulers)
  # ==========================================================================
  dws-backend:
    build:
      context: ../../
      dockerfile: infrastructure/dgx-spark/Dockerfile.backend
      platforms:
        - linux/arm64
    container_name: dws-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      # Ollama on host (DGX Spark native, not containerized)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Model routing: local first, API fallback
      LLM_PRIMARY: ollama
      LLM_FALLBACK: groq
      OLLAMA_MODEL: llama3.3:70b
      OLLAMA_MODEL_FAST: qwen2.5-coder:32b
      # Enable all schedulers
      ENABLE_CRON_JOBS: "true"
      ENABLE_MORNING_BRIEFING: "true"
      ENABLE_CONSTRUCTION_LEADS: "true"
      ENABLE_OUTREACH_DIGEST: "true"
      ENABLE_FIREHORSE_SCHEDULER: "true"
      ENABLE_INVESTOR_REPORTS: "true"
      ENABLE_ERP_SYNC: "true"
      # Heartbeat for failover detection
      HEARTBEAT_ENDPOINT: "true"
      HEARTBEAT_PORT: 9999
      # OpenTelemetry — pre-wired for Aspire Dashboard (active when @opentelemetry/sdk-node added)
      OTEL_SERVICE_NAME: dws-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - backend-logs:/app/logs
      - backup-data:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ==========================================================================
  # Cron Runner — All scheduled jobs (mirrors GitHub Actions schedules)
  # ==========================================================================
  dws-cron:
    build:
      context: ../../
      dockerfile: infrastructure/dgx-spark/Dockerfile.cron
      platforms:
        - linux/arm64
    container_name: dws-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PRIMARY: ollama
      LLM_FALLBACK: groq
      OLLAMA_MODEL: llama3.3:70b
      DWS_BACKEND_URL: http://dws-backend:8080
      # Heartbeat detection handled by the heartbeat container (:9999)
      # No HEARTBEAT_URL — cron-runner skips the periodic POST
      # OpenTelemetry — pre-wired for Aspire Dashboard (active when @opentelemetry/sdk-node added)
      OTEL_SERVICE_NAME: dws-cron
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - backend-logs:/app/logs
      - backup-data:/app/backups
      - cron-state:/app/state
    depends_on:
      dws-backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ==========================================================================
  # Firehorse Report Engine
  # ==========================================================================
  firehorse-reports:
    build:
      context: ../../Firehorse
      dockerfile: api/Dockerfile
      platforms:
        - linux/arm64
    container_name: firehorse-reports
    restart: unless-stopped
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      PORT: 8084
    volumes:
      - firehorse-reports:/app/reports
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Redis (job queue, caching, rate limiting)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: dws-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Heartbeat Service — Reports status to GitHub Actions failover
  # ==========================================================================
  heartbeat:
    build:
      context: .
      dockerfile: Dockerfile.heartbeat
      platforms:
        - linux/arm64
    container_name: dws-heartbeat
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      PORT: 9999
      CHECK_BACKEND: http://dws-backend:8080/health
      CHECK_CRON: http://dws-cron:8081/health
      CHECK_OLLAMA: http://host.docker.internal:11434/api/tags
      CHECK_REDIS: redis://redis:6379
      CHECK_ASPIRE: http://aspire-dashboard:18888/health
      # GitHub repository for status reporting
      GITHUB_REPOSITORY: blogtheristo/dws6
    depends_on:
      dws-backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================================================
  # Aspire Dashboard 13.2 — Distributed traces, metrics, logs (OTel aggregator)
  # Dashboard-only install — no AppHost or .NET toolchain required.
  # UI:        http://dgx-spark:18888   (browser)
  # OTLP gRPC: http://aspire-dashboard:18889  (services push telemetry here)
  # Ref: docs/field-notes/2026-04-10-aspire-13-2-isolated-mode.md §2.4 option 1
  # ==========================================================================
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.2
    container_name: aspire-dashboard
    restart: unless-stopped
    ports:
      - "18888:18888" # Dashboard UI
      - "18889:18889" # OTLP gRPC ingest
    environment:
      DASHBOARD__UNSECUREDALLOWANONYMOUS: "true"
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  backend-logs:
  backup-data:
  redis-data:
  firehorse-reports:
  cron-state:

networks:
  default:
    name: dws-network
