version: '3.9'

# =============================================================================
# LIFETIME WORLD - LOCAL LLM TRAINING INFRASTRUCTURE
# =============================================================================
# Target Hardware: 2x Acer Veriton GN-100 (NVIDIA GB10 Superchip)
#
# Capabilities:
#   - Fine-tuning: 7B-13B models (full), 70B models (LoRA/QLoRA)
#   - Dataset preprocessing and validation
#   - Hyperparameter optimization
#   - Model quantization (GGUF, AWQ, GPTQ)
#   - Inference testing and evaluation
#
# Quick Start:
#   1. cp .env.training.example .env.training
#   2. Edit .env.training with paths and config
#   3. docker-compose -f docker-compose.training.yml up -d
#
# =============================================================================

services:
  # ===========================================================================
  # TRAINING ORCHESTRATOR - Manages distributed training across GN-100 nodes
  # ===========================================================================
  training-orchestrator:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    container_name: llm-training-orchestrator
    runtime: nvidia
    restart: unless-stopped
    environment:
      # NVIDIA Configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      
      # Distributed Training
      - MASTER_ADDR=${MASTER_NODE_IP:-127.0.0.1}
      - MASTER_PORT=${MASTER_PORT:-29500}
      - WORLD_SIZE=${WORLD_SIZE:-2}
      - RANK=${NODE_RANK:-0}
      - LOCAL_RANK=0
      
      # Memory Optimization for GB10 (128GB unified)
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - CUDA_MEMORY_FRACTION=${CUDA_MEMORY_FRACTION:-0.95}
      
      # Training Configuration
      - HF_HOME=/models/huggingface
      - TRANSFORMERS_CACHE=/models/transformers
      - HF_TOKEN=${HF_TOKEN}
      
      # Weights & Biases (optional)
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_PROJECT=${WANDB_PROJECT:-lifetime-world-model}
      
      # MLflow Tracking
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT:-lifetime-llm-training}
    volumes:
      - ${MODELS_PATH:-./models}:/models
      - ${DATASETS_PATH:-./datasets}:/datasets
      - ${CHECKPOINTS_PATH:-./checkpoints}:/checkpoints
      - ${OUTPUTS_PATH:-./outputs}:/outputs
      - ${SCRIPTS_PATH:-./scripts}:/scripts
      - ./configs:/configs:ro
    ports:
      - "${TRAINING_API_PORT:-8890}:8890"
      - "${TENSORBOARD_PORT:-6006}:6006"
    networks:
      - training-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
        pip install --no-cache-dir \
          transformers>=4.57.6 \
          datasets>=2.16.0 \
          accelerate>=0.26.0 \
          peft>=0.7.0 \
          bitsandbytes>=0.42.0 \
          trl>=0.7.0 \
          wandb \
          mlflow>=3.11.0 \
          deepspeed>=0.13.0 \
          flash-attn --no-build-isolation &&
        python -m http.server 8890 --directory /outputs
      "

  # ===========================================================================
  # DATASET PROCESSOR - Preprocessing and validation pipeline
  # ===========================================================================
  dataset-processor:
    image: python:3.11-slim
    container_name: llm-dataset-processor
    restart: unless-stopped
    environment:
      - HF_HOME=/models/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - DATASET_WORKERS=${DATASET_WORKERS:-8}
    volumes:
      - ${DATASETS_PATH:-./datasets}:/datasets
      - ${RAW_DATA_PATH:-./raw-data}:/raw-data
      - ./scripts:/scripts:ro
    networks:
      - training-network
    command: >
      bash -c "
        pip install --no-cache-dir \
          datasets>=2.16.0 \
          tokenizers>=0.15.0 \
          pandas \
          pyarrow \
          fastparquet &&
        tail -f /dev/null
      "

  # ===========================================================================
  # MLFLOW - Experiment Tracking & Model Registry
  # ===========================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.9.0
    container_name: llm-mlflow
    restart: unless-stopped
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:${POSTGRES_PASSWORD:-mlflow_secret}@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow-artifacts
    volumes:
      - ${MLFLOW_ARTIFACTS:-./mlflow-artifacts}:/mlflow-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    networks:
      - training-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
        --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD:-mlflow_secret}@postgres:5432/mlflow
        --default-artifact-root /mlflow-artifacts
        --host 0.0.0.0
        --port 5000

  # ===========================================================================
  # POSTGRESQL - MLflow Backend Store
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: llm-training-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlflow_secret}
      - POSTGRES_DB=mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - training-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MINIO - S3-Compatible Object Storage for Checkpoints
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: llm-training-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-lifetime}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-lifetime_secret_key}
    volumes:
      - ${MINIO_DATA:-./minio-data}:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - training-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # REDIS - Job Queue & Caching
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: llm-training-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - training-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # JUPYTER - Interactive Development
  # ===========================================================================
  jupyter:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    container_name: llm-training-jupyter
    runtime: nvidia
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-lifetime2026}
      - HF_HOME=/models/huggingface
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${NOTEBOOKS_PATH:-./notebooks}:/notebooks
      - ${MODELS_PATH:-./models}:/models
      - ${DATASETS_PATH:-./datasets}:/datasets
      - ${CHECKPOINTS_PATH:-./checkpoints}:/checkpoints
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    networks:
      - training-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      bash -c "
        pip install --no-cache-dir \
          jupyterlab \
          transformers>=4.57.6 \
          datasets>=2.16.0 \
          accelerate>=0.26.0 \
          peft>=0.7.0 \
          bitsandbytes>=0.42.0 &&
        jupyter lab \
          --ip=0.0.0.0 \
          --port=8888 \
          --no-browser \
          --allow-root \
          --notebook-dir=/notebooks
      "

  # ===========================================================================
  # VLLM INFERENCE - Model Testing & Evaluation
  # ===========================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: llm-vllm-inference
    runtime: nvidia
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${MODELS_PATH:-./models}:/models
    ports:
      - "${VLLM_PORT:-8000}:8000"
    networks:
      - training-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model ${INFERENCE_MODEL:-/models/outputs/latest}
      --tensor-parallel-size ${TENSOR_PARALLEL:-1}
      --gpu-memory-utilization 0.9
      --max-model-len ${MAX_MODEL_LEN:-4096}
    profiles:
      - inference

  # ===========================================================================
  # QUANTIZATION - GGUF/AWQ/GPTQ Model Compression
  # ===========================================================================
  quantizer:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    container_name: llm-quantizer
    runtime: nvidia
    restart: "no"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${MODELS_PATH:-./models}:/models
      - ${OUTPUTS_PATH:-./outputs}:/outputs
      - ./scripts:/scripts:ro
    networks:
      - training-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
        pip install --no-cache-dir \
          auto-gptq>=0.6.0 \
          autoawq>=0.1.8 \
          llama-cpp-python &&
        echo 'Quantizer ready. Run: docker exec -it llm-quantizer python /scripts/quantize.py'
      "
    profiles:
      - quantization

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  training-network:
    name: llm-training-network
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
