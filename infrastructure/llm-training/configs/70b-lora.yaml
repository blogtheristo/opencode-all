# =============================================================================
# 70B QLoRA config — hybrid GN100 (QLoRA-only) / GCP A3 Mega
# =============================================================================
# The path referenced by scripts/train-70b-lora.py and the README quick-start.
# On the GN100 this runs QLoRA-only (4-bit); on GCP A3 Mega it can also drive a
# full fine-tune (see 70b-full.yaml). Bridge Track / Professional tier.
# =============================================================================

# Model
model_name: "meta-llama/Llama-3.3-70B-Instruct"
use_4bit: true
use_8bit: false
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
use_double_quant: true

# LoRA
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training
output_dir: "/checkpoints/70b-lora"
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
max_seq_length: 2048
fp16: false
bf16: true
gradient_checkpointing: true
optim: "paged_adamw_8bit"

# Data
dataset_name: null
dataset_path: null
text_column: "text"
max_samples: null

# Evaluation
eval_dataset_path: null

# Logging / checkpoints
logging_steps: 10
save_steps: 100
eval_steps: 100
save_total_limit: 3

# Tracking
use_wandb: true
wandb_project: "lifetime-world-model"
use_mlflow: true
mlflow_experiment: "lifetime-llm-training-70b"
