# =============================================================================
# 70B full fine-tune config — GCP A3 Mega (8x H100 80GB) only
# =============================================================================
# The path referenced by the README cloud-burst quick-start:
#   torchrun --nproc_per_node=8 train-70b-lora.py --config /configs/70b-full.yaml
# Full fine-tune is NOT feasible on the GN100 — cloud only (Enterprise tier).
# =============================================================================

# Model — full-precision fine-tune, no 4-bit quantization
model_name: "meta-llama/Llama-3.3-70B-Instruct"
use_4bit: false
use_8bit: false
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
use_double_quant: false

# LoRA — a full fine-tune still applies LoRA adapters at high rank on A3 Mega;
# set target_modules broad. (Full-parameter SFT is driven by torchrun/FSDP.)
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training
output_dir: "/checkpoints/70b-full"
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0001
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
max_seq_length: 4096
fp16: false
bf16: true
gradient_checkpointing: true
optim: "paged_adamw_8bit"

# Data
dataset_name: null
dataset_path: null
text_column: "text"
max_samples: null

# Evaluation
eval_dataset_path: null

# Logging / checkpoints
logging_steps: 10
save_steps: 200
eval_steps: 200
save_total_limit: 3

# Tracking
use_wandb: true
wandb_project: "lifetime-world-model"
use_mlflow: true
mlflow_experiment: "lifetime-llm-training-70b-full"
