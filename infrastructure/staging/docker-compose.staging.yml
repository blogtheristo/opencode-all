# DWS IQ 6 — Staging Runtime
#
# Mirrors the DGX Spark production compose (infrastructure/dgx-spark/docker-compose.yml)
# with lower resource limits and staging-specific env overrides.
#
# Usage (on staging host):
#   cp staging.env.example .env   # fill in staging values
#   docker compose -f infrastructure/staging/docker-compose.staging.yml up -d
#
# Key differences from production:
#   - NODE_ENV=staging (not production)
#   - Lower memory limits (2G backend, 1G cron)
#   - Cron jobs disabled except core health checks
#   - ERP integrations disabled (mock mode)
#   - Redis DB 1 (separate from production DB 0)
#   - No heartbeat failover container
#
# Code-Version: 1.0.0
# Branch: claude/fix-v1-features-wODI5-1QXGi
# Date: 2026-04-15
# Owner: Lifetime Oy

services:
  # ==========================================================================
  # DWS IQ Backend (Express + agents)
  # ==========================================================================
  dws-backend:
    build:
      context: ../../
      dockerfile: infrastructure/dgx-spark/Dockerfile.backend
    container_name: dws-backend-staging
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: staging
      PORT: 8080
      LOG_LEVEL: debug
      DETAILED_ERRORS: "true"
      # Disable all heavy scheduled jobs in staging
      ENABLE_CRON_JOBS: "false"
      ENABLE_MORNING_BRIEFING: "false"
      ENABLE_CONSTRUCTION_LEADS: "false"
      ENABLE_OUTREACH_DIGEST: "false"
      ENABLE_FIREHORSE_SCHEDULER: "false"
      ENABLE_INVESTOR_REPORTS: "false"
      ENABLE_ERP_SYNC: "false"
      # ERP integrations off — mock responses only
      ENABLE_SAP_INTEGRATION: "false"
      ENABLE_IFS_INTEGRATION: "false"
      ENABLE_DYNAMICS_INTEGRATION: "false"
      ENABLE_MONITOR_INTEGRATION: "false"
      ENABLE_VISMA_INTEGRATION: "false"
      ENABLE_JEEVES_INTEGRATION: "false"
      # EU AI Act Article 12 audit — production-only
      SOVEREIGNTY_AUDIT_ENABLED: "false"
      # Redis DB 1 (isolated from production DB 0)
      REDIS_URL: redis://redis-staging:6379/1
      # No DGX Spark Ollama in staging — use API models
      LLM_PRIMARY: groq
      LLM_FALLBACK: scaleway
    volumes:
      - staging-backend-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis-staging:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================================================
  # Redis (staging — isolated DB index, no persistence)
  # ==========================================================================
  redis-staging:
    image: redis:7-alpine
    container_name: dws-redis-staging
    restart: unless-stopped
    ports:
      - "6380:6379"
    # No volume — staging Redis is ephemeral (data loss on restart is acceptable)
    command: redis-server --save "" --appendonly no
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  staging-backend-logs:

networks:
  default:
    name: dws-staging-network
