version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dws-postgres
    environment:
      POSTGRES_USER: dws_user
      POSTGRES_PASSWORD: dws_password_dev
      POSTGRES_DB: dws_auth_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dws_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dws-network

  # Redis Session Store
  redis:
    image: redis:7-alpine
    container_name: dws-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dws-network

  # Auth Backend Service (optional - for containerized development)
  auth-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dws-auth-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://dws_user:dws_password_dev@postgres:5432/dws_auth_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: dev_secret_key_change_in_production_min_32_chars
      BCRYPT_ROUNDS: 10
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - /app/node_modules
    networks:
      - dws-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  dws-network:
    driver: bridge

