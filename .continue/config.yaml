name: DWS Ollama Tunnel
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder 32B (Tunnel)
    provider: ollama
    model: qwen2.5-coder:32b
    apiBase: http://127.0.0.1:11435
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

context:
  - provider: diff
  - provider: file
  - provider: code
  - provider: terminal

rules:
  - Use SSH to admin100@192.168.101.113 (DGX interface wlP9s9) with -L 127.0.0.1:11435:localhost:11434; Continue apiBase stays http://127.0.0.1:11435.
  - Assume the remote host serves qwen2.5-coder:32b via Ollama.
