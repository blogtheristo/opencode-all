name: DWS Ollama Tunnel
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder 32B (Tunnel)
    provider: ollama
    model: qwen2.5-coder:32b
    apiBase: http://localhost:11435
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

context:
  - provider: diff
  - provider: file
  - provider: code
  - provider: terminal

rules:
  - Use the SSH tunnel on localhost:11435 for Ollama access.
  - Assume the remote host serves qwen2.5-coder:32b via Ollama.
